name: Native Windows results interoperability candidate

on:
  push:
    branches: [feature/cwl-dag-icon]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: results-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      asset_sha256: ${{ steps.package.outputs.asset_sha256 }}
      update_sha256: ${{ steps.package.outputs.update_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recover immutable application inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-inputs candidate
          curl --fail --location --retry 3 'https://github.com/comparativechrono/workbench/releases/download/app-v0.6.0/native-workbench-0.6.0-starter-windows.zip' -o build-inputs/starter.zip
          curl --fail --location --retry 3 'https://github.com/comparativechrono/workbench/releases/download/app-v0.6.0/native-workbench-0.6.0-source.zip' -o build-inputs/source.zip
          curl --fail --location --retry 3 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz' -o build-inputs/compiler.tar.xz
          sha256sum --check <<'SUMS'
          16fa802304c734b5721d838ff38b7e90ed36ccfc185a22239859cc3762af695a  build-inputs/starter.zip
          427a9b42f2528984350479e8b0155e4ef4f0159fa6f240cc1aa84a5ec2e0e60a  build-inputs/source.zip
          bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21  build-inputs/compiler.tar.xz
          SUMS
          unzip -q build-inputs/starter.zip -d build-inputs/frozen
          tar -xf build-inputs/compiler.tar.xz -C build-inputs
      - name: Compile native desktop and bridge with strict warnings
        shell: bash
        run: |
          set -euo pipefail
          export BW_MINGW_ROOT="$GITHUB_WORKSPACE/build-inputs/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64"
          bash desktop/build_desktop_workspace.sh
          bash desktop/build_bridge.sh
          bash desktop/build_workspace_update_launcher.sh
      - name: Install independent CWL reference validator for tests only
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cwl-validation"
          "$RUNNER_TEMP/cwl-validation/bin/python" -m pip install --disable-pip-version-check 'cwltool==3.3.20260925135507'
      - name: Check source session and packaging contracts
        env:
          NW_CWLTOOL: ${{ runner.temp }}/cwl-validation/bin/cwltool
        shell: bash
        run: |
          set -euo pipefail
          python3 workspace/tests/test_engine_paths.py
          python3 workspace/tests/test_workflow_inputs.py
          python3 workspace/tests/test_catalog_presentation.py
          python3 workspace/tests/test_desktop_modes.py
          python3 workspace/tests/test_desktop_host.py
          python3 workspace/tests/test_reference_service.py
          python3 tests/test_split_release.py
          python3 tests/test_core_update.py
          python3 workspace/tests/test_cwl_export.py
          python3 workspace/tests/test_cwl_results.py
          python3 workspace/tests/test_pack_versions.py
          python3 tests/test_dag_routing.py
          python3 tests/test_app_icon.py
      - name: Freeze reviewable development archives
        id: package
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/package_split.py sources --base-root build-inputs/frozen/native-workbench --base-source-archive build-inputs/source.zip --output candidate/native-workbench-0.9.0-source.zip --metadata candidate/source-metadata.json
          python3 scripts/package_split.py stage --base-root build-inputs/frozen/native-workbench --app-root stage/native-workbench --source-metadata candidate/source-metadata.json
          python3 scripts/package_split.py starter --app-root stage/native-workbench --output candidate/native-workbench-0.9.0-starter-windows.zip
          python3 scripts/make_core_update.py --base-root build-inputs/frozen/native-workbench --app-root stage/native-workbench --output update-stage --launcher build/desktop/UpdateWorkbench.exe --zip candidate/native-workbench-0.9.0-update-from-0.6.0.zip
          python3 - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          archives=[]
          for path in sorted(Path('candidate').glob('*.zip')):
              archives.append({'file':path.name,'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          Path('candidate/BUILD-PROVENANCE.json').write_text(json.dumps({'schema':1,'status':'development candidate; not a published release','sourceCommit':os.environ['SOURCE_COMMIT'],'platform':platform.platform(),'compiler':'LLVM-MinGW 20260922 UCRT','compilerArchiveSha256':'bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21','nativeWindowsExecutedByBuilder':False,'archives':archives},indent=2)+'\n')
          Path('candidate/SHA256SUMS.txt').write_text(''.join(row['sha256']+'  '+row['file']+'\n' for row in archives))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for label,ending in [('asset_sha256','starter-windows.zip'),('update_sha256','update-from-0.6.0.zip')]:
                  out.write(label+'='+next(row['sha256'] for row in archives if row['file'].endswith(ending))+'\n')
          PY
      - name: Retain exact candidate and matching sources
        uses: actions/upload-artifact@v4
        with:
          name: results-candidate-${{ github.sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 30

  native:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        folder: [ordinary, 'path with spaces']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: results-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ui-candidate
      - name: Verify exact candidate and prepare disposable installation
        id: prepare
        shell: pwsh
        env:
          CASE_FOLDER: ${{ matrix.folder }}
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
          UPDATE_SHA256: ${{ needs.build.outputs.update_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'ui-candidate'
          $starter = Join-Path $candidate 'native-workbench-0.9.0-starter-windows.zip'
          $update = Join-Path $candidate 'native-workbench-0.9.0-update-from-0.6.0.zip'
          if ((Get-FileHash $starter -Algorithm SHA256).Hash -ne $env:ASSET_SHA256) { throw 'Candidate SHA-256 mismatch.' }
          if ((Get-FileHash $update -Algorithm SHA256).Hash -ne $env:UPDATE_SHA256) { throw 'Updater SHA-256 mismatch.' }
          $caseRoot = Join-Path $env:RUNNER_TEMP $env:CASE_FOLDER
          Expand-Archive $starter $caseRoot
          Expand-Archive $update (Join-Path $caseRoot 'core updater')
          $baseline = Join-Path $env:RUNNER_TEMP 'reference-base-0.6.0.zip'
          Invoke-WebRequest -Uri 'https://github.com/comparativechrono/workbench/releases/download/app-v0.6.0/native-workbench-0.6.0-starter-windows.zip' -OutFile $baseline
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash -ne '16fa802304c734b5721d838ff38b7e90ed36ccfc185a22239859cc3762af695a') { throw 'Baseline SHA-256 mismatch.' }
          Expand-Archive $baseline (Join-Path $caseRoot 'update target')
          $pack = Join-Path $env:RUNNER_TEMP 'reference-optional-reads.zip'
          Invoke-WebRequest -Uri 'https://github.com/comparativechrono/workbench/releases/download/pack-reads-v0.4.0/native-workbench-pack-reads-0.4.0.zip' -OutFile $pack
          if ((Get-FileHash $pack -Algorithm SHA256).Hash -ne '2dd05fece8deb2b0178d8b1bc2b6830f175b3fbc2f5a4d48f9c9023cbfe6775b') { throw 'Optional pack SHA-256 mismatch.' }
      - name: Exercise native three-pane tools and workflow interactions
        shell: pwsh
        env:
          CASE_FOLDER: ${{ matrix.folder }}
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path (Join-Path $env:RUNNER_TEMP $env:CASE_FOLDER) 'native-workbench'
          $python = Join-Path $app 'runtime/python/python.exe'
          & $python -I scripts/check_workspace_ui_windows.py --app-root $app --report "$env:RUNNER_TEMP/workspace-ui-evidence/native-ui.json" --source-commit $env:SOURCE_COMMIT --asset-sha256 $env:ASSET_SHA256 --asset-name 'native-workbench-0.9.0-starter-windows.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Native workspace UI gate failed.' }
      - name: Verify CWL results, routed DAGs and native application icons
        shell: pwsh
        env:
          CASE_FOLDER: ${{ matrix.folder }}
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path (Join-Path $env:RUNNER_TEMP $env:CASE_FOLDER) 'native-workbench'
          & (Join-Path $app 'runtime/python/python.exe') -I scripts/check_results_windows.py --app-root $app --report "$env:RUNNER_TEMP/results-feature-evidence/native-results.json" --source-commit $env:SOURCE_COMMIT --asset-sha256 $env:ASSET_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Native results interoperability gate failed.' }
      - name: Recheck References and preserved user data against same candidate
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        shell: pwsh
        env:
          CASE_FOLDER: ${{ matrix.folder }}
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
          UPDATE_SHA256: ${{ needs.build.outputs.update_sha256 }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $caseRoot = Join-Path $env:RUNNER_TEMP $env:CASE_FOLDER
          $app = Join-Path $caseRoot 'native-workbench'
          $python = Join-Path $app 'runtime/python/python.exe'
          & $python -I scripts/check_references_windows.py --app-root $app --report "$env:RUNNER_TEMP/workspace-reference-evidence/native-references.json" --source-commit $env:SOURCE_COMMIT --asset-sha256 $env:ASSET_SHA256 --asset-name 'native-workbench-0.9.0-starter-windows.zip' --release-tag 'unpublished-ui-candidate' --update-root (Join-Path $caseRoot 'core updater') --base-app-root (Join-Path $caseRoot 'update target/native-workbench') --update-archive "$env:RUNNER_TEMP/ui-candidate/native-workbench-0.9.0-update-from-0.6.0.zip" --update-sha256 $env:UPDATE_SHA256 --optional-pack-archive "$env:RUNNER_TEMP/reference-optional-reads.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Native reference regression gate failed.' }
      - name: Retain native reports and pixel captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-windows-${{ matrix.folder }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/workspace-ui-evidence
            ${{ runner.temp }}/workspace-reference-evidence
            ${{ runner.temp }}/results-feature-evidence
          if-no-files-found: error
          retention-days: 30


  native-long-paths:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: results-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/long-path-candidate
      - name: Recheck complete scientific results without Windows long-path opt-in
        shell: pwsh
        env:
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'long-path-candidate/native-workbench-0.9.0-starter-windows.zip'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:ASSET_SHA256) { throw 'Candidate SHA-256 mismatch.' }
          $appRoot = Join-Path $env:RUNNER_TEMP 'long-path-fixed'
          Expand-Archive $archive $appRoot
          $app = Join-Path $appRoot 'native-workbench'
          $evidence = Join-Path $env:RUNNER_TEMP 'long-path-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $before = Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue
          $hadValue = $null -ne $before
          $oldValue = if ($hadValue) { [int]$before.LongPathsEnabled } else { $null }
          $setup = @{ scope = 'Disposable hosted CI runner only; no application or user-machine policy changes'; previousValue = $oldValue; requestedValue = 0; restored = $false }
          try {
            New-ItemProperty -Path $key -Name LongPathsEnabled -PropertyType DWord -Value 0 -Force | Out-Null
            $setup.observedValue = [int](Get-ItemPropertyValue -Path $key -Name LongPathsEnabled)
            if ($setup.observedValue -ne 0) { throw 'Could not establish disabled-policy regression environment.' }
            $setup | ConvertTo-Json | Set-Content (Join-Path $evidence 'policy-setup.json')
            # All application interpreters start after the policy change, avoiding
            # a previously cached process-wide Windows path-policy value.
            & (Join-Path $app 'runtime/python/python.exe') -I scripts/check_long_paths_windows.py --app-root $app --output-root (Join-Path $env:RUNNER_TEMP 'new synthetic check') --report (Join-Path $evidence 'native-long-paths.json') --source-commit $env:SOURCE_COMMIT --asset-sha256 $env:ASSET_SHA256
            if ($LASTEXITCODE -ne 0) { throw 'The exact results candidate failed the native long-path scientific regression.' }
          } finally {
            if ($hadValue) {
              Set-ItemProperty -Path $key -Name LongPathsEnabled -Value $oldValue
              $setup.restoredValue = [int](Get-ItemPropertyValue -Path $key -Name LongPathsEnabled)
              $setup.restored = $setup.restoredValue -eq $oldValue
            } else {
              Remove-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue
              $setup.restored = $null -eq (Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue)
            }
            $setup | ConvertTo-Json | Set-Content (Join-Path $evidence 'policy-setup.json')
            if (-not $setup.restored) { throw 'Disposable runner policy was not restored.' }
          }
      - name: Retain exact long-path scientific evidence and policy restoration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-long-paths-${{ github.sha }}
          path: ${{ runner.temp }}/long-path-evidence
          if-no-files-found: error
          retention-days: 30
