name: Native Windows workspace UI candidate

on:
  push:
    branches: [ui/galaxy-native-workspace]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      asset_sha256: ${{ steps.package.outputs.asset_sha256 }}
      update_sha256: ${{ steps.package.outputs.update_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recover immutable application inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-inputs candidate
          curl --fail --location --retry 3 'https://github.com/comparativechrono/workbench/releases/download/app-v0.6.0/native-workbench-0.6.0-starter-windows.zip' -o build-inputs/starter.zip
          curl --fail --location --retry 3 'https://github.com/comparativechrono/workbench/releases/download/app-v0.6.0/native-workbench-0.6.0-source.zip' -o build-inputs/source.zip
          curl --fail --location --retry 3 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz' -o build-inputs/compiler.tar.xz
          sha256sum --check <<'SUMS'
          16fa802304c734b5721d838ff38b7e90ed36ccfc185a22239859cc3762af695a  build-inputs/starter.zip
          427a9b42f2528984350479e8b0155e4ef4f0159fa6f240cc1aa84a5ec2e0e60a  build-inputs/source.zip
          bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21  build-inputs/compiler.tar.xz
          SUMS
          unzip -q build-inputs/starter.zip -d build-inputs/frozen
          tar -xf build-inputs/compiler.tar.xz -C build-inputs
      - name: Compile native desktop and bridge with strict warnings
        shell: bash
        run: |
          set -euo pipefail
          export BW_MINGW_ROOT="$GITHUB_WORKSPACE/build-inputs/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64"
          bash desktop/build_desktop_workspace.sh
          bash desktop/build_bridge.sh
          bash desktop/build_workspace_update_launcher.sh
      - name: Check source session and packaging contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 workspace/tests/test_engine_paths.py
          python3 workspace/tests/test_workflow_inputs.py
          python3 workspace/tests/test_catalog_presentation.py
          python3 workspace/tests/test_desktop_modes.py
          python3 workspace/tests/test_desktop_host.py
          python3 workspace/tests/test_reference_service.py
          python3 tests/test_split_release.py
          python3 tests/test_core_update.py
      - name: Freeze reviewable development archives
        id: package
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/package_split.py sources --base-root build-inputs/frozen/native-workbench --base-source-archive build-inputs/source.zip --output candidate/native-workbench-0.8.0-source.zip --metadata candidate/source-metadata.json
          python3 scripts/package_split.py stage --base-root build-inputs/frozen/native-workbench --app-root stage/native-workbench --source-metadata candidate/source-metadata.json
          python3 scripts/package_split.py starter --app-root stage/native-workbench --output candidate/native-workbench-0.8.0-starter-windows.zip
          python3 scripts/make_core_update.py --base-root build-inputs/frozen/native-workbench --app-root stage/native-workbench --output update-stage --launcher build/desktop/UpdateWorkbench.exe --zip candidate/native-workbench-0.8.0-update-from-0.6.0.zip
          python3 - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          archives=[]
          for path in sorted(Path('candidate').glob('*.zip')):
              archives.append({'file':path.name,'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          Path('candidate/BUILD-PROVENANCE.json').write_text(json.dumps({'schema':1,'status':'development candidate; not a published release','sourceCommit':os.environ['SOURCE_COMMIT'],'platform':platform.platform(),'compiler':'LLVM-MinGW 20260922 UCRT','compilerArchiveSha256':'bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21','nativeWindowsExecutedByBuilder':False,'archives':archives},indent=2)+'\n')
          Path('candidate/SHA256SUMS.txt').write_text(''.join(row['sha256']+'  '+row['file']+'\n' for row in archives))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for label,ending in [('asset_sha256','starter-windows.zip'),('update_sha256','update-from-0.6.0.zip')]:
                  out.write(label+'='+next(row['sha256'] for row in archives if row['file'].endswith(ending))+'\n')
          PY
      - name: Retain exact candidate and matching sources
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-candidate-${{ github.sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 30

  native:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        folder: [ordinary, 'path with spaces']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: workspace-ui-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ui-candidate
      - name: Verify exact candidate and prepare disposable installation
        id: prepare
        shell: pwsh
        env:
          CASE_FOLDER: ${{ matrix.folder }}
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
          UPDATE_SHA256: ${{ needs.build.outputs.update_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'ui-candidate'
          $starter = Join-Path $candidate 'native-workbench-0.8.0-starter-windows.zip'
          $update = Join-Path $candidate 'native-workbench-0.8.0-update-from-0.6.0.zip'
          if ((Get-FileHash $starter -Algorithm SHA256).Hash -ne $env:ASSET_SHA256) { throw 'Candidate SHA-256 mismatch.' }
          if ((Get-FileHash $update -Algorithm SHA256).Hash -ne $env:UPDATE_SHA256) { throw 'Updater SHA-256 mismatch.' }
          $caseRoot = Join-Path $env:RUNNER_TEMP $env:CASE_FOLDER
          Expand-Archive $starter $caseRoot
          Expand-Archive $update (Join-Path $caseRoot 'core updater')
          $baseline = Join-Path $env:RUNNER_TEMP 'reference-base-0.6.0.zip'
          Invoke-WebRequest -Uri 'https://github.com/comparativechrono/workbench/releases/download/app-v0.6.0/native-workbench-0.6.0-starter-windows.zip' -OutFile $baseline
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash -ne '16fa802304c734b5721d838ff38b7e90ed36ccfc185a22239859cc3762af695a') { throw 'Baseline SHA-256 mismatch.' }
          Expand-Archive $baseline (Join-Path $caseRoot 'update target')
          $pack = Join-Path $env:RUNNER_TEMP 'reference-optional-reads.zip'
          Invoke-WebRequest -Uri 'https://github.com/comparativechrono/workbench/releases/download/pack-reads-v0.4.0/native-workbench-pack-reads-0.4.0.zip' -OutFile $pack
          if ((Get-FileHash $pack -Algorithm SHA256).Hash -ne '2dd05fece8deb2b0178d8b1bc2b6830f175b3fbc2f5a4d48f9c9023cbfe6775b') { throw 'Optional pack SHA-256 mismatch.' }
      - name: Exercise native three-pane tools and workflow interactions
        shell: pwsh
        env:
          CASE_FOLDER: ${{ matrix.folder }}
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path (Join-Path $env:RUNNER_TEMP $env:CASE_FOLDER) 'native-workbench'
          $python = Join-Path $app 'runtime/python/python.exe'
          & $python -I scripts/check_workspace_ui_windows.py --app-root $app --report "$env:RUNNER_TEMP/workspace-ui-evidence/native-ui.json" --source-commit $env:SOURCE_COMMIT --asset-sha256 $env:ASSET_SHA256 --asset-name 'native-workbench-0.8.0-starter-windows.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Native workspace UI gate failed.' }
      - name: Recheck References and preserved user data against same candidate
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        shell: pwsh
        env:
          CASE_FOLDER: ${{ matrix.folder }}
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
          UPDATE_SHA256: ${{ needs.build.outputs.update_sha256 }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $caseRoot = Join-Path $env:RUNNER_TEMP $env:CASE_FOLDER
          $app = Join-Path $caseRoot 'native-workbench'
          $python = Join-Path $app 'runtime/python/python.exe'
          & $python -I scripts/check_references_windows.py --app-root $app --report "$env:RUNNER_TEMP/workspace-reference-evidence/native-references.json" --source-commit $env:SOURCE_COMMIT --asset-sha256 $env:ASSET_SHA256 --asset-name 'native-workbench-0.8.0-starter-windows.zip' --release-tag 'unpublished-ui-candidate' --update-root (Join-Path $caseRoot 'core updater') --base-app-root (Join-Path $caseRoot 'update target/native-workbench') --update-archive "$env:RUNNER_TEMP/ui-candidate/native-workbench-0.8.0-update-from-0.6.0.zip" --update-sha256 $env:UPDATE_SHA256 --optional-pack-archive "$env:RUNNER_TEMP/reference-optional-reads.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Native reference regression gate failed.' }
      - name: Retain native reports and pixel captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-windows-${{ matrix.folder }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/workspace-ui-evidence
            ${{ runner.temp }}/workspace-reference-evidence
          if-no-files-found: error
          retention-days: 30

  native-scroll-frames:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: workspace-ui-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/scroll-candidate
      - name: Recover unchanged pre-fix package for temporal comparison
        id: prior
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: workspace-ui-candidate-0d3282046d7aa05dc822315c9a237c8ac534cd7a
          run-id: 37449356224
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/scroll-prior-candidate
      - name: Observe scrolling frames and precision-wheel routing in exact old and new packages
        shell: pwsh
        env:
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
          SOURCE_COMMIT: ${{ github.sha }}
          PRIOR_DOWNLOAD_OUTCOME: ${{ steps.prior.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $newZip = Join-Path $env:RUNNER_TEMP 'scroll-candidate/native-workbench-0.8.0-starter-windows.zip'
          $oldZip = Join-Path $env:RUNNER_TEMP 'scroll-prior-candidate/native-workbench-0.8.0-starter-windows.zip'
          $oldSha = '71a84d2c6f7f293bf7f57c1fa3221fc942fce57bca61c8ed3344d593c31c262c'
          if ((Get-FileHash $newZip -Algorithm SHA256).Hash -ne $env:ASSET_SHA256) { throw 'New candidate SHA-256 mismatch.' }
          $newRoot = Join-Path $env:RUNNER_TEMP 'scroll-fixed'
          Expand-Archive $newZip $newRoot
          $evidence = Join-Path $env:RUNNER_TEMP 'scroll-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $priorAvailable = $env:PRIOR_DOWNLOAD_OUTCOME -eq 'success' -and (Test-Path $oldZip)
          $priorState = @{ artifactId = 11404414503; runId = 37449356224; available = $priorAvailable; hashVerified = $false; executed = $false; status = 'unavailable'; skips = @() }
          if ($priorAvailable) {
            if ((Get-FileHash $oldZip -Algorithm SHA256).Hash -ne $oldSha) { throw 'Previous candidate SHA-256 mismatch.' }
            $priorState.hashVerified = $true
            $oldRoot = Join-Path $env:RUNNER_TEMP 'scroll-prior'
            Expand-Archive $oldZip $oldRoot
            $oldApp = Join-Path $oldRoot 'native-workbench'
            $priorState.executed = $true
            & (Join-Path $oldApp 'runtime/python/python.exe') -I scripts/check_scroll_frames_windows.py --diagnostic --app-root $oldApp --report (Join-Path $evidence 'prior/native-scroll-frames.json') --source-commit '0d3282046d7aa05dc822315c9a237c8ac534cd7a' --asset-sha256 $oldSha
            $priorState.status = if ($LASTEXITCODE -eq 0) { 'observation-completed-see-report' } else { 'observation-failed-not-a-passing-negative-control' }
          } else {
            $priorState.skips = @('Diagnostic previous package unavailable; no temporal negative-control observation was executed or counted as passed.')
          }
          $priorState | ConvertTo-Json | Set-Content (Join-Path $evidence 'negative-control-availability.json')
          # A missed old-package flash is reported honestly; it cannot turn an
          # unavailable/failed diagnostic into a pass or weaken the new gate.
          $newApp = Join-Path $newRoot 'native-workbench'
          & (Join-Path $newApp 'runtime/python/python.exe') -I scripts/check_scroll_frames_windows.py --app-root $newApp --report (Join-Path $evidence 'fixed/native-scroll-frames.json') --source-commit $env:SOURCE_COMMIT --asset-sha256 $env:ASSET_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'The new package failed native temporal scrolling or precision-wheel routing.' }
      - name: Retain displayed-frame evidence and diagnostic comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-scroll-frames-${{ github.sha }}
          path: ${{ runner.temp }}/scroll-evidence
          if-no-files-found: error
          retention-days: 30

  native-long-paths:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: workspace-ui-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/long-path-candidate
      - name: Recover unchanged reported candidate for diagnostic negative control
        id: prior
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: workspace-ui-candidate-0d2a993fca95a5837a69aa05c63aa5e806c553af
          run-id: 37441781509
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/long-path-prior-candidate
      - name: Prove failure and full scientific recovery without Windows long-path opt-in
        shell: pwsh
        env:
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
          SOURCE_COMMIT: ${{ github.sha }}
          PRIOR_DOWNLOAD_OUTCOME: ${{ steps.prior.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $newZip = Join-Path $env:RUNNER_TEMP 'long-path-candidate/native-workbench-0.8.0-starter-windows.zip'
          $oldZip = Join-Path $env:RUNNER_TEMP 'long-path-prior-candidate/native-workbench-0.8.0-starter-windows.zip'
          $oldSha = 'de099e5feef437c788352c31c0e743c7e8f22aa08bfe2364e59b715ec3501806'
          if ((Get-FileHash $newZip -Algorithm SHA256).Hash -ne $env:ASSET_SHA256) { throw 'New candidate SHA-256 mismatch.' }
          $newRoot = Join-Path $env:RUNNER_TEMP 'long-path-fixed'
          $oldRoot = Join-Path $env:RUNNER_TEMP 'long-path-prior'
          Expand-Archive $newZip $newRoot
          $priorAvailable = $env:PRIOR_DOWNLOAD_OUTCOME -eq 'success' -and (Test-Path $oldZip)
          $priorHashValid = $priorAvailable -and (Get-FileHash $oldZip -Algorithm SHA256).Hash -eq $oldSha
          if ($priorHashValid) { Expand-Archive $oldZip $oldRoot }
          $evidence = Join-Path $env:RUNNER_TEMP 'long-path-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $priorState = @{ artifactId = 11401422780; runId = 37441781509; available = $priorAvailable; hashVerified = $priorHashValid; executed = $false; status = 'unavailable'; passed = 0; skips = @() }
          if (-not $priorAvailable) { $priorState.skips = @('Diagnostic prior-candidate artifact is unavailable; no negative-control check was executed or counted as passed.') }
          $priorState | ConvertTo-Json | Set-Content (Join-Path $evidence 'negative-control-availability.json')
          $negativeFailure = $null
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $before = Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue
          $hadValue = $null -ne $before
          $oldValue = if ($hadValue) { [int]$before.LongPathsEnabled } else { $null }
          $setup = @{ scope = 'Disposable hosted CI runner only; no application or user-machine policy changes'; previousValue = $oldValue; requestedValue = 0; restored = $false }
          try {
            New-ItemProperty -Path $key -Name LongPathsEnabled -PropertyType DWord -Value 0 -Force | Out-Null
            $setup.observedValue = [int](Get-ItemPropertyValue -Path $key -Name LongPathsEnabled)
            if ($setup.observedValue -ne 0) { throw 'Could not establish disabled-policy regression environment.' }
            $setup | ConvertTo-Json | Set-Content (Join-Path $evidence 'policy-setup.json')
            # Both interpreters and their private hosts start after the change,
            # so Windows cannot reuse a previously cached long-path policy.
            if ($priorAvailable -and -not $priorHashValid) {
              $negativeFailure = 'Reported candidate SHA-256 mismatch; negative-control package was not executed.'
              $priorState.status = 'failed-integrity'
            } elseif ($priorHashValid) {
              $oldApp = Join-Path $oldRoot 'native-workbench'
              $priorState.executed = $true
              & (Join-Path $oldApp 'runtime/python/python.exe') -I scripts/check_long_paths_windows.py --app-root $oldApp --output-root (Join-Path $env:RUNNER_TEMP 'old synthetic check') --report (Join-Path $evidence 'prior/native-long-paths.json') --source-commit '0d2a993fca95a5837a69aa05c63aa5e806c553af' --asset-sha256 $oldSha --expect-missing-output
              if ($LASTEXITCODE -ne 0) {
                $negativeFailure = 'The exact reported package did not reproduce the expected MAX_PATH failure.'
                $priorState.status = 'failed'
              } else {
                $priorState.status = 'expected-failure-reproduced'
                $priorState.passed = (Get-Content (Join-Path $evidence 'prior/native-long-paths.json') | ConvertFrom-Json).passed
              }
            }
            $priorState | ConvertTo-Json | Set-Content (Join-Path $evidence 'negative-control-availability.json')
            # The fixed candidate remains mandatory even when the time-limited
            # old diagnostic artifact has expired or its control failed.
            $newApp = Join-Path $newRoot 'native-workbench'
            & (Join-Path $newApp 'runtime/python/python.exe') -I scripts/check_long_paths_windows.py --app-root $newApp --output-root (Join-Path $env:RUNNER_TEMP 'new synthetic check') --report (Join-Path $evidence 'fixed/native-long-paths.json') --source-commit $env:SOURCE_COMMIT --asset-sha256 $env:ASSET_SHA256
            if ($LASTEXITCODE -ne 0) { throw 'The corrected package failed the full native long-path scientific regression.' }
            if ($negativeFailure) { throw $negativeFailure }
          } finally {
            if ($hadValue) {
              Set-ItemProperty -Path $key -Name LongPathsEnabled -Value $oldValue
              $setup.restoredValue = [int](Get-ItemPropertyValue -Path $key -Name LongPathsEnabled)
              $setup.restored = $setup.restoredValue -eq $oldValue
            } else {
              Remove-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue
              $setup.restored = $null -eq (Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue)
            }
            $setup | ConvertTo-Json | Set-Content (Join-Path $evidence 'policy-setup.json')
            if (-not $setup.restored) { throw 'Disposable runner policy was not restored.' }
          }
      - name: Retain exact long-path negative control and scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-long-paths-${{ github.sha }}
          path: ${{ runner.temp }}/long-path-evidence
          if-no-files-found: error
          retention-days: 30
