name: Native Windows tool setup candidate

on:
  push:
    branches: [feature/native-tool-setup-0.10.0]
  workflow_dispatch:
    inputs:
      production_full:
        description: 'Also require clean-client Full using the packaged production trust (fails if absent)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      asset_sha256: ${{ steps.package.outputs.asset_sha256 }}
      update_sha256: ${{ steps.updater.outputs.update_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recover immutable build inputs and published upgrade baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-inputs candidate
          curl --fail --location --retry 3 'https://github.com/comparativechrono/workbench/releases/download/app-v0.6.0/native-workbench-0.6.0-starter-windows.zip' -o build-inputs/starter.zip
          curl --fail --location --retry 3 'https://github.com/comparativechrono/workbench/releases/download/app-v0.6.0/native-workbench-0.6.0-source.zip' -o build-inputs/source.zip
          curl --fail --location --retry 3 'https://github.com/comparativechrono/workbench/releases/download/app-v0.9.0/native-workbench-0.9.0-starter-windows.zip' -o build-inputs/baseline-0.9.0.zip
          curl --fail --location --retry 3 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz' -o build-inputs/compiler.tar.xz
          sha256sum --check <<'SUMS'
          16fa802304c734b5721d838ff38b7e90ed36ccfc185a22239859cc3762af695a  build-inputs/starter.zip
          427a9b42f2528984350479e8b0155e4ef4f0159fa6f240cc1aa84a5ec2e0e60a  build-inputs/source.zip
          c2661c144e073c4efdd190ffd186bacd9398b6413b81770d7a057c3947eecf02  build-inputs/baseline-0.9.0.zip
          bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21  build-inputs/compiler.tar.xz
          SUMS
          unzip -q build-inputs/starter.zip -d build-inputs/frozen
          tar -xf build-inputs/compiler.tar.xz -C build-inputs
      - name: Compile native application and updater with strict warnings
        shell: bash
        run: |
          set -euo pipefail
          export BW_MINGW_ROOT="$GITHUB_WORKSPACE/build-inputs/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64"
          bash desktop/build_desktop_workspace.sh
          bash desktop/build_bridge.sh
          bash desktop/build_workspace_update_launcher.sh
      - name: Verify setup and affected source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 workspace/tests/test_setup_manager.py
          python3 workspace/tests/test_setup_service.py
          python3 tests/test_prepare_setup_catalogue.py
          python3 tests/test_setup_release.py
          python3 tests/test_pack_manager.py
          python3 workspace/tests/test_pack_service.py
          python3 workspace/tests/test_desktop_host.py
          python3 workspace/tests/test_desktop_modes.py
          python3 workspace/tests/test_workflow_inputs.py
          python3 workspace/tests/test_reference_service.py
          python3 workspace/tests/test_cwl_results.py
          python3 tests/test_split_release.py
          python3 tests/test_core_update.py
      - name: Freeze candidate application and matching source once
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_split.py sources --base-root build-inputs/frozen/native-workbench --base-source-archive build-inputs/source.zip --output candidate/native-workbench-0.10.0-source.zip --metadata candidate/source-metadata.json
          python3 scripts/package_split.py stage --base-root build-inputs/frozen/native-workbench --app-root stage/native-workbench --source-metadata candidate/source-metadata.json
          python3 scripts/package_split.py starter --app-root stage/native-workbench --output candidate/native-workbench-0.10.0-starter-windows.zip
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          digest=hashlib.sha256(Path('candidate/native-workbench-0.10.0-starter-windows.zip').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('asset_sha256='+digest+'\n')
          PY
      - name: Derive exact 0.9.0 core update without rebuilding the application
        id: updater
        env:
          STARTER_SHA256: ${{ steps.package.outputs.asset_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          launcher_sha=$(sha256sum build/desktop/UpdateWorkbench.exe | cut -d ' ' -f1)
          python3 scripts/build_update_0100.py --starter candidate/native-workbench-0.10.0-starter-windows.zip --starter-sha256 "$STARTER_SHA256" --baseline build-inputs/baseline-0.9.0.zip --launcher build/desktop/UpdateWorkbench.exe --launcher-sha256 "$launcher_sha" --source-commit "$GITHUB_SHA" --output updater-candidate --work updater-build
          cp updater-candidate/native-workbench-0.10.0-update-from-0.9.0.zip updater-candidate/BUILD-UPDATE-PROVENANCE.json candidate/
          python3 - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          rows=[{'file':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(Path('candidate').glob('*.zip'))]
          trust=json.loads(Path('workspace/catalog-sources.json').read_text())
          Path('candidate/BUILD-PROVENANCE.json').write_text(json.dumps({'schema':1,'status':'development candidate; production catalogue deployment is a separate gate','sourceCommit':os.environ['GITHUB_SHA'],'platform':platform.platform(),'compiler':'LLVM-MinGW 20260922 UCRT','compilerArchiveSha256':'bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21','nativeWindowsExecutedByBuilder':False,'productionCatalogueConfigured':any(s['id']=='native-workbench-official' for s in trust),'archives':rows},indent=2)+'\n')
          Path('candidate/SHA256SUMS.txt').write_text(''.join(r['sha256']+'  '+r['file']+'\n' for r in rows))
          PY
      - name: Prepare bounded transport without changing the frozen archives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          root=Path('candidate')
          for edition,name in [('starter','native-workbench-0.10.0-starter-windows.zip'),('update','native-workbench-0.10.0-update-from-0.9.0.zip')]:
            destination=Path('transfer')/edition
            destination.mkdir(parents=True)
            shutil.copyfile(root/name,destination/name)
          source=root/'native-workbench-0.10.0-source.zip'
          parts=[]
          with source.open('rb') as stream:
            while block:=stream.read(24*1024*1024):
              number=len(parts)+1
              folder=Path('transfer')/('source-part-'+str(number))
              folder.mkdir(parents=True)
              name=source.name+'.part'+str(number)
              (folder/name).write_bytes(block)
              parts.append({'file':name,'bytes':len(block),'sha256':hashlib.sha256(block).hexdigest()})
          assert len(parts)==2, 'Expected two bounded source transport parts; adjust transport before accepting a larger candidate.'
          metadata=Path('transfer/metadata');metadata.mkdir()
          for name in ('BUILD-PROVENANCE.json','BUILD-UPDATE-PROVENANCE.json','source-metadata.json','SHA256SUMS.txt'):
            shutil.copyfile(root/name,metadata/name)
          record={'schema':1,'sourceArchive':{'file':source.name,'bytes':source.stat().st_size,'sha256':hashlib.sha256(source.read_bytes()).hexdigest()},'sourceTransportParts':parts,'sourceReassembly':'Concatenate part1 then part2 as raw bytes; verify original source SHA-256 before extraction.','archivesRebuilt':False}
          (metadata/'TRANSPORT-VERIFICATION.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: setup-candidate-${{ github.sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: setup-transfer-starter-${{ github.sha }}
          path: transfer/starter
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: setup-transfer-update-${{ github.sha }}
          path: transfer/update
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: setup-transfer-source-part-1-${{ github.sha }}
          path: transfer/source-part-1
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: setup-transfer-source-part-2-${{ github.sha }}
          path: transfer/source-part-2
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: setup-transfer-metadata-${{ github.sha }}
          path: transfer/metadata
          if-no-files-found: error
          retention-days: 30

  native:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        folder: [ordinary, 'path with spaces']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: setup-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/setup-candidate
      - name: Verify and extract exact candidate, updater and published baseline
        id: prepare
        shell: pwsh
        env:
          CASE_FOLDER: ${{ matrix.folder }}
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
          UPDATE_SHA256: ${{ needs.build.outputs.update_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'setup-candidate'
          $starter = Join-Path $candidate 'native-workbench-0.10.0-starter-windows.zip'
          $update = Join-Path $candidate 'native-workbench-0.10.0-update-from-0.9.0.zip'
          $baseline = Join-Path $env:RUNNER_TEMP 'baseline-0.9.0.zip'
          $pack = Join-Path $env:RUNNER_TEMP 'optional-reads.zip'
          Invoke-WebRequest 'https://github.com/comparativechrono/workbench/releases/download/app-v0.9.0/native-workbench-0.9.0-starter-windows.zip' -OutFile $baseline
          Invoke-WebRequest 'https://github.com/comparativechrono/workbench/releases/download/pack-reads-v0.4.0/native-workbench-pack-reads-0.4.0.zip' -OutFile $pack
          if ((Get-FileHash $starter -Algorithm SHA256).Hash -ne $env:ASSET_SHA256) { throw 'Candidate SHA-256 mismatch.' }
          if ((Get-FileHash $update -Algorithm SHA256).Hash -ne $env:UPDATE_SHA256) { throw 'Updater SHA-256 mismatch.' }
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash -ne 'c2661c144e073c4efdd190ffd186bacd9398b6413b81770d7a057c3947eecf02') { throw 'Baseline SHA-256 mismatch.' }
          if ((Get-FileHash $pack -Algorithm SHA256).Hash -ne '2dd05fece8deb2b0178d8b1bc2b6830f175b3fbc2f5a4d48f9c9023cbfe6775b') { throw 'Optional pack SHA-256 mismatch.' }
          $caseRoot = Join-Path $env:RUNNER_TEMP $env:CASE_FOLDER
          Expand-Archive $starter $caseRoot
          Expand-Archive $baseline (Join-Path $caseRoot 'baseline')
          Expand-Archive $update (Join-Path $caseRoot 'updater')
      - name: Native Windows source pack-manager filesystem regressions
        if: matrix.folder == 'ordinary'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:RUNNER_TEMP 'ordinary/native-workbench'
          # This executes checkout source tests with the packaged interpreter.
          # It is separate from exact installed-application/native-import gates.
          & (Join-Path $app 'runtime/python/python.exe') -I tests/test_pack_manager.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows source pack-manager regressions failed.' }
      - name: Native first-run profiles and signed batch failure/retry fixtures
        shell: pwsh
        env:
          CASE_FOLDER: ${{ matrix.folder }}
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path (Join-Path $env:RUNNER_TEMP $env:CASE_FOLDER) 'native-workbench'
          & (Join-Path $app 'runtime/python/python.exe') -I scripts/check_setup_windows.py --app-root $app --report "$env:RUNNER_TEMP/setup-evidence/native-setup.json" --source-commit '${{ github.sha }}' --asset-sha256 $env:ASSET_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Native setup gate failed.' }
      - name: Recheck native workspace interactions, pipeline, CWL, DAGs and icon
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        shell: pwsh
        env:
          CASE_FOLDER: ${{ matrix.folder }}
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path (Join-Path $env:RUNNER_TEMP $env:CASE_FOLDER) 'native-workbench'
          $python = Join-Path $app 'runtime/python/python.exe'
          & $python -I scripts/check_workspace_ui_windows.py --app-root $app --report "$env:RUNNER_TEMP/workspace-evidence/native-ui.json" --source-commit '${{ github.sha }}' --asset-sha256 $env:ASSET_SHA256 --asset-name 'native-workbench-0.10.0-starter-windows.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Native workspace regression failed.' }
          & $python -I scripts/check_results_windows.py --app-root $app --report "$env:RUNNER_TEMP/results-evidence/native-results.json" --source-commit '${{ github.sha }}' --asset-sha256 $env:ASSET_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Native results regression failed.' }
      - name: Recheck live References downloads, cancellation, native selection and offline reuse
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        shell: pwsh
        env:
          CASE_FOLDER: ${{ matrix.folder }}
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path (Join-Path $env:RUNNER_TEMP $env:CASE_FOLDER) 'native-workbench'
          & (Join-Path $app 'runtime/python/python.exe') -I scripts/check_references_windows.py --app-root $app --report "$env:RUNNER_TEMP/references-evidence/native-references.json" --source-commit '${{ github.sha }}' --asset-sha256 $env:ASSET_SHA256 --asset-name 'native-workbench-0.10.0-starter-windows.zip' --release-tag 'unpublished-tool-setup-candidate'
          if ($LASTEXITCODE -ne 0) { throw 'Native References regression failed.' }
      - name: Native 0.9.0 upgrade preserves tools, saved pins, references and results
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        shell: pwsh
        env:
          CASE_FOLDER: ${{ matrix.folder }}
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
          UPDATE_SHA256: ${{ needs.build.outputs.update_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $caseRoot = Join-Path $env:RUNNER_TEMP $env:CASE_FOLDER
          $updater = Join-Path $caseRoot 'updater'
          $candidate = Join-Path $env:RUNNER_TEMP 'setup-candidate'
          & (Join-Path $updater 'runtime/python/python.exe') -I scripts/check_update_0100_windows.py --base-app-root (Join-Path $caseRoot 'baseline/native-workbench') --app-root (Join-Path $caseRoot 'native-workbench') --update-root $updater --baseline-archive "$env:RUNNER_TEMP/baseline-0.9.0.zip" --starter-archive (Join-Path $candidate 'native-workbench-0.10.0-starter-windows.zip') --update-archive (Join-Path $candidate 'native-workbench-0.10.0-update-from-0.9.0.zip') --optional-pack-archive "$env:RUNNER_TEMP/optional-reads.zip" --report "$env:RUNNER_TEMP/update-evidence/native-update.json" --starter-sha256 $env:ASSET_SHA256 --source-commit '${{ github.sha }}' --update-sha256 $env:UPDATE_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Native 0.9.0 upgrade regression failed.' }
      - name: Retain successful and failed native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-windows-${{ matrix.folder }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/setup-evidence
            ${{ runner.temp }}/workspace-evidence
            ${{ runner.temp }}/results-evidence
            ${{ runner.temp }}/update-evidence
            ${{ runner.temp }}/references-evidence
          if-no-files-found: error
          retention-days: 30

  native-full:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: setup-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/setup-candidate
      - name: Install all real current packs using explicit test-only publisher trust
        shell: pwsh
        env:
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $starter = Join-Path $env:RUNNER_TEMP 'setup-candidate/native-workbench-0.10.0-starter-windows.zip'
          if ((Get-FileHash $starter -Algorithm SHA256).Hash -ne $env:ASSET_SHA256) { throw 'Candidate SHA-256 mismatch.' }
          $destination = Join-Path $env:RUNNER_TEMP 'all tools coexistence'
          Expand-Archive $starter $destination
          $app = Join-Path $destination 'native-workbench'
          & (Join-Path $app 'runtime/python/python.exe') -I scripts/check_setup_windows.py --app-root $app --report "$env:RUNNER_TEMP/full-evidence/native-full.json" --source-commit '${{ github.sha }}' --asset-sha256 $env:ASSET_SHA256 --full-catalogue publishing/setup-catalogue.UNSIGNED.json
          if ($LASTEXITCODE -ne 0) { throw 'All-pack native coexistence gate failed.' }
      - name: Retain Full fixture evidence separately from production deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-full-coexistence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-evidence
          if-no-files-found: error
          retention-days: 30

  production-full:
    if: github.event_name == 'push' || inputs.production_full
    needs: build
    runs-on: windows-2022
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        folder: [ordinary, 'path with spaces']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: setup-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/setup-candidate
      - name: Require packaged production trust and perform real clean-client Full installation
        shell: pwsh
        env:
          ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
          CASE_FOLDER: ${{ matrix.folder }}
        run: |
          $ErrorActionPreference = 'Stop'
          $starter = Join-Path $env:RUNNER_TEMP 'setup-candidate/native-workbench-0.10.0-starter-windows.zip'
          if ((Get-FileHash $starter -Algorithm SHA256).Hash -ne $env:ASSET_SHA256) { throw 'Candidate SHA-256 mismatch.' }
          $destination = Join-Path (Join-Path $env:RUNNER_TEMP 'production-full') $env:CASE_FOLDER
          Expand-Archive $starter $destination
          $app = Join-Path $destination 'native-workbench'
          & (Join-Path $app 'runtime/python/python.exe') -I scripts/check_setup_windows.py --app-root $app --report "$env:RUNNER_TEMP/production-full-evidence/native-production-full.json" --source-commit '${{ github.sha }}' --asset-sha256 $env:ASSET_SHA256 --production-full
          if ($LASTEXITCODE -ne 0) { throw 'Production clean-client Full installation failed or trust was unavailable.' }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-production-full-${{ matrix.folder }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-full-evidence
          if-no-files-found: error
          retention-days: 30
