name: Validate accepted 0.9.0 update from 0.8.0

on:
  push:
    branches: [release/update-app-0.9.0]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: update-0.9.0-${{ github.ref }}
  cancel-in-progress: true

# Only the updater is newly packaged. The accepted application bytes and
# matching source companion remain those of source beea34a/build 37485987457.
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      update_sha256: ${{ steps.package.outputs.update_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: results-candidate-beea34ab29f3e7cb9a7e79dbcfa11c89f40ee59d
          run-id: 37485987457
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/accepted-candidate
      - name: Check updater contracts and recover immutable baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_core_update.py
          curl --fail --location --retry 3 'https://github.com/comparativechrono/workbench/releases/download/app-v0.8.0/native-workbench-0.8.0-starter-windows.zip' -o "$RUNNER_TEMP/baseline-0.8.0.zip"
      - name: Freeze exact app-only update without rebuilding the application
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_update_090.py --candidate "$RUNNER_TEMP/accepted-candidate" --baseline "$RUNNER_TEMP/baseline-0.8.0.zip" --output "$RUNNER_TEMP/update-candidate" --work "$RUNNER_TEMP/update-build-work" --validation-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: update-0.9.0-from-0.8.0-${{ github.sha }}
          path: ${{ runner.temp }}/update-candidate
          if-no-files-found: error
          retention-days: 30

  native:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        folder: [ordinary, 'path with spaces']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: update-0.9.0-from-0.8.0-${{ github.sha }}
          path: ${{ runner.temp }}/update-candidate
      - uses: actions/download-artifact@v4
        with:
          name: results-candidate-beea34ab29f3e7cb9a7e79dbcfa11c89f40ee59d
          run-id: 37485987457
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/accepted-candidate
      - name: Extract frozen inputs and validate native update and offline reuse
        shell: pwsh
        env:
          CASE_FOLDER: ${{ matrix.folder }}
          UPDATE_SHA256: ${{ needs.build.outputs.update_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $starter = Join-Path $env:RUNNER_TEMP 'accepted-candidate/native-workbench-0.9.0-starter-windows.zip'
          $update = Join-Path $env:RUNNER_TEMP 'update-candidate/native-workbench-0.9.0-update-from-0.8.0.zip'
          $baseline = Join-Path $env:RUNNER_TEMP 'baseline-0.8.0.zip'
          $pack = Join-Path $env:RUNNER_TEMP 'optional-reads-0.4.0.zip'
          Invoke-WebRequest -Uri 'https://github.com/comparativechrono/workbench/releases/download/app-v0.8.0/native-workbench-0.8.0-starter-windows.zip' -OutFile $baseline
          Invoke-WebRequest -Uri 'https://github.com/comparativechrono/workbench/releases/download/pack-reads-v0.4.0/native-workbench-pack-reads-0.4.0.zip' -OutFile $pack
          if ((Get-FileHash $starter -Algorithm SHA256).Hash -ne 'c2661c144e073c4efdd190ffd186bacd9398b6413b81770d7a057c3947eecf02') { throw 'Accepted starter SHA-256 mismatch.' }
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash -ne 'df001a80033ff8e834045ec683c79672e0efdbd4880fb89fca8bf8c36d830fdc') { throw 'Published baseline SHA-256 mismatch.' }
          if ((Get-FileHash $update -Algorithm SHA256).Hash -ne $env:UPDATE_SHA256) { throw 'Frozen updater SHA-256 mismatch.' }
          if ((Get-FileHash $pack -Algorithm SHA256).Hash -ne '2dd05fece8deb2b0178d8b1bc2b6830f175b3fbc2f5a4d48f9c9023cbfe6775b') { throw 'Optional pack SHA-256 mismatch.' }
          $caseRoot = Join-Path $env:RUNNER_TEMP $env:CASE_FOLDER
          Expand-Archive $starter (Join-Path $caseRoot 'accepted')
          Expand-Archive $baseline (Join-Path $caseRoot 'baseline')
          Expand-Archive $update (Join-Path $caseRoot 'updater')
          $app = Join-Path $caseRoot 'accepted/native-workbench'
          $base = Join-Path $caseRoot 'baseline/native-workbench'
          $updater = Join-Path $caseRoot 'updater'
          & (Join-Path $updater 'runtime/python/python.exe') -I scripts/check_update_090_windows.py --base-app-root $base --app-root $app --update-root $updater --baseline-archive $baseline --starter-archive $starter --update-archive $update --optional-pack-archive $pack --update-sha256 $env:UPDATE_SHA256 --report "$env:RUNNER_TEMP/update-evidence/update-native.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native 0.8.0-to-0.9.0 update gate failed.' }
      - name: Retain actual updater and scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-0.9.0-${{ matrix.folder }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/update-evidence
          if-no-files-found: error
          retention-days: 30
