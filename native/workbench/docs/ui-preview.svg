<text x="303" y="197" font-size="12" fill="#637085" font-weight="400" >A complete small-variant teaching workflow. Raw reads are not trimmed; duplicates are marked and retained.</text>
<text x="303" y="212" font-size="12" fill="#637085" font-weight="400" >Ploidy applies uniformly, including mitochondrial contigs.</text>
