[pack]
format=2
id=vsearch
version=0.5.2
name=VSEARCH amplicon tools
platform=windows-x86_64
description=Nucleotide amplicon merging, filtering, dereplication, clustering and reference chimera screening.
color=#378B86

[tool:vsearch]
path=bin/vsearch.exe
version=2.32.0
sha256=309190c6299a027e9e66366ca24aaa3fa27ef81cc235c8023271c7e8448bc65d

[tool:paircheck]
path=bin/paircheck.exe
version=1.0.1
sha256=4f2dda7e26b5c115a7edee936a8a059eb55ece244931b2799a62cebfcd44ecd4

[asset:zlib]
path=bin/zlib1.dll
sha256=c7f3b6817ffe0a33b1cdf5aa7ed9a6babb3e792957f1cc0f7c0587f3398cdb12

[asset:bzip2]
path=bin/libbz2.dll
sha256=a4fbb97c26662d2b8a80bf4597ed3effb69b12048b0cb1eef2c3f211e2e66673

[asset:workbench-schema]
path=workbench-schema.json
sha256=3386ed5ba8d215c12a3baaae5a6d656b194336456743f0796ff05fdec0358343

[asset:workbench-checks]
path=workbench-checks.json
sha256=e16b6e9c389543ecc01dd4e8bbd54fbfb86f0db9d0d0200d4688ed7d7cb046e4

[asset:fixture-derep-fasta]
path=fixtures/derep-fasta.txt
sha256=df866bdbcf5921df9f5cac14b991f8d42d641bf5d10394eae3de36298dc0ae7b

[asset:fixture-weighted-fasta]
path=fixtures/weighted-fasta.txt
sha256=dece0ef7e6cbab3c9dc49ce664af7c0a9248328b2c5638aa38f092b84a0a6c03

[asset:fixture-merge-r1]
path=fixtures/merge-r1.txt
sha256=60a9f82a3721618945d1a7239e7977960de79ceef7fe010b2e689c072733055a

[asset:fixture-merge-r2]
path=fixtures/merge-r2.txt
sha256=d9e87fa1ebe95d279e868eaf954a24d884d5737bb74a6364561bc67525db54b1

[asset:fixture-quality-fastq]
path=fixtures/quality-fastq.txt
sha256=3c47df0ef4d7e3247e89b475035b8cb110e2f0f8c4fa55ed29f212eac7923f01

[workflow:merge-pairs]
name=VSEARCH: merge paired reads
description=Validate mate identifiers, then merge overlapping paired-end Phred+33 reads. Retain unmerged mates separately.
inputs=reads1,reads2,minimum-overlap,maximum-differences,minimum-merged-length,threads
outputs=merged,unmerged1,unmerged2,pair-check,log
steps=check-pairs,merge

[input:merge-pairs:reads1]
label=Forward reads
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[input:merge-pairs:reads2]
label=Reverse reads
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
different-from=reads1

[input:merge-pairs:minimum-overlap]
label=Minimum overlap (bases)
type=integer
required=true
default=20
min=5
max=10000

[input:merge-pairs:maximum-differences]
label=Maximum overlap mismatches
type=integer
required=true
default=5
min=0
max=10000

[input:merge-pairs:minimum-merged-length]
label=Minimum merged length
type=integer
required=true
default=1
min=1
max=100000

[input:merge-pairs:threads]
label=Threads
type=integer
required=true
default=1
min=1
max=64

[output:merge-pairs:merged]
label=Merged FASTQ
path=merged.fastq
final=true
nonempty=false

[output:merge-pairs:unmerged1]
label=Unmerged forward reads
path=unmerged_R1.fastq
final=true
nonempty=false

[output:merge-pairs:unmerged2]
label=Unmerged reverse reads
path=unmerged_R2.fastq
final=true
nonempty=false

[output:merge-pairs:pair-check]
label=Mate validation
path=pair-check.json
final=true
nonempty=true

[output:merge-pairs:log]
label=VSEARCH run statistics
path=vsearch.log
final=true
nonempty=true

[step:merge-pairs:check-pairs]
label=Validate paired FASTQ records
kind=exec
tool=paircheck
stdout=pair-check
arg.0=--reads1
arg.1={input:reads1}
arg.2=--reads2
arg.3={input:reads2}

[step:merge-pairs:merge]
label=Merge overlaps
kind=exec
tool=vsearch
produces=merged,unmerged1,unmerged2,log
arg.0=--fastq_mergepairs
arg.1={input:reads1}
arg.2=--reverse
arg.3={input:reads2}
arg.4=--fastq_ascii
arg.5=33
arg.6=--fastq_qmax
arg.7=93
arg.8=--fastq_qmaxout
arg.9=41
arg.10=--fastq_minovlen
arg.11={input:minimum-overlap}
arg.12=--fastq_maxdiffs
arg.13={input:maximum-differences}
arg.14=--fastq_minmergelen
arg.15={input:minimum-merged-length}
arg.16=--threads
arg.17={input:threads}
arg.18=--fastqout
arg.19={output:merged}
arg.20=--fastqout_notmerged_fwd
arg.21={output:unmerged1}
arg.22=--fastqout_notmerged_rev
arg.23={output:unmerged2}
arg.24=--log
arg.25={output:log}
arg.26=--no_progress

[workflow:quality-filter]
name=VSEARCH: filter read quality
description=Filter single or merged Phred+33 FASTQ reads by expected errors, ambiguous bases and length. Export FASTQ and FASTA.
inputs=reads,maximum-expected-errors,maximum-ns,minimum-length,maximum-length
outputs=retained,fasta,discarded,log
steps=filter

[input:quality-filter:reads]
label=Single or merged reads
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[input:quality-filter:maximum-expected-errors]
label=Maximum expected errors
type=choice
required=true
default=1
choices=0.1:0.1|0.5:0.5|1:1|2:2|3:3|5:5|10:10
help=Expected errors are the sum of per-base error probabilities. This is filtering, not denoising.

[input:quality-filter:maximum-ns]
label=Maximum N bases
type=integer
required=true
default=0
min=0
max=100000

[input:quality-filter:minimum-length]
label=Minimum length
type=integer
required=true
default=1
min=1
max=100000

[input:quality-filter:maximum-length]
label=Maximum length
type=integer
required=true
default=100000
min=1
max=100000

[output:quality-filter:retained]
label=Retained FASTQ
path=retained.fastq
final=true
nonempty=false

[output:quality-filter:fasta]
label=Retained FASTA
path=retained.fasta
final=true
nonempty=false

[output:quality-filter:discarded]
label=Discarded FASTQ
path=discarded.fastq
final=true
nonempty=false

[output:quality-filter:log]
label=VSEARCH run statistics
path=vsearch.log
final=true
nonempty=true

[step:quality-filter:filter]
label=Filter reads
kind=exec
tool=vsearch
produces=retained,fasta,discarded,log
arg.0=--fastq_filter
arg.1={input:reads}
arg.2=--fastq_ascii
arg.3=33
arg.4=--fastq_qmax
arg.5=93
arg.6=--fastq_maxee
arg.7={input:maximum-expected-errors}
arg.8=--fastq_maxns
arg.9={input:maximum-ns}
arg.10=--fastq_minlen
arg.11={input:minimum-length}
arg.12=--fastq_maxlen
arg.13={input:maximum-length}
arg.14=--fastqout
arg.15={output:retained}
arg.16=--fastaout
arg.17={output:fasta}
arg.18=--fastqout_discarded
arg.19={output:discarded}
arg.20=--log
arg.21={output:log}
arg.22=--no_progress

[workflow:dereplicate]
name=VSEARCH: dereplicate sequences
description=Collapse identical full-length nucleotide sequences and count input records.
inputs=sequences,strand
outputs=unique,membership,log
steps=dereplicate

[input:dereplicate:sequences]
label=Nucleotide sequences
type=file
required=true
filter=Nucleotide FASTA|*.fa;*.fasta;*.fna;*.fa.gz;*.fasta.gz|All files|*.*
help=Unaligned nucleotide FASTA without size annotations; each record counts once. If headers contain size=N, choose abundance-aware dereplication.

[input:dereplicate:strand]
label=Strand comparison
type=choice
required=true
default=plus
choices=plus:plus|both:both
help=Both also groups reverse complements. Use plus for already oriented amplicons.

[output:dereplicate:unique]
label=Unique sequences with abundances
path=unique.fasta
final=true
nonempty=true

[output:dereplicate:membership]
label=Dereplication membership
path=dereplication.uc
final=true
nonempty=true

[output:dereplicate:log]
label=VSEARCH run statistics
path=vsearch.log
final=true
nonempty=true

[step:dereplicate:dereplicate]
label=Collapse identical sequences
kind=exec
tool=vsearch
produces=unique,membership,log
arg.0=--fastx_uniques
arg.1={input:sequences}
arg.2=--fastaout
arg.3={output:unique}
arg.4=--uc
arg.5={output:membership}
arg.6=--sizeout
arg.7=--minseqlength
arg.8=1
arg.9=--strand
arg.10={input:strand}
arg.11=--relabel
arg.12=Uniq
arg.13=--log
arg.14={output:log}
arg.15=--no_progress

[workflow:dereplicate-weighted]
name=VSEARCH: dereplicate abundance sequences
description=Collapse identical full-length nucleotide sequences and sum existing abundances.
inputs=sequences,strand
outputs=unique,membership,log
steps=dereplicate

[input:dereplicate-weighted:sequences]
label=Sequences with abundance labels
type=file
required=true
filter=Nucleotide FASTA|*.fa;*.fasta;*.fna;*.fa.gz;*.fasta.gz|All files|*.*
help=Every FASTA ID must contain a positive ;size=N; annotation. Counts are preserved.

[input:dereplicate-weighted:strand]
label=Strand comparison
type=choice
required=true
default=plus
choices=plus:plus|both:both
help=Both also groups reverse complements. Use plus for already oriented amplicons.

[output:dereplicate-weighted:unique]
label=Unique sequences with abundances
path=unique.fasta
final=true
nonempty=true

[output:dereplicate-weighted:membership]
label=Dereplication membership
path=dereplication.uc
final=true
nonempty=true

[output:dereplicate-weighted:log]
label=VSEARCH run statistics
path=vsearch.log
final=true
nonempty=true

[step:dereplicate-weighted:dereplicate]
label=Collapse identical sequences
kind=exec
tool=vsearch
produces=unique,membership,log
arg.0=--fastx_uniques
arg.1={input:sequences}
arg.2=--fastaout
arg.3={output:unique}
arg.4=--uc
arg.5={output:membership}
arg.6=--sizeout
arg.7=--minseqlength
arg.8=1
arg.9=--strand
arg.10={input:strand}
arg.11=--relabel
arg.12=Uniq
arg.13=--sizein
arg.14=--log
arg.15={output:log}
arg.16=--no_progress

[workflow:filter-abundance]
name=VSEARCH: filter sequence abundance
description=Retain sequences at or above a minimum abundance and sort them by abundance.
inputs=sequences,minimum-abundance
outputs=retained,log
steps=abundance

[input:filter-abundance:sequences]
label=Sequences with abundance labels
type=file
required=true
filter=Nucleotide FASTA|*.fa;*.fasta;*.fna;*.fa.gz;*.fasta.gz|All files|*.*
help=Every FASTA ID must contain a positive ;size=N; annotation. Counts are preserved.

[input:filter-abundance:minimum-abundance]
label=Minimum abundance
type=integer
required=true
default=2
min=1
max=1000000000

[output:filter-abundance:retained]
label=Sequences passing abundance threshold
path=abundant.fasta
final=true
nonempty=false

[output:filter-abundance:log]
label=VSEARCH run statistics
path=vsearch.log
final=true
nonempty=true

[step:filter-abundance:abundance]
label=Filter by abundance
kind=exec
tool=vsearch
produces=retained,log
arg.0=--sortbysize
arg.1={input:sequences}
arg.2=--output
arg.3={output:retained}
arg.4=--minsize
arg.5={input:minimum-abundance}
arg.6=--minseqlength
arg.7=1
arg.8=--sizeout
arg.9=--log
arg.10={output:log}
arg.11=--no_progress

[workflow:cluster-abundance]
name=VSEARCH: cluster abundant sequences
description=Greedy abundance-ordered OTU-style clustering; preserve summed abundances and UC membership.
inputs=sequences,identity,strand,threads
outputs=centroids,membership,log
steps=cluster

[input:cluster-abundance:sequences]
label=Sequences with abundance labels
type=file
required=true
filter=Nucleotide FASTA|*.fa;*.fasta;*.fna;*.fa.gz;*.fasta.gz|All files|*.*
help=Every FASTA ID must contain a positive ;size=N; annotation. Counts are preserved.

[input:cluster-abundance:identity]
label=Minimum global identity
type=choice
required=true
default=0.97
choices=0.8:0.8|0.85:0.85|0.9:0.9|0.95:0.95|0.97:0.97|0.98:0.98|0.99:0.99|1.0:1.0
help=Matches divided by alignment length excluding terminal gaps (iddef 2). Heuristic centroid search; not ASV inference.

[input:cluster-abundance:strand]
label=Strand comparison
type=choice
required=true
default=plus
choices=plus:plus|both:both
help=

[input:cluster-abundance:threads]
label=Threads
type=integer
required=true
default=1
min=1
max=64

[output:cluster-abundance:centroids]
label=Cluster centroids with abundances
path=centroids.fasta
final=true
nonempty=true

[output:cluster-abundance:membership]
label=Cluster membership
path=clusters.uc
final=true
nonempty=true

[output:cluster-abundance:log]
label=VSEARCH run statistics
path=vsearch.log
final=true
nonempty=true

[step:cluster-abundance:cluster]
label=Cluster sequences by abundance
kind=exec
tool=vsearch
produces=centroids,membership,log
arg.0=--cluster_size
arg.1={input:sequences}
arg.2=--centroids
arg.3={output:centroids}
arg.4=--uc
arg.5={output:membership}
arg.6=--id
arg.7={input:identity}
arg.8=--iddef
arg.9=2
arg.10=--strand
arg.11={input:strand}
arg.12=--sizein
arg.13=--sizeout
arg.14=--minseqlength
arg.15=1
arg.16=--qmask
arg.17=none
arg.18=--maxaccepts
arg.19=1
arg.20=--maxrejects
arg.21=32
arg.22=--threads
arg.23={input:threads}
arg.24=--relabel
arg.25=OTU
arg.26=--log
arg.27={output:log}
arg.28=--no_progress

[workflow:chimera-reference]
name=VSEARCH: reference chimera screening
description=Screen abundance sequences against a user-supplied chimera-free nucleotide reference; retain three classifications separately.
inputs=sequences,reference,minimum-score,minimum-differences,threads
outputs=nonchimeras,chimeras,borderline,classification,log
steps=chimera

[input:chimera-reference:sequences]
label=Sequences with abundance labels
type=file
required=true
filter=Nucleotide FASTA|*.fa;*.fasta;*.fna;*.fa.gz;*.fasta.gz|All files|*.*
help=Every FASTA ID must contain a positive ;size=N; annotation. Counts are preserved.

[input:chimera-reference:reference]
label=Chimera-free reference FASTA
type=file
required=true
filter=Nucleotide FASTA|*.fa;*.fasta;*.fna;*.fa.gz;*.fasta.gz|All files|*.*
help=Provide a suitable curated reference in the same orientation. No database is downloaded or inferred.

[input:chimera-reference:minimum-score]
label=Minimum chimera score
type=choice
required=true
default=0.28
choices=0.1:0.1|0.2:0.2|0.28:0.28|0.5:0.5|1.0:1.0
help=

[input:chimera-reference:minimum-differences]
label=Minimum differences per segment
type=integer
required=true
default=3
min=1
max=1000

[input:chimera-reference:threads]
label=Threads
type=integer
required=true
default=1
min=1
max=64

[output:chimera-reference:nonchimeras]
label=Classified nonchimeras
path=nonchimeras.fasta
final=true
nonempty=false

[output:chimera-reference:chimeras]
label=Classified chimeras
path=chimeras.fasta
final=true
nonempty=false

[output:chimera-reference:borderline]
label=Borderline sequences
path=borderline.fasta
final=true
nonempty=false

[output:chimera-reference:classification]
label=UCHIME classification table
path=uchime.tsv
final=true
nonempty=true

[output:chimera-reference:log]
label=VSEARCH run statistics
path=vsearch.log
final=true
nonempty=true

[step:chimera-reference:chimera]
label=Screen against reference
kind=exec
tool=vsearch
produces=nonchimeras,chimeras,borderline,classification,log
arg.0=--uchime_ref
arg.1={input:sequences}
arg.2=--db
arg.3={input:reference}
arg.4=--nonchimeras
arg.5={output:nonchimeras}
arg.6=--chimeras
arg.7={output:chimeras}
arg.8=--borderline
arg.9={output:borderline}
arg.10=--uchimeout
arg.11={output:classification}
arg.12=--sizeout
arg.13=--minseqlength
arg.14=1
arg.15=--qmask
arg.16=none
arg.17=--dbmask
arg.18=none
arg.19=--minh
arg.20={input:minimum-score}
arg.21=--mindiffs
arg.22={input:minimum-differences}
arg.23=--threads
arg.24={input:threads}
arg.25=--log
arg.26={output:log}
arg.27=--no_progress
