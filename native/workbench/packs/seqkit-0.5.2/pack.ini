[workflow:translate]
name=Translate nucleotide FASTA
description=Translate one chosen reading frame using the selected genetic code. Stop symbols are retained and the frame is appended to IDs. This is translation, not gene prediction or ORF selection; trailing incomplete codons are omitted.
inputs=sequences,frame,code,threads
outputs=result
steps=run

[input:translate:sequences]
label=Nucleotide fasta
type=file
required=true
filter=Nucleotide FASTA|*.fa;*.fasta;*.fna;*.fa.gz;*.fasta.gz;*.fna.gz|All files|*.*
help=Plain or gzip-compressed input. Sequence IDs are the first whitespace-delimited header token.

[input:translate:frame]
label=Reading frame
type=choice
required=true
default=1
choices=1:Forward 1|2:Forward 2|3:Forward 3|-1:Reverse 1|-2:Reverse 2|-3:Reverse 3

[input:translate:code]
label=Genetic code
type=choice
required=true
default=1
choices=1:Standard (1)|2:Vertebrate mitochondrial (2)|3:Yeast mitochondrial (3)|4:Mold mitochondrial and Mycoplasma (4)|5:Invertebrate mitochondrial (5)|6:Ciliate nuclear (6)|9:Echinoderm mitochondrial (9)|10:Euplotid nuclear (10)|11:Bacterial archaeal and plastid (11)|12:Alternative yeast nuclear (12)
help=Choose from sample biology; it is not inferred. Stop codons remain as *. Alternative start codons are not forced to methionine.

[input:translate:threads]
label=Threads
type=integer
required=true
default=2
min=1
max=64
help=SeqKit worker limit; most operations are limited by file reading and writing.

[output:translate:result]
label=Translate nucleotide FASTA output
path=result.faa
final=true
nonempty=true

[step:translate:run]
label=Translate nucleotide FASTA
kind=exec
tool=seqkit
stdout=result
arg.0=translate
arg.1=--frame
arg.2={input:frame}
arg.3=--transl-table
arg.4={input:code}
arg.5=--append-frame
arg.6=--threads
arg.7={input:threads}
arg.8=--seq-type
arg.9=auto
arg.10=--
arg.11={input:sequences}
