[pack]
format=2
id=seqkit
version=0.5.2
name=SeqKit sequence utilities
platform=windows-x86_64
description=Typed FASTA and FASTQ statistics, filtering, selection, conversion and translation.
color=#307F78

[tool:seqkit]
path=bin/seqkit.exe
version=2.14.0
sha256=fe776820ff4f924844753b3b251966a7c8fd0b07d77c69f03caf59828ab077a1

[asset:workbench-schema]
path=workbench-schema.json
sha256=7a03691948b8169fa5f214cb69b131a585462e9e0e15dbb83cf467dad6e52056

[asset:workbench-checks]
path=workbench-checks.json
sha256=06836593f16d3c72c8ff87844fc88078f9d36a5b573d9b0478457885923363a3

[asset:check-reads]
path=fixtures/reads.fastq
sha256=09ea69a11a144c57413e8050dfa4265b82d4314ff8ec1094d24654427eca3789

[asset:check-cds]
path=fixtures/cds.fasta
sha256=20eaec773b3d3684fd0bb3dbd9b07f198d992dfee178158b5946d51e268265ee

[workflow:statistics-reads]
name=Statistics: FASTQ reads
description=Summarize record counts, lengths, quartiles and N50 in a tab-separated report. FASTQ quality statistics assume Phred+33.
inputs=sequences,threads
outputs=validated-ids,statistics
steps=validate,run

[input:statistics-reads:sequences]
label=Fastq reads
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
help=Plain or gzip-compressed input. Sequence IDs are the first whitespace-delimited header token.

[input:statistics-reads:threads]
label=Threads
type=integer
required=true
default=2
min=1
max=64
help=SeqKit worker limit; most operations are limited by file reading and writing.

[output:statistics-reads:validated-ids]
label=Validated read identifiers
path=validated-read-ids.txt
final=false
nonempty=true

[output:statistics-reads:statistics]
label=Statistics: FASTQ reads output
path=statistics.tsv
final=true
nonempty=true

[step:statistics-reads:validate]
label=Validate every FASTQ record
kind=exec
tool=seqkit
stdout=validated-ids
arg.0=seq
arg.1=--validate-seq
arg.2=--name
arg.3=--only-id
arg.4=--seq-type
arg.5=dna
arg.6=--threads
arg.7={input:threads}
arg.8=--
arg.9={input:sequences}

[step:statistics-reads:run]
label=Statistics: FASTQ reads
kind=exec
tool=seqkit
stdout=statistics
arg.0=stats
arg.1=--all
arg.2=--tabular
arg.3=--fq-encoding
arg.4=sanger
arg.5=--threads
arg.6={input:threads}
arg.7=--seq-type
arg.8=dna
arg.9=--
arg.10={input:sequences}

[workflow:filter-reads]
name=Length filter: FASTQ reads
description=Retain records within inclusive length limits; sequence order and FASTQ qualities are preserved. This operation treats one file independently and does not preserve paired-end read synchronization.
inputs=sequences,min-length,max-length,threads
outputs=result
steps=run

[input:filter-reads:sequences]
label=Fastq reads
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
help=Plain or gzip-compressed input. This operation treats one file independently and does not preserve paired-end read synchronization.

[input:filter-reads:min-length]
label=Minimum length
type=integer
required=true
default=50
min=1
max=1000000000

[input:filter-reads:max-length]
label=Maximum length
type=integer
required=true
default=1000000000
min=1
max=1000000000
help=Inclusive upper limit; must be at least the minimum length.

[input:filter-reads:threads]
label=Threads
type=integer
required=true
default=2
min=1
max=64
help=SeqKit worker limit; most operations are limited by file reading and writing.

[output:filter-reads:result]
label=Length filter: FASTQ reads output
path=result.fastq
final=true
nonempty=false

[step:filter-reads:run]
label=Length filter: FASTQ reads
kind=exec
tool=seqkit
stdout=result
arg.0=seq
arg.1=--validate-seq
arg.2=--min-len
arg.3={input:min-length}
arg.4=--max-len
arg.5={input:max-length}
arg.6=--threads
arg.7={input:threads}
arg.8=--seq-type
arg.9=dna
arg.10=--
arg.11={input:sequences}

[workflow:subset-reads]
name=Extract by ID: FASTQ reads
description=Retain exact IDs from a text list, in input order. Matching is case sensitive and uses the first header token. Missing IDs are omitted; zero matches produce an empty output. This operation treats one file independently and does not preserve paired-end read synchronization.
inputs=sequences,ids,threads
outputs=result
steps=run

[input:subset-reads:sequences]
label=Fastq reads
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
help=Plain or gzip-compressed input. This operation treats one file independently and does not preserve paired-end read synchronization.

[input:subset-reads:ids]
label=Sequence IDs
type=file
required=true
filter=ID list|*.txt;*.tsv|All files|*.*
help=One exact sequence ID per line; no header, descriptions, regular expressions or wildcards.

[input:subset-reads:threads]
label=Threads
type=integer
required=true
default=2
min=1
max=64
help=SeqKit worker limit; most operations are limited by file reading and writing.

[output:subset-reads:result]
label=Extract by ID: FASTQ reads output
path=result.fastq
final=true
nonempty=false

[step:subset-reads:run]
label=Extract by ID: FASTQ reads
kind=exec
tool=seqkit
stdout=result
arg.0=grep
arg.1=--pattern-file
arg.2={input:ids}
arg.3=--threads
arg.4={input:threads}
arg.5=--seq-type
arg.6=dna
arg.7=--
arg.8={input:sequences}

