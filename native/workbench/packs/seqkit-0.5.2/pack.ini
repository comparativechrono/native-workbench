inputs=sequences,count,seed,threads
outputs=validated-ids,result
steps=validate,run

[input:sample-reads:sequences]
label=Fastq reads
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
help=Plain or gzip-compressed input. This operation treats one file independently and does not preserve paired-end read synchronization.

[input:sample-reads:count]
label=Number of records
type=integer
required=true
default=1000
min=1
max=1000000000

[input:sample-reads:seed]
label=Random seed
type=integer
required=true
default=11
min=0
max=2147483647

[input:sample-reads:threads]
label=Threads
type=integer
required=true
default=2
min=1
max=64
help=SeqKit worker limit; most operations are limited by file reading and writing.

[output:sample-reads:validated-ids]
label=Validated read identifiers
path=validated-read-ids.txt
final=false
nonempty=true

[output:sample-reads:result]
label=Random sample: FASTQ reads output
path=result.fastq
final=true
nonempty=true

