arg.24=--new-summary
arg.25=--no-spliced-alignment
arg.26=-U
arg.27={input:reads}

[workflow:dna-paired]
name=HISAT2 DNA paired reads
description=Align DNA reads with splicing explicitly disabled; produce unsorted SAM for downstream DNA tools. Builds a private 64-bit HISAT2 reference index. Uncompressed Phred+33 FASTQ required.
inputs=reads1,reads2,reference,sample,read-group,library,platform-unit,platform,threads,seed,min-insert,max-insert
outputs=pair-check,reference,index-1,index-2,index-3,index-4,index-5,index-6,index-7,index-8,aligned,summary
steps=check-pairs,copy-reference,index,align

[input:dna-paired:reads1]
label=Read 1 FASTQ
type=file
required=true
filter=Uncompressed FASTQ|*.fastq;*.fq|All files|*.*
help=Uncompressed Phred+33 FASTQ. Both files must have matching mate names and record order. ASCII paths only; spaces are supported, commas are not.

[input:dna-paired:reads2]
label=Read 2 FASTQ
type=file
required=true
filter=Uncompressed FASTQ|*.fastq;*.fq|All files|*.*
help=Uncompressed Phred+33 FASTQ. Both files must have matching mate names and record order. ASCII paths only; spaces are supported, commas are not.
different-from=reads1

[input:dna-paired:reference]
label=Reference genome FASTA
type=file
required=true
filter=Uncompressed FASTA|*.fa;*.fasta;*.fna|All files|*.*
help=Genomic DNA reference, not a transcriptome. A private copy and large-format index are created in the results. Index building for large genomes needs substantial RAM, disk space and time.

[input:dna-paired:sample]
label=Sample ID
type=text
required=true
default=sample1
constraint=identifier
help=Recorded in the SAM/BAM read group. Use the correct sample/library and a unique read-group ID for each lane.

[input:dna-paired:read-group]
label=Read-group ID
type=text
required=true
default=rg1
constraint=identifier
help=Recorded in the SAM/BAM read group. Use the correct sample/library and a unique read-group ID for each lane.

[input:dna-paired:library]
label=Library ID
type=text
required=true
default=lib1
constraint=identifier
help=Recorded in the SAM/BAM read group. Use the correct sample/library and a unique read-group ID for each lane.

[input:dna-paired:platform-unit]
label=Platform unit / lane
type=text
required=true
default=unit1
constraint=identifier
help=Recorded in the SAM/BAM read group. Use the correct sample/library and a unique read-group ID for each lane.

[input:dna-paired:platform]
label=Sequencing platform
type=choice
required=true
default=ILLUMINA
choices=ILLUMINA:Illumina|DNBSEQ:DNBSEQ (MGI/BGI)
help=Recorded as the read-group PL value.

[input:dna-paired:threads]
label=HISAT2 CPU threads
type=integer
required=true
default=2
min=1
max=64
help=Workers for HISAT2 indexing and alignment. More workers may use more RAM. SAMtools remains single-threaded in this portable build.

[input:dna-paired:seed]
label=Alignment seed
type=integer
required=true
default=0
min=0
max=2147483647
help=Seed for HISAT2 deterministic tie breaking. Input names/sequences/qualities also affect tie breaking; all settings are recorded.

[input:dna-paired:min-insert]
label=Minimum DNA fragment length
type=integer
required=true
default=0
min=0
max=1000000
help=Concordant paired DNA fragment bounds, only used because splicing is disabled. Must not exceed the maximum.

[input:dna-paired:max-insert]
label=Maximum DNA fragment length
type=integer
required=true
default=500
min=1
max=1000000
help=Maximum DNA fragment length for the ordinary inward-facing FR read-pair geometry.

[output:dna-paired:pair-check]
label=Read-pair validation
path=read-pairs.json
final=true
nonempty=true

[output:dna-paired:reference]
label=Private indexed reference
path=reference.fa
final=false
nonempty=true

[output:dna-paired:index-1]
label=HISAT2 large index 1
path=reference.1.ht2l
final=false
nonempty=true

[output:dna-paired:index-2]
label=HISAT2 large index 2
path=reference.2.ht2l
final=false
nonempty=true

[output:dna-paired:index-3]
label=HISAT2 large index 3
path=reference.3.ht2l
final=false
nonempty=true

[output:dna-paired:index-4]
label=HISAT2 large index 4
path=reference.4.ht2l
final=false
nonempty=true

[output:dna-paired:index-5]
label=HISAT2 large index 5
path=reference.5.ht2l
final=false
nonempty=true

[output:dna-paired:index-6]
label=HISAT2 large index 6
path=reference.6.ht2l
final=false
nonempty=true

[output:dna-paired:index-7]
label=HISAT2 large index 7
path=reference.7.ht2l
final=false
nonempty=true

[output:dna-paired:index-8]
label=HISAT2 large index 8
path=reference.8.ht2l
final=false
nonempty=true

[output:dna-paired:aligned]
label=Unsorted DNA alignment SAM
path=alignment.unsorted.sam
final=true
nonempty=true

[output:dna-paired:summary]
label=HISAT2 alignment summary
path=alignment-summary.txt
final=true
nonempty=true

[step:dna-paired:check-pairs]
label=Validate paired FASTQ names, count and order
kind=exec
tool=paircheck
stdout=pair-check
arg.0=--reads1
arg.1={input:reads1}
arg.2=--reads2
arg.3={input:reads2}

[step:dna-paired:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:dna-paired:index]
label=Build the 64-bit HISAT2 reference index
kind=exec
tool=hisat2-build-l
produces=index-1,index-2,index-3,index-4,index-5,index-6,index-7,index-8
arg.0=-p
arg.1={input:threads}
arg.2={output:reference}
arg.3={run}/reference

[step:dna-paired:align]
label=HISAT2 DNA paired reads
kind=exec
tool=hisat2-align-l
produces=aligned,summary
arg.0=--wrapper
arg.1=basic-0
arg.2=-x
arg.3={run}/reference
arg.4=-S
arg.5={output:aligned}
arg.6=-p
arg.7={input:threads}
arg.8=--seed
arg.9={input:seed}
arg.10=--reorder
arg.11=--phred33
arg.12=--rg-id
arg.13={input:read-group}
arg.14=--rg
arg.15=SM:{input:sample}
arg.16=--rg
arg.17=LB:{input:library}
arg.18=--rg
arg.19=PL:{input:platform}
arg.20=--rg
arg.21=PU:{input:platform-unit}
arg.22=--summary-file
arg.23={output:summary}
arg.24=--new-summary
arg.25=--no-spliced-alignment
arg.26=-I
arg.27={input:min-insert}
arg.28=-X
arg.29={input:max-insert}
arg.30=--fr
arg.31=-1
arg.32={input:reads1}
arg.33=-2
arg.34={input:reads2}
