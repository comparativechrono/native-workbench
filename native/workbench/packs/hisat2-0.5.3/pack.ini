[workflow:rna-single]
name=HISAT2 RNA single reads
description=Discover spliced RNA alignments and produce coordinate-sorted BAM/CSI, with an auxiliary SAM. Builds a private 64-bit HISAT2 reference index. Uncompressed Phred+33 FASTQ required.
inputs=reads,reference,sample,read-group,library,platform-unit,platform,threads,seed,strandness,min-intron,max-intron,sort-memory-mb
outputs=reference,index-1,index-2,index-3,index-4,index-5,index-6,index-7,index-8,aligned-sam,aligned,bam-index,summary
steps=copy-reference,index,align,sort,bam-index

[input:rna-single:reads]
label=Reads FASTQ
type=file
required=true
filter=Uncompressed FASTQ|*.fastq;*.fq|All files|*.*
help=Uncompressed Phred+33 FASTQ. ASCII paths only; spaces are supported, commas are not.

[input:rna-single:reference]
label=Reference genome FASTA
type=file
required=true
filter=Uncompressed FASTA|*.fa;*.fasta;*.fna|All files|*.*
help=Genomic DNA reference, not a transcriptome. A private copy and large-format index are created in the results. Index building for large genomes needs substantial RAM, disk space and time.

[input:rna-single:sample]
label=Sample ID
type=text
required=true
default=sample1
constraint=identifier
help=Recorded in the SAM/BAM read group. Use the correct sample/library and a unique read-group ID for each lane.

[input:rna-single:read-group]
label=Read-group ID
type=text
required=true
default=rg1
constraint=identifier
help=Recorded in the SAM/BAM read group. Use the correct sample/library and a unique read-group ID for each lane.

[input:rna-single:library]
label=Library ID
type=text
required=true
default=lib1
constraint=identifier
help=Recorded in the SAM/BAM read group. Use the correct sample/library and a unique read-group ID for each lane.

[input:rna-single:platform-unit]
label=Platform unit / lane
type=text
required=true
default=unit1
constraint=identifier
help=Recorded in the SAM/BAM read group. Use the correct sample/library and a unique read-group ID for each lane.

[input:rna-single:platform]
label=Sequencing platform
type=choice
required=true
default=ILLUMINA
choices=ILLUMINA:Illumina|DNBSEQ:DNBSEQ (MGI/BGI)
help=Recorded as the read-group PL value.

[input:rna-single:threads]
label=HISAT2 CPU threads
type=integer
required=true
default=2
min=1
max=64
help=Workers for HISAT2 indexing and alignment. More workers may use more RAM. SAMtools remains single-threaded in this portable build.

[input:rna-single:seed]
label=Alignment seed
type=integer
required=true
default=0
min=0
max=2147483647
help=Seed for HISAT2 deterministic tie breaking. Input names/sequences/qualities also affect tie breaking; all settings are recorded.

[input:rna-single:strandness]
label=RNA library strandedness
type=choice
required=true
default=unstranded
choices=unstranded:Unstranded|F:Read follows transcript (F)|R:Read opposes transcript (R)
help=Select the actual library preparation. FR/RF are transcript-strand conventions and are separate from the paired reads physical orientation. The workbench build makes the ordinary unstranded default explicit.

[input:rna-single:min-intron]
label=Minimum intron length
type=integer
required=true
default=20
min=20
max=500000
help=Shortest splice gap, in bases. Must not exceed maximum intron length.

[input:rna-single:max-intron]
label=Maximum intron length
type=integer
required=true
default=500000
min=20
max=10000000
help=Longest splice gap, in bases. Must be at least the minimum intron length. Choose a range appropriate to the organism.

[input:rna-single:sort-memory-mb]
label=BAM sorting memory (MiB)
type=integer
required=true
default=256
min=64
max=8192
help=SAMtools sorting memory for its one worker; this does not cap HISAT2 indexing/alignment memory.

[output:rna-single:reference]
label=Private indexed reference
path=reference.fa
final=false
nonempty=true

[output:rna-single:index-1]
label=HISAT2 large index 1
path=reference.1.ht2l
final=false
nonempty=true

[output:rna-single:index-2]
label=HISAT2 large index 2
path=reference.2.ht2l
final=false
nonempty=true

[output:rna-single:index-3]
label=HISAT2 large index 3
path=reference.3.ht2l
final=false
nonempty=true

[output:rna-single:index-4]
label=HISAT2 large index 4
path=reference.4.ht2l
final=false
nonempty=true

[output:rna-single:index-5]
label=HISAT2 large index 5
path=reference.5.ht2l
final=false
nonempty=true

[output:rna-single:index-6]
label=HISAT2 large index 6
path=reference.6.ht2l
final=false
nonempty=true

[output:rna-single:index-7]
label=HISAT2 large index 7
path=reference.7.ht2l
final=false
nonempty=true

[output:rna-single:index-8]
label=HISAT2 large index 8
path=reference.8.ht2l
final=false
nonempty=true

[output:rna-single:aligned-sam]
label=Unsorted RNA alignment SAM
path=alignment.unsorted.sam
final=false
nonempty=true

[output:rna-single:aligned]
label=Coordinate-sorted RNA BAM
path=alignment.sorted.bam
final=true
nonempty=true

[output:rna-single:bam-index]
label=RNA BAM CSI index
path=alignment.sorted.bam.csi
final=true
nonempty=true

[output:rna-single:summary]
label=HISAT2 alignment summary
path=alignment-summary.txt
final=true
nonempty=true

[step:rna-single:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:rna-single:index]
label=Build the 64-bit HISAT2 reference index
kind=exec
tool=hisat2-build-l
produces=index-1,index-2,index-3,index-4,index-5,index-6,index-7,index-8
arg.0=-p
arg.1={input:threads}
arg.2={output:reference}
arg.3={run}/reference

[step:rna-single:align]
label=HISAT2 RNA single reads
kind=exec
tool=hisat2-align-l
produces=aligned-sam,summary
arg.0=--wrapper
arg.1=basic-0
arg.2=-x
arg.3={run}/reference
arg.4=-S
arg.5={output:aligned-sam}
arg.6=-p
arg.7={input:threads}
arg.8=--seed
arg.9={input:seed}
arg.10=--reorder
arg.11=--phred33
arg.12=--rg-id
arg.13={input:read-group}
arg.14=--rg
arg.15=SM:{input:sample}
arg.16=--rg
arg.17=LB:{input:library}
arg.18=--rg
arg.19=PL:{input:platform}
arg.20=--rg
arg.21=PU:{input:platform-unit}
arg.22=--summary-file
arg.23={output:summary}
arg.24=--new-summary
arg.25=--dta
arg.26=--rna-strandness
arg.27={input:strandness}
arg.28=--min-intronlen
arg.29={input:min-intron}
arg.30=--max-intronlen
arg.31={input:max-intron}
arg.32=-U
arg.33={input:reads}

[step:rna-single:sort]
label=Sort RNA alignments by coordinate
kind=exec
tool=samtools
produces=aligned
arg.0=sort
arg.1=-m
arg.2={input:sort-memory-mb}M
arg.3=-o
arg.4={output:aligned}
arg.5={output:aligned-sam}

[step:rna-single:bam-index]
label=Index the coordinate-sorted RNA BAM
kind=exec
tool=samtools
produces=bam-index
arg.0=index
arg.1=-c
arg.2={output:aligned}
arg.3={output:bam-index}

