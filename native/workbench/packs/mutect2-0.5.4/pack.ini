name=Mutect2: tumor only + population/PoN
description=Somatic SNV/indel candidates with GATK 4.7.0.0, read-orientation modeling and FilterMutectCalls; tumor-only; germline variants may remain.
inputs=tumor,reference,targets,tumor-sample,germline-resource,panel-of-normals,memory,minimum-base-quality,minimum-mapping-quality,max-reads-per-start,contamination
outputs=variants,variants-index,pass-variants,pass-index,unfiltered,call-stats,f1r2,orientation-priors,filtering-stats,variant-stats,pass-stats,filtered,reference,reference-index,reference-dict,tumor-copy,tumor-index,germline-resource,germline-resource-index,panel-of-normals,panel-of-normals-index
steps=copy-reference,index-reference,reference-dictionary,copy-tumor,index-tumor,stage-germline-resource,index-germline-resource,stage-panel-of-normals,index-panel-of-normals,call,orientation,filter,compress,index,pass,pass-index,statistics,pass-statistics

[input:tumor-only-resources:tumor]
label=Prepared tumor BAM
type=file
required=true
filter=Coordinate-sorted BAM|*.bam
help=One tumor sample per BAM. Prepare DNA alignments and mark duplicates before calling; assay-specific BQSR remains a separate preparation decision.

[input:tumor-only-resources:reference]
label=Matching reference genome
type=file
required=true
filter=Uncompressed FASTA|*.fa;*.fasta;*.fna

[input:tumor-only-resources:targets]
label=Calling intervals (BED3)
type=file
required=true
filter=BED intervals|*.bed
help=Zero-based, end-exclusive intervals. To call an entire reference, provide one full-length interval per contig. This also bounds local computation.

[input:tumor-only-resources:tumor-sample]
label=Tumor sample name (BAM SM)
type=text
required=true
default=TUMOR
constraint=identifier
help=Must match the tumor BAM SM; use an ASCII identifier containing letters, digits, dot, underscore or hyphen.

[input:tumor-only-resources:germline-resource]
label=Population germline AF resource
type=file
required=true
filter=VCF or compressed VCF|*.vcf;*.vcf.gz
help=GATK-compatible population VCF with INFO/AF for the identical reference assembly. It is staged and indexed locally.

[input:tumor-only-resources:panel-of-normals]
label=Panel of normals (PoN)
type=file
required=true
filter=VCF or compressed VCF|*.vcf;*.vcf.gz
help=A compatible precomputed Mutect2 panel of normals for the assay/reference. No resources are downloaded during analysis.

[input:tumor-only-resources:memory]
label=Maximum Java heap (MiB)
type=integer
required=true
default=2048
min=512
max=65536
help=Additional memory is needed outside the Java heap. Pure-Java alignment likelihoods favor portability over native SIMD speed.

[input:tumor-only-resources:minimum-base-quality]
label=Minimum base quality
type=integer
required=true
default=10
min=6
max=93

[input:tumor-only-resources:minimum-mapping-quality]
label=Minimum read mapping quality
type=integer
required=true
default=20
min=0
max=60

[input:tumor-only-resources:max-reads-per-start]
label=Maximum reads per alignment start
type=integer
required=true
default=50
min=0
max=100000
help=GATK default is 50; zero disables this downsampling limit.

[input:tumor-only-resources:contamination]
label=Previously estimated contamination fraction
type=text
required=true
default=0
help=A fraction from 0 to 1, for example 0.027 for 2.7%, used only by FilterMutectCalls. The exact entered number is retained. This pack does not estimate contamination; default zero is not a measurement.

