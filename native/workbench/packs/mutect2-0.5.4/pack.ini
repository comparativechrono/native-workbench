[workflow:tumor-only]
name=Mutect2: tumor only
description=Somatic SNV/indel candidates with GATK 4.7.0.0, read-orientation modeling and FilterMutectCalls; tumor-only; germline variants may remain.
inputs=tumor,reference,targets,tumor-sample,memory,minimum-base-quality,minimum-mapping-quality,max-reads-per-start,contamination
outputs=variants,variants-index,pass-variants,pass-index,unfiltered,call-stats,f1r2,orientation-priors,filtering-stats,variant-stats,pass-stats,filtered,reference,reference-index,reference-dict,tumor-copy,tumor-index
steps=copy-reference,index-reference,reference-dictionary,copy-tumor,index-tumor,call,orientation,filter,compress,index,pass,pass-index,statistics,pass-statistics

[input:tumor-only:tumor]
label=Prepared tumor BAM
type=file
required=true
filter=Coordinate-sorted BAM|*.bam
help=One tumor sample per BAM. Prepare DNA alignments and mark duplicates before calling; assay-specific BQSR remains a separate preparation decision.

[input:tumor-only:reference]
label=Matching reference genome
type=file
required=true
filter=Uncompressed FASTA|*.fa;*.fasta;*.fna

[input:tumor-only:targets]
label=Calling intervals (BED3)
type=file
required=true
filter=BED intervals|*.bed
help=Zero-based, end-exclusive intervals. To call an entire reference, provide one full-length interval per contig. This also bounds local computation.

[input:tumor-only:tumor-sample]
label=Tumor sample name (BAM SM)
type=text
required=true
default=TUMOR
constraint=identifier
help=Must match the tumor BAM SM; use an ASCII identifier containing letters, digits, dot, underscore or hyphen.

[input:tumor-only:memory]
label=Maximum Java heap (MiB)
type=integer
required=true
default=2048
min=512
max=65536
help=Additional memory is needed outside the Java heap. Pure-Java alignment likelihoods favor portability over native SIMD speed.

[input:tumor-only:minimum-base-quality]
label=Minimum base quality
type=integer
required=true
default=10
min=6
max=93

[input:tumor-only:minimum-mapping-quality]
label=Minimum read mapping quality
type=integer
required=true
default=20
min=0
max=60

[input:tumor-only:max-reads-per-start]
label=Maximum reads per alignment start
type=integer
required=true
default=50
min=0
max=100000
help=GATK default is 50; zero disables this downsampling limit.

[input:tumor-only:contamination]
label=Previously estimated contamination fraction
type=text
required=true
default=0
help=A fraction from 0 to 1, for example 0.027 for 2.7%, used only by FilterMutectCalls. The exact entered number is retained. This pack does not estimate contamination; default zero is not a measurement.

[output:tumor-only:variants]
label=Filtered calls with all FILTER labels
path=variants.vcf.gz
final=true
nonempty=true

[output:tumor-only:variants-index]
label=Filtered-call CSI index
path=variants.vcf.gz.csi
final=true
nonempty=true

[output:tumor-only:pass-variants]
label=PASS calls
path=variants.pass.vcf.gz
final=true
nonempty=true

[output:tumor-only:pass-index]
label=PASS-call CSI index
path=variants.pass.vcf.gz.csi
final=true
nonempty=true

[output:tumor-only:unfiltered]
label=Unfiltered Mutect2 candidates
path=unfiltered.vcf
final=true
nonempty=true

[output:tumor-only:call-stats]
label=Mutect2 calling statistics
path=unfiltered.vcf.stats
final=true
nonempty=true

[output:tumor-only:f1r2]
label=Read orientation counts
path=f1r2.tar.gz
final=true
nonempty=true

[output:tumor-only:orientation-priors]
label=Learned orientation artifact priors
path=orientation-priors.tar.gz
final=true
nonempty=true

[output:tumor-only:filtering-stats]
label=FilterMutectCalls statistics
path=filtering-stats.tsv
final=true
nonempty=true

[output:tumor-only:variant-stats]
label=All-call summary
path=variant-stats.txt
final=true
nonempty=true

[output:tumor-only:pass-stats]
label=PASS-call summary
path=pass-stats.txt
final=true
nonempty=true

[output:tumor-only:filtered]
label=Original FilterMutectCalls VCF
path=filtered.vcf
final=false
nonempty=true

[output:tumor-only:reference]
label=Private reference
path=reference.fa
final=false
nonempty=true

[output:tumor-only:reference-index]
label=Reference FAI
path=reference.fa.fai
final=false
nonempty=true

[output:tumor-only:reference-dict]
label=Reference dictionary
path=reference.dict
final=false
nonempty=true

[output:tumor-only:tumor-copy]
label=Private tumor BAM
path=tumor.bam
final=false
nonempty=true

[output:tumor-only:tumor-index]
label=Private tumor BAI
path=tumor.bam.bai
final=false
nonempty=true

[step:tumor-only:copy-reference]
label=Stage a private reference
kind=copy
source={input:reference}
destination=reference

[step:tumor-only:index-reference]
label=Index the private reference
kind=exec
tool=samtools
produces=reference-index
arg.0=faidx
arg.1={output:reference}

[step:tumor-only:reference-dictionary]
label=Create the reference sequence dictionary
kind=exec
tool=samtools
stdout=reference-dict
arg.0=dict
arg.1={output:reference}

[step:tumor-only:copy-tumor]
label=Stage a private tumor BAM
kind=copy
source={input:tumor}
destination=tumor-copy

[step:tumor-only:index-tumor]
label=Index the private tumor BAM
kind=exec
tool=samtools
produces=tumor-index
arg.0=index
arg.1=-b
arg.2={output:tumor-copy}
arg.3={output:tumor-index}

[step:tumor-only:call]
label=Call candidates with GATK Mutect2
kind=exec
tool=java
produces=unfiltered,call-stats,f1r2
arg.0=-Xms64m
arg.1=-Xmx{input:memory}m
arg.2=-XX:+DisableAttachMechanism
arg.3=-XX:-UsePerfData
arg.4=-Djava.awt.headless=true
arg.5=-Duser.language=en
arg.6=-Duser.country=US
arg.7=-Duser.timezone=UTC
arg.8=-Dfile.encoding=UTF-8
arg.9=-Djava.io.tmpdir={run}
arg.10=-Dsamjdk.use_jdk_inflater=true
arg.11=-Dsamjdk.use_jdk_deflater=true
arg.12=-Dsamjdk.use_libdeflate=false
arg.13=-Dsamjdk.snappy.disable=true
arg.14=-jar
arg.15={asset:gatk-compat}
arg.16=Mutect2
arg.17=--tmp-dir
arg.18={run}
arg.19=--use-jdk-inflater
arg.20=true
arg.21=--use-jdk-deflater
arg.22=true
arg.23=-R
arg.24={output:reference}
arg.25=-I
arg.26={output:tumor-copy}
arg.27=-L
arg.28={input:targets}
arg.29=-O
arg.30={output:unfiltered}
arg.31=--f1r2-tar-gz
arg.32={output:f1r2}
arg.33=--pair-hmm-implementation
arg.34=LOGLESS_CACHING
arg.35=--smith-waterman
arg.36=JAVA
arg.37=--minimum-mapping-quality
arg.38={input:minimum-mapping-quality}
arg.39=--min-base-quality-score
arg.40={input:minimum-base-quality}
arg.41=--max-reads-per-alignment-start
arg.42={input:max-reads-per-start}
arg.43=--create-output-variant-index
arg.44=false
arg.45=--add-output-vcf-command-line
arg.46=false

[step:tumor-only:orientation]
label=Learn the read orientation artifact model
kind=exec
tool=java
produces=orientation-priors
arg.0=-Xms64m
arg.1=-Xmx{input:memory}m
arg.2=-XX:+DisableAttachMechanism
arg.3=-XX:-UsePerfData
arg.4=-Djava.awt.headless=true
arg.5=-Duser.language=en
arg.6=-Duser.country=US
arg.7=-Duser.timezone=UTC
arg.8=-Dfile.encoding=UTF-8
arg.9=-Djava.io.tmpdir={run}
arg.10=-Dsamjdk.use_jdk_inflater=true
arg.11=-Dsamjdk.use_jdk_deflater=true
arg.12=-Dsamjdk.use_libdeflate=false
arg.13=-Dsamjdk.snappy.disable=true
arg.14=-jar
arg.15={asset:gatk-compat}
arg.16=LearnReadOrientationModel
arg.17=--tmp-dir
arg.18={run}
arg.19=--use-jdk-inflater
arg.20=true
arg.21=--use-jdk-deflater
arg.22=true
arg.23=-I
arg.24={output:f1r2}
arg.25=-O
arg.26={output:orientation-priors}

[step:tumor-only:filter]
label=Filter Mutect2 candidates
kind=exec
tool=java
produces=filtered,filtering-stats
arg.0=-Xms64m
arg.1=-Xmx{input:memory}m
arg.2=-XX:+DisableAttachMechanism
arg.3=-XX:-UsePerfData
arg.4=-Djava.awt.headless=true
arg.5=-Duser.language=en
arg.6=-Duser.country=US
arg.7=-Duser.timezone=UTC
arg.8=-Dfile.encoding=UTF-8
arg.9=-Djava.io.tmpdir={run}
arg.10=-Dsamjdk.use_jdk_inflater=true
arg.11=-Dsamjdk.use_jdk_deflater=true
arg.12=-Dsamjdk.use_libdeflate=false
arg.13=-Dsamjdk.snappy.disable=true
arg.14=-jar
arg.15={asset:gatk-compat}
arg.16=FilterMutectCalls
arg.17=--tmp-dir
arg.18={run}
arg.19=--use-jdk-inflater
arg.20=true
arg.21=--use-jdk-deflater
arg.22=true
arg.23=-R
arg.24={output:reference}
arg.25=-V
arg.26={output:unfiltered}
arg.27=--stats
arg.28={output:call-stats}
arg.29=--orientation-bias-artifact-priors
arg.30={output:orientation-priors}
arg.31=--contamination-estimate
arg.32={input:contamination}
arg.33=--filtering-stats
arg.34={output:filtering-stats}
arg.35=-O
arg.36={output:filtered}
arg.37=--create-output-variant-index
arg.38=false
arg.39=--add-output-vcf-command-line
arg.40=false

[step:tumor-only:compress]
label=Compress filtered calls preserving records and annotations
kind=exec
tool=bcftools
produces=variants
arg.0=view
arg.1=-Oz
arg.2=-o
arg.3={output:variants}
arg.4={output:filtered}

[step:tumor-only:index]
label=Index filtered calls
kind=exec
tool=bcftools
produces=variants-index
arg.0=index
arg.1=--csi
arg.2={output:variants}

[step:tumor-only:pass]
label=Export PASS records separately
kind=exec
tool=bcftools
produces=pass-variants
arg.0=view
arg.1=-f
arg.2=PASS
arg.3=-Oz
arg.4=-o
arg.5={output:pass-variants}
arg.6={output:variants}

[step:tumor-only:pass-index]
label=Index PASS calls
kind=exec
tool=bcftools
produces=pass-index
arg.0=index
arg.1=--csi
arg.2={output:pass-variants}

[step:tumor-only:statistics]
label=Summarize all calls
kind=exec
tool=bcftools
stdout=variant-stats
arg.0=stats
arg.1={output:variants}

[step:tumor-only:pass-statistics]
label=Summarize PASS calls
kind=exec
tool=bcftools
stdout=pass-stats
arg.0=stats
arg.1={output:pass-variants}

[workflow:tumor-normal]
name=Mutect2: tumor + matched normal
description=Somatic SNV/indel candidates with GATK 4.7.0.0, read-orientation modeling and FilterMutectCalls; matched tumor/normal.
