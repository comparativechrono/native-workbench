name=VarDictJava: targeted calls (experimental Fisher)
description=Single-sample targeted SNV/indel calling with VarDictJava 1.8.3, its experimental Java Fisher mode and the original Perl VCF converter.
inputs=alignment,reference,targets,sample,minimum-frequency,minimum-depth,minimum-alt,base-quality,mapping-quality,read-position,threads,memory
outputs=reference,reference-index,alignment-copy,bam-index,calls-table,raw-vcf,header-vcf,variants,variants-index,pass-variants,pass-index,variant-stats,pass-stats
steps=copy-reference,index-reference,copy-bam,index-bam,call,convert,reference-header,normalize,index,pass,pass-index,stats,pass-stats

[input:call:alignment]
label=Prepared coordinate-sorted single-sample BAM
type=file
required=true
filter=BAM alignment|*.bam
help=All read groups must identify one sample. Use DNA alignments, with duplicates marked as appropriate for the assay.

[input:call:reference]
label=Matching reference genome
type=file
required=true
filter=Uncompressed FASTA|*.fa;*.fasta;*.fna

[input:call:targets]
label=Target intervals (BED4)
type=file
required=true
filter=Target intervals|*.bed
help=Nonoverlapping tab-separated chromosome, zero-based start, end, region name. Contigs and bounds must match the reference.

[input:call:sample]
label=Sample name (BAM SM)
type=text
required=true
default=sample
constraint=identifier
help=Must match the single sample name in the BAM read groups.

[input:call:minimum-frequency]
label=Minimum candidate allele fraction
type=choice
required=true
default=0.02
choices=0.01:1%|0.02:2%|0.05:5%|0.1:10%|0.2:20%|0.3:30%
help=Single-sample calling cannot distinguish somatic from germline variants. Choose thresholds for the assay.

[input:call:minimum-depth]
label=VCF minimum total depth
type=integer
required=true
default=8
min=1
max=1000000

[input:call:minimum-alt]
label=Minimum alternate-supporting reads
type=integer
required=true
default=3
min=1
max=1000000

[input:call:base-quality]
label=Good-base Phred quality
type=integer
required=true
default=25
min=1
max=93

[input:call:mapping-quality]
label=Minimum read mapping quality
type=integer
required=true
default=20
min=0
max=60

[input:call:read-position]
label=VCF minimum mean read position
type=integer
required=true
default=8
min=1
max=1000

[input:call:threads]
label=Threads
type=integer
required=true
default=1
min=1
max=64

[input:call:memory]
label=Maximum Java heap (MiB)
type=integer
required=true
default=1024
min=256
max=32768
help=Additional RAM is needed outside the Java heap. Targeted intervals are recommended; this is not an optimized whole-genome workflow.

[output:call:reference]
label=Private reference
path=reference.fa
final=false
nonempty=true

[output:call:reference-index]
label=Reference FAI
path=reference.fa.fai
final=false
nonempty=true

[output:call:alignment-copy]
label=Private BAM
path=alignment.bam
final=false
nonempty=true

[output:call:bam-index]
label=Private BAM index
path=alignment.bam.bai
final=false
nonempty=true

[output:call:calls-table]
label=VarDict candidate table (experimental Java Fisher)
path=vardict.tsv
final=true
nonempty=false

[output:call:raw-vcf]
label=Original upstream converter VCF
path=raw.vcf
final=false
nonempty=true

[output:call:header-vcf]
label=Reference-header VCF
path=header.vcf
final=false
nonempty=true

[output:call:variants]
label=Normalized calls with VarDict FILTER labels
path=variants.vcf.gz
final=true
nonempty=true

[output:call:variants-index]
label=All-call CSI index
path=variants.vcf.gz.csi
final=true
nonempty=true

[output:call:pass-variants]
label=PASS-only calls
path=variants.pass.vcf.gz
final=true
nonempty=true

[output:call:pass-index]
label=PASS-call CSI index
path=variants.pass.vcf.gz.csi
final=true
nonempty=true

[output:call:variant-stats]
label=All-call statistics
path=variant-stats.txt
final=true
nonempty=true

[output:call:pass-stats]
label=PASS-call statistics
path=pass-stats.txt
final=true
nonempty=true

[step:call:copy-reference]
label=Stage a private reference
kind=copy
source={input:reference}
destination=reference

[step:call:index-reference]
label=Index the reference
kind=exec
tool=samtools
produces=reference-index
arg.0=faidx
arg.1={output:reference}

[step:call:copy-bam]
label=Stage a private alignment
kind=copy
source={input:alignment}
destination=alignment-copy

[step:call:index-bam]
label=Index the private BAM
kind=exec
tool=samtools
produces=bam-index
arg.0=index
arg.1=-b
arg.2={output:alignment-copy}
arg.3={output:bam-index}

[step:call:call]
label=VarDictJava 1.8.3 (experimental Java Fisher)
kind=exec
tool=java
stdout=calls-table
arg.0=-Xms64m
arg.1=-Xmx{input:memory}m
arg.2=-XX:+DisableAttachMechanism
arg.3=-XX:-UsePerfData
arg.4=-Djava.awt.headless=true
arg.5=-Duser.language=en
arg.6=-Duser.country=US
arg.7=-Duser.timezone=UTC
arg.8=-Dfile.encoding=UTF-8
arg.9=-Dsamjdk.use_jdk_inflater=true
arg.10=-Dsamjdk.use_jdk_deflater=true
arg.11=-cp
arg.12={asset:vardict};{asset:commons-cli};{asset:commons-math3};{asset:jregex};{asset:htsjdk}
arg.13=com.astrazeneca.vardict.Main
arg.14=-G
arg.15={output:reference}
arg.16=-b
arg.17={output:alignment-copy}
arg.18=-N
arg.19={input:sample}
arg.20=-z
arg.21=-c
arg.22=1
arg.23=-S
arg.24=2
arg.25=-E
arg.26=3
arg.27=-g
arg.28=4
arg.29=-th
arg.30={input:threads}
arg.31=-f
arg.32={input:minimum-frequency}
arg.33=-r
arg.34={input:minimum-alt}
arg.35=-q
arg.36={input:base-quality}
arg.37=-Q
arg.38={input:mapping-quality}
arg.39=-k
arg.40=1
arg.41=-U
arg.42=--fisher
arg.43=-VS
arg.44=STRICT
arg.45={input:targets}

[step:call:convert]
label=Convert with the original upstream Perl VCF script
kind=exec
tool=perl
stdout=raw-vcf
arg.0=-T
arg.1={asset:converter-adapter}
arg.2={output:calls-table}
arg.3={input:sample}
arg.4={input:minimum-frequency}
arg.5={input:minimum-depth}
arg.6={input:minimum-alt}
arg.7={input:base-quality}
arg.8={input:mapping-quality}
arg.9={input:read-position}

[step:call:reference-header]
label=Add complete reference contig headers
kind=exec
tool=bcftools
produces=header-vcf
arg.0=reheader
arg.1=-f
arg.2={output:reference-index}
arg.3=-o
arg.4={output:header-vcf}
arg.5={output:raw-vcf}

[step:call:normalize]
label=Check REF alleles, left-align and split multiallelic records
kind=exec
tool=bcftools
produces=variants
arg.0=norm
arg.1=-c
arg.2=e
arg.3=-f
arg.4={output:reference}
arg.5=-m
arg.6=-any
arg.7=-Oz
arg.8=-o
arg.9={output:variants}
arg.10={output:header-vcf}

[step:call:index]
label=Index normalized variants
kind=exec
tool=bcftools
produces=variants-index
arg.0=index
arg.1=--csi
arg.2={output:variants}

[step:call:pass]
label=Select PASS calls separately
kind=exec
tool=bcftools
produces=pass-variants
arg.0=view
arg.1=-f
arg.2=PASS
arg.3=-Oz
arg.4=-o
arg.5={output:pass-variants}
arg.6={output:variants}

[step:call:pass-index]
label=Index PASS calls
kind=exec
tool=bcftools
produces=pass-index
arg.0=index
arg.1=--csi
arg.2={output:pass-variants}

[step:call:stats]
label=Summarize all calls
kind=exec
tool=bcftools
stdout=variant-stats
arg.0=stats
arg.1={output:variants}

[step:call:pass-stats]
label=Summarize PASS calls
kind=exec
tool=bcftools
stdout=pass-stats
arg.0=stats
arg.1={output:pass-variants}
