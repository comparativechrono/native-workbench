[output:call-variants:reference]
label=Working reference
path=reference.fa
final=false
nonempty=true

[output:call-variants:reference-index]
label=Reference index
path=reference.fa.fai
final=false
nonempty=true

[output:call-variants:prepared]
label=BAM with Dindel indel qualities
path=indel-qualities.bam
final=true
nonempty=true

[output:call-variants:prepared-index]
label=BAM index
path=indel-qualities.bam.csi
final=true
nonempty=true

[output:call-variants:alignment-statistics]
label=Prepared alignment summary
path=alignment-statistics.txt
