[pack]
format=2
id=lofreq
version=0.5.3
name=LoFreq quality-aware variant calling
platform=windows-x86_64
description=Local low-frequency DNA SNV calling and Illumina Dindel-quality preparation/calling; site-only PASS VCF.
color=#557DA5

[tool:lofreq]
path=bin/lofreq.exe
version=2.1.5-workbench-port2
sha256=e4337e5ff5974d37d3a6299afa55074a8652719796a8af9638d64242151db9d0

[tool:samtools]
path=bin/samtools.exe
version=1.24
sha256=49c2f16425d464e4ad1c1439d7a9e32a3b1c1bf8e5d54403778de610d2f440b3

[asset:workbench-schema]
path=workbench-schema.json
sha256=0075d2880082772ac94e27a20a267e747e97974c48081d695bded16d3a2d8b78

[asset:workbench-checks]
path=workbench-checks.json
sha256=b1b4d6692c7d33a2464bf09d58ee01a0cdb3a3a19f9e9dfcd6d0f1a9b649c2e8

[asset:fixture-reference]
path=fixtures/reference.fa
sha256=699ef230768d2106c5ecd23301e47efbcac396bb989a35f75dc4a0269812df69

[asset:fixture-snps]
path=fixtures/snps.bam
sha256=65bb2043beff0a57ecadd763047371b79e42abae53b2e0939b5b4d0001324be9

[asset:fixture-indels]
path=fixtures/indels.bam
sha256=fc48fd42e226ea61417a8e7f8a43dd8fecce8ab11934853abef89f44d0c4b86c

[asset:fixture-snps-sam]
path=fixtures/snps.sam
sha256=2e60ff0fa082fec936853ed44b0a018c1c96e1506179ebdff7182bb08dca0787

[asset:fixture-indels-sam]
path=fixtures/indels.sam
sha256=d1a4ee06fcf20bdbbf9f43fbd983c7d61e86bf55b26e677b1945757a212d8f1d

[workflow:call-snps]
name=LoFreq: low-frequency SNVs
description=Quality-aware SNV detection with allele frequencies, dynamic multiple-testing correction and default filters. Site-only VCF; no genotypes.
inputs=alignment,reference,min-mapq,min-baseq,min-coverage,max-depth,significance
outputs=reference,reference-index,variants
steps=check-bam,copy-reference,index-reference,call

[input:call-snps:alignment]
label=Coordinate-sorted DNA alignments
type=file
required=true
filter=BAM alignments|*.bam|All files|*.*
help=DNA BAM aligned to the supplied reference. Duplicate-marked reads are recommended. RNA/spliced alignments are not supported by Dindel preparation.

[input:call-snps:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[input:call-snps:min-mapq]
label=Minimum mapping quality
type=integer
required=true
default=20
min=0
max=60

[input:call-snps:min-baseq]
label=Minimum reference and alternate base quality
type=integer
required=true
default=20
min=0
max=93

[input:call-snps:min-coverage]
label=Minimum tested coverage
type=integer
required=true
default=10
min=10
max=1000000
help=LoFreq also applies its default minimum coverage filter of 10.

[input:call-snps:max-depth]
label=Maximum pileup depth
type=integer
required=true
default=1000000
min=100
max=1000000
help=Depth above this cap is limited by LoFreq; raising it increases memory and runtime.

[input:call-snps:significance]
label=Significance level
type=choice
required=true
default=0.01
choices=0.05:0.05|0.01:0.01|0.001:0.001
help=Nominal significance before dynamic Bonferroni correction. Default strand-bias filtering is also applied.

[output:call-snps:reference]
label=Working reference
path=reference.fa
final=false
nonempty=true

[output:call-snps:reference-index]
label=Reference index
path=reference.fa.fai
final=false
nonempty=true

[output:call-snps:variants]
label=PASS site-only variants (no genotypes)
path=variants.vcf
final=true
nonempty=true

[step:call-snps:check-bam]
label=Check BAM integrity
kind=exec
tool=samtools
arg.0=quickcheck
arg.1=-v
arg.2={input:alignment}

[step:call-snps:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:call-snps:index-reference]
label=Index reference
kind=exec
tool=samtools
produces=reference-index
arg.0=faidx
arg.1={output:reference}

[step:call-snps:call]
label=Call quality-aware low-frequency variants
kind=exec
tool=lofreq
produces=variants
arg.0=call
arg.1=-f
arg.2={output:reference}
arg.3=-o
arg.4={output:variants}
arg.5=-m
arg.6={input:min-mapq}
arg.7=-q
arg.8={input:min-baseq}
arg.9=-Q
arg.10={input:min-baseq}
arg.11=-C
arg.12={input:min-coverage}
arg.13=-d
arg.14={input:max-depth}
arg.15=-a
arg.16={input:significance}
arg.17={input:alignment}

[workflow:indelqual-dindel]
name=LoFreq: prepare Illumina indel qualities
description=Add reference-context Dindel BI/BD qualities to a new DNA BAM and index it. Illumina assumptions; existing tags are replaced.
inputs=alignment,reference
outputs=reference,reference-index,prepared,prepared-index,alignment-statistics
steps=check-bam,copy-reference,index-reference,indelqual,index-bam,summarize

[input:indelqual-dindel:alignment]
label=Coordinate-sorted DNA alignments
type=file
required=true
filter=BAM alignments|*.bam|All files|*.*
help=DNA BAM aligned to the supplied reference. Duplicate-marked reads are recommended. RNA/spliced alignments are not supported by Dindel preparation.

[input:indelqual-dindel:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[output:indelqual-dindel:reference]
label=Working reference
path=reference.fa
final=false
nonempty=true

[output:indelqual-dindel:reference-index]
label=Reference index
path=reference.fa.fai
final=false
nonempty=true

[output:indelqual-dindel:prepared]
label=BAM with Dindel indel qualities
path=indel-qualities.bam
final=true
nonempty=true

[output:indelqual-dindel:prepared-index]
label=BAM index
path=indel-qualities.bam.csi
final=true
nonempty=true

[output:indelqual-dindel:alignment-statistics]
label=Prepared alignment summary
path=alignment-statistics.txt
final=true
nonempty=true

[step:indelqual-dindel:check-bam]
label=Check BAM integrity
kind=exec
tool=samtools
arg.0=quickcheck
arg.1=-v
arg.2={input:alignment}

[step:indelqual-dindel:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:indelqual-dindel:index-reference]
label=Index reference
kind=exec
tool=samtools
produces=reference-index
arg.0=faidx
arg.1={output:reference}

[step:indelqual-dindel:indelqual]
label=Add Illumina Dindel qualities
kind=exec
tool=lofreq
produces=prepared
arg.0=indelqual
arg.1=--dindel
arg.2=-f
arg.3={output:reference}
arg.4=-o
arg.5={output:prepared}
arg.6={input:alignment}

[step:indelqual-dindel:index-bam]
label=Index prepared BAM
kind=exec
tool=samtools
produces=prepared-index
arg.0=index
arg.1=-c
arg.2={output:prepared}

[step:indelqual-dindel:summarize]
label=Summarize prepared alignments
kind=exec
tool=samtools
stdout=alignment-statistics
arg.0=flagstat
arg.1={output:prepared}

[workflow:call-variants]
name=LoFreq: Illumina SNVs and indels
description=Generate Dindel indel qualities in a new BAM, then call SNVs and indels with LoFreq. Site-only VCF; no genotypes.
inputs=alignment,reference,min-mapq,min-baseq,min-coverage,max-depth,significance
outputs=reference,reference-index,prepared,prepared-index,alignment-statistics,variants
steps=check-bam,copy-reference,index-reference,indelqual,index-bam,summarize,call

