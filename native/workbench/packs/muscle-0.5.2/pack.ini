[pack]
format=2
id=muscle
version=0.5.2
name=MUSCLE multiple sequence alignment
platform=windows-x86_64
description=Align homologous nucleotide or protein sequences with MUSCLE 5.3-workbench1. Standard alignment and Super5; local execution.
color=#687BB5

[tool:muscle]
path=bin/muscle.exe
version=5.3-workbench1
sha256=edc84f98e1f3cbf6f3df717ccfdb03af7ad7677cd9ae2e66065f2079d0ed2146

[asset:fixture-protein]
path=fixtures/protein.fa
sha256=7e09fa83c10cbce7f6f99bf1307f8dfabfeaa993e303c6267b4a3082ed33995b

[asset:fixture-nucleotide]
path=fixtures/nucleotide.fa
sha256=9852b4edd2dfd3a837aab7985768bea8d2fbb81ace36345c136a581a3a528f90

[asset:workbench-checks]
path=workbench-checks.json
sha256=dd6d8c972d53bfa18110e4df2a2ef02f47bc31b29c6c726083f31f2ca1644aaf

[asset:workbench-schema]
path=workbench-schema.json
sha256=658d435eabc2784b3d80a432ea563f3c388530ea4ebb6d1c867ad442621fabdd

[asset:openmp]
path=bin/libomp.dll
sha256=47619606767a9760a84d867e27ce0775940f3a1824bdf61ee33b45a1fbd77ea6

[workflow:align-nucleotide]
name=Align nucleotide sequences
description=Standard high-accuracy alignment for modest sets of homologous sequences. This pack allows 2 or more sequences, each at most 15,000 residues. Memory use is not capped; use Super5 if standard alignment becomes too expensive.
inputs=sequences,threads,perturb,permutation
outputs=aligned
steps=align

[input:align-nucleotide:sequences]
label=Unaligned nucleotide FASTA
type=file
required=true
filter=Uncompressed FASTA|*.fa;*.fasta;*.fna;*.faa|All files|*.*
help=Choose homologous sequences, not whole genomes or reads. Uncompressed FASTA; at least 2 unique first-word IDs; no empty sequences or alignment gaps. Each sequence is limited to 15,000 residues by this pack. DNA/RNA IUPAC letters are allowed; U is retained. Use ASCII-only installation, input and results paths on Windows; spaces are supported.

[input:align-nucleotide:threads]
label=CPU threads
type=integer
required=true
default=2
min=1
max=64
help=Upper limit on parallel CPU workers. Choose 1 for reproducibility checks; more threads may change floating-point ordering. This is not a memory limit.

[input:align-nucleotide:perturb]
label=Perturbation seed
type=integer
required=true
default=0
min=0
max=2147483647
help=0 disables HMM perturbation. Positive values choose one reproducible perturbation replicate. The selected value is recorded in methods and provenance.

[input:align-nucleotide:permutation]
label=Guide-tree permutation
type=choice
required=true
default=none
choices=none:None|abc:ABC|acb:ACB|bca:BCA
help=Choose one guide-tree permutation. Multiple-replicate ensembles are not produced by this operation.

[output:align-nucleotide:aligned]
label=Aligned nucleotide FASTA
path=alignment.afa
final=true
nonempty=true

[step:align-nucleotide:align]
label=Align nucleotide sequences
kind=exec
tool=muscle
produces=aligned
arg.0=-align
arg.1={input:sequences}
arg.2=-output
arg.3={output:aligned}
arg.4=-nt
arg.5=-threads
arg.6={input:threads}
arg.7=-perturb
arg.8={input:perturb}
arg.9=-perm
arg.10={input:permutation}

