sha256=da6c2ab518b3022c05ef839ac6e4cb76d0bf0edf41862e578e7ab57cef2cad5a

[asset:workbench-checks]
path=workbench-checks.json
sha256=3f379a442dd83adf114bb0359a960784a1c598b9fabcab76faec5201283718a1

[asset:check-reference]
path=fixtures/reference.fa
sha256=3e7ecb8247f4424330aa77e5df87645457840546d279ef58bda8fb8f33d84d09

[asset:check-single]
path=fixtures/single.fastq
sha256=933b651ca62341e5af5ae75d7f014a9c51d5c57d4e884046d17f87a5facfc32b

[asset:check-read1]
path=fixtures/reads1.fastq
sha256=5e4dccb7df3e0ad171ae0afce3a604847568356d2ce58ce75e3279663035ce6b

[asset:check-read2]
path=fixtures/reads2.fastq
sha256=4e8af32622822ca2551686ffafacf28e58189e557308df56e2517ba3629a4d9c

[workflow:single-end]
name=Single-end DNA alignment
description=Index a private reference copy and align single Phred+33 reads with Bowtie 2. Use a compact 32-bit index for references below 4 billion bases. Produce unsorted SAM with read groups; no duplicate marking or variant calling is performed.
inputs=reads1,reference,sample,read-group,library,platform,preset,threads,seed
outputs=reference,index-1,index-2,index-3,index-4,index-rev-1,index-rev-2,sam
steps=copy-reference,index,align

[input:single-end:reads1]
label=Reads
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
help=Plain or gzip FASTQ with Phred+33 qualities. File paths must use ASCII characters and must not contain commas.

[input:single-end:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed reference FASTA|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed nucleotide FASTA. A private copy is indexed in this run; the original file is unchanged.

[input:single-end:sample]
label=Sample name
type=text
required=true
default=sample
constraint=identifier
help=SAM SM tag. Use the same sample identity across lanes from this sample.

[input:single-end:read-group]
label=Read-group ID
type=text
required=true
default=lane1
constraint=identifier
help=SAM RG ID. Use a distinct identifier for each sequencing lane that will be merged.

[input:single-end:library]
label=Library ID
type=text
required=true
default=library1
constraint=identifier
help=SAM LB tag; distinct preparations should have distinct library names.

[input:single-end:platform]
label=Sequencing platform
type=choice
required=true
default=ILLUMINA
choices=ILLUMINA:Illumina|DNBSEQ:DNBSEQ|IONTORRENT:Ion Torrent
help=SAM PL tag. Choose from the sequencing metadata.

[input:single-end:preset]
label=End-to-end search effort
type=choice
required=true
default=sensitive
choices=very-fast:Very fast|fast:Fast|sensitive:Sensitive|very-sensitive:Very sensitive
help=Bowtie 2 end-to-end presets. Higher sensitivity can require more compute. This is an unspliced DNA aligner.

[input:single-end:threads]
label=Threads
type=integer
required=true
default=2
min=1
max=64

[input:single-end:seed]
label=Random seed
type=integer
required=true
default=42
min=0
max=2147483647
help=Deterministic tie-breaking seed. Input records and names also affect the pseudo-random choices.

[output:single-end:reference]
label=Private reference copy
path=reference.fa
final=false
nonempty=true

[output:single-end:index-1]
label=Bowtie 2 index 1
path=reference-index.1.bt2
final=false
nonempty=true

[output:single-end:index-2]
label=Bowtie 2 index 2
path=reference-index.2.bt2
final=false
nonempty=true

[output:single-end:index-3]
label=Bowtie 2 index 3
path=reference-index.3.bt2
final=false
nonempty=true

[output:single-end:index-4]
label=Bowtie 2 index 4
path=reference-index.4.bt2
final=false
nonempty=true

[output:single-end:index-rev-1]
label=Bowtie 2 index rev.1
path=reference-index.rev.1.bt2
final=false
nonempty=true

[output:single-end:index-rev-2]
label=Bowtie 2 index rev.2
path=reference-index.rev.2.bt2
final=false
nonempty=true

[output:single-end:sam]
label=Read alignments (unsorted SAM)
path=alignment.sam
final=true
nonempty=true

[step:single-end:copy-reference]
label=Copy reference into this run
kind=copy
source={input:reference}
destination=reference

[step:single-end:index]
label=Build small Bowtie 2 index
kind=exec
tool=build-s
produces=index-1,index-2,index-3,index-4,index-rev-1,index-rev-2
arg.0=--wrapper
arg.1=basic-0
arg.2=--threads
arg.3={input:threads}
arg.4={output:reference}
arg.5={run}/reference-index

[step:single-end:align]
label=Align reads with Bowtie 2
kind=exec
tool=align-s
stdout=sam
arg.0=--wrapper
arg.1=basic-0
arg.2=--end-to-end
arg.3=--{input:preset}
arg.4=--phred33
arg.5=--seed
arg.6={input:seed}
arg.7=--reorder
arg.8=-p
arg.9={input:threads}
arg.10=--rg-id
arg.11={input:read-group}
arg.12=--rg
arg.13=SM:{input:sample}
arg.14=--rg
arg.15=LB:{input:library}
arg.16=--rg
arg.17=PL:{input:platform}
arg.18=-x
arg.19={run}/reference-index
arg.20=-U
arg.21={input:reads1}

[workflow:paired-end]
name=Paired-end DNA alignment
description=Index a private reference copy and align validated paired Phred+33 reads with Bowtie 2. Use a compact 32-bit index for references below 4 billion bases. Produce unsorted SAM with read groups; no duplicate marking or variant calling is performed.
inputs=reads1,reads2,reference,sample,read-group,library,platform,preset,threads,seed,orientation,min-insert,max-insert
outputs=reference,index-1,index-2,index-3,index-4,index-rev-1,index-rev-2,sam,pair-check
steps=check-pairs,copy-reference,index,align

[input:paired-end:reads1]
label=Read 1
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
help=Plain or gzip FASTQ with Phred+33 qualities. File paths must use ASCII characters and must not contain commas.

[input:paired-end:reads2]
label=Read 2
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
help=Matching mate file in the same record order; validated before indexing.
different-from=reads1

[input:paired-end:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed reference FASTA|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed nucleotide FASTA. A private copy is indexed in this run; the original file is unchanged.

[input:paired-end:sample]
label=Sample name
type=text
required=true
default=sample
constraint=identifier
help=SAM SM tag. Use the same sample identity across lanes from this sample.

[input:paired-end:read-group]
label=Read-group ID
type=text
required=true
default=lane1
constraint=identifier
help=SAM RG ID. Use a distinct identifier for each sequencing lane that will be merged.

[input:paired-end:library]
label=Library ID
type=text
required=true
default=library1
constraint=identifier
help=SAM LB tag; distinct preparations should have distinct library names.

[input:paired-end:platform]
label=Sequencing platform
type=choice
required=true
default=ILLUMINA
choices=ILLUMINA:Illumina|DNBSEQ:DNBSEQ|IONTORRENT:Ion Torrent
help=SAM PL tag. Choose from the sequencing metadata.

[input:paired-end:preset]
label=End-to-end search effort
type=choice
required=true
default=sensitive
choices=very-fast:Very fast|fast:Fast|sensitive:Sensitive|very-sensitive:Very sensitive
help=Bowtie 2 end-to-end presets. Higher sensitivity can require more compute. This is an unspliced DNA aligner.

[input:paired-end:threads]
label=Threads
type=integer
required=true
default=2
min=1
max=64

[input:paired-end:seed]
label=Random seed
type=integer
required=true
default=42
min=0
max=2147483647
help=Deterministic tie-breaking seed. Input records and names also affect the pseudo-random choices.

[input:paired-end:orientation]
label=Expected mate orientation
type=choice
required=true
default=fr
choices=fr:Forward-reverse|rf:Reverse-forward|ff:Forward-forward

[input:paired-end:min-insert]
label=Minimum fragment length
type=integer
required=true
default=0
min=0
max=1000000

[input:paired-end:max-insert]
label=Maximum fragment length
type=integer
required=true
default=500
min=1
max=1000000
help=Must be at least the minimum. Bowtie 2 also permits discordant and single-mate fallback alignments when concordant alignment fails.

[output:paired-end:reference]
label=Private reference copy
path=reference.fa
final=false
nonempty=true

[output:paired-end:index-1]
label=Bowtie 2 index 1
path=reference-index.1.bt2
final=false
nonempty=true

[output:paired-end:index-2]
label=Bowtie 2 index 2
path=reference-index.2.bt2
final=false
nonempty=true

[output:paired-end:index-3]
label=Bowtie 2 index 3
path=reference-index.3.bt2
final=false
nonempty=true

[output:paired-end:index-4]
label=Bowtie 2 index 4
path=reference-index.4.bt2
final=false
nonempty=true

[output:paired-end:index-rev-1]
label=Bowtie 2 index rev.1
path=reference-index.rev.1.bt2
final=false
nonempty=true

[output:paired-end:index-rev-2]
label=Bowtie 2 index rev.2
path=reference-index.rev.2.bt2
final=false
nonempty=true

[output:paired-end:sam]
label=Read alignments (unsorted SAM)
path=alignment.sam
final=true
nonempty=true

[output:paired-end:pair-check]
label=Read-pair validation
path=read-pairs.json
final=true
nonempty=true

[step:paired-end:check-pairs]
label=Validate paired FASTQ records
kind=exec
tool=paircheck
stdout=pair-check
arg.0=--reads1
arg.1={input:reads1}
arg.2=--reads2
arg.3={input:reads2}

[step:paired-end:copy-reference]
label=Copy reference into this run
kind=copy
source={input:reference}
destination=reference

[step:paired-end:index]
label=Build small Bowtie 2 index
kind=exec
tool=build-s
produces=index-1,index-2,index-3,index-4,index-rev-1,index-rev-2
arg.0=--wrapper
arg.1=basic-0
arg.2=--threads
arg.3={input:threads}
arg.4={output:reference}
arg.5={run}/reference-index

[step:paired-end:align]
label=Align reads with Bowtie 2
kind=exec
tool=align-s
stdout=sam
arg.0=--wrapper
arg.1=basic-0
arg.2=--end-to-end
arg.3=--{input:preset}
arg.4=--phred33
arg.5=--seed
arg.6={input:seed}
arg.7=--reorder
arg.8=-p
arg.9={input:threads}
arg.10=--rg-id
arg.11={input:read-group}
arg.12=--rg
arg.13=SM:{input:sample}
arg.14=--rg
arg.15=LB:{input:library}
arg.16=--rg
arg.17=PL:{input:platform}
arg.18=-x
arg.19={run}/reference-index
arg.20=-1
arg.21={input:reads1}
arg.22=-2
arg.23={input:reads2}
arg.24=-I
arg.25={input:min-insert}
arg.26=-X
arg.27={input:max-insert}
arg.28=--{input:orientation}

