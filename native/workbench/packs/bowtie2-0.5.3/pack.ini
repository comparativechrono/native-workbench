id=bowtie2
version=0.5.3
name=Bowtie 2 DNA alignment
platform=windows-x86_64
description=Reference indexing and short-read DNA alignment with explicit small/large index workflows.
color=#4D78C7

[tool:align-s]
path=bin/bowtie2-align-s.exe
version=2.5.5
sha256=d9b13685cf659903071be0531349e124865d0e48b7be314e69b5bbacfad6ffb1

[tool:align-l]
path=bin/bowtie2-align-l.exe
version=2.5.5
sha256=4a06c29533a2c3ee18687d2034a0406b12ecf1d34630c29c3816958d18c08d6e

[tool:build-s]
path=bin/bowtie2-build-s.exe
version=2.5.5
sha256=af2d87fb75f9b7ac70f398ed359e9b1caca044f2c70cfc9801dc4d7910b331fb

[tool:build-l]
path=bin/bowtie2-build-l.exe
version=2.5.5
sha256=f72393d73da773322f1c965710a7b8e47a95649546f4f519bcab6d0e2516b762

