[workflow:cutadapt-paired]
name=Cutadapt: paired adapters + quality
description=Explicit Phred+33 trimming with JSON metrics and rejected short reads. Paired reads are retained or rejected together.
inputs=reads1,reads2,threads,adapter1,adapter2,trim-overlap,trim-error,trim-quality,min-length
outputs=trimmed1,trimmed2,rejected1,trim-json,trim-report,rejected2,pair-check
steps=check-pairs,trim

[input:cutadapt-paired:reads1]
label=Read 1 (forward)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[input:cutadapt-paired:reads2]
label=Read 2 (reverse)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
different-from=reads1
help=Use the matching mate file, in the same read order. Plain or gzip FASTQ accepted.

[input:cutadapt-paired:threads]
label=Trimming / alignment workers
type=integer
required=true
default=2
min=1
max=64
help=Workers used by Cutadapt, fastp and the aligner. SAMtools and BCFtools remain single-threaded in this build.

[input:cutadapt-paired:adapter1]
label=Read 1 3' adapter sequence
type=text
required=true
constraint=dna
help=Enter the sequence appropriate to the library using IUPAC DNA letters. No adapter is assumed.

[input:cutadapt-paired:adapter2]
label=Read 2 3' adapter sequence
type=text
required=true
constraint=dna
help=Enter the mate-specific adapter, not the reverse complement of the read.

[input:cutadapt-paired:trim-overlap]
label=Minimum adapter overlap
type=integer
required=true
default=3
min=1
max=1000

[input:cutadapt-paired:trim-error]
label=Maximum adapter error rate
type=choice
required=true
default=0.1
choices=0.0:0%|0.05:5%|0.1:10%|0.15:15%|0.2:20%

[input:cutadapt-paired:trim-quality]
label=3' quality trimming cutoff
type=integer
required=true
default=20
min=0
max=93
help=Phred+33 input; zero disables quality trimming. Cutadapt uses its quality-trimming algorithm, not a sliding window.

[input:cutadapt-paired:min-length]
label=Minimum retained read length
type=integer
required=true
default=35
min=1
max=100000
help=For paired data, both mates must pass; a pair is rejected if either mate is too short.

[output:cutadapt-paired:trimmed1]
label=Trimmed read 1
path=reads1.trimmed.fastq.gz
final=true
nonempty=true

[output:cutadapt-paired:trimmed2]
label=Trimmed read 2
path=reads2.trimmed.fastq.gz
final=true
nonempty=true

[output:cutadapt-paired:rejected1]
label=Rejected short read 1
path=reads1.rejected.fastq.gz
final=true
nonempty=true

[output:cutadapt-paired:trim-json]
label=Trimming metrics (JSON)
path=trimming.json
final=true
nonempty=true

[output:cutadapt-paired:trim-report]
label=Trimming report
path=trimming.txt
final=true
nonempty=true

[output:cutadapt-paired:rejected2]
label=Rejected short read 2
path=reads2.rejected.fastq.gz
final=true
nonempty=true

[output:cutadapt-paired:pair-check]
label=Input pair validation
path=read-pairs.json
final=true
nonempty=true

[step:cutadapt-paired:check-pairs]
label=Validate paired FASTQ records
kind=exec
tool=paircheck
stdout=pair-check
arg.0=--reads1
arg.1={input:reads1}
arg.2=--reads2
arg.3={input:reads2}

[step:cutadapt-paired:trim]
label=Trim adapters and low-quality tails
kind=exec
tool=python
stdout=trim-report
produces=trimmed1,rejected1,trim-json,trimmed2,rejected2
arg.0=-I
arg.1=-B
arg.2=-m
arg.3=cutadapt
arg.4=--cores
arg.5={input:threads}
arg.6=--quality-base
arg.7=33
arg.8=-q
arg.9={input:trim-quality}
arg.10=--minimum-length
arg.11={input:min-length}
arg.12=--json
arg.13={output:trim-json}
arg.14=-o
arg.15={output:trimmed1}
arg.16=--too-short-output
arg.17={output:rejected1}
arg.18=-a
arg.19={input:adapter1}
arg.20=--overlap
arg.21={input:trim-overlap}
arg.22=--error-rate
arg.23={input:trim-error}
arg.24=--pair-filter
arg.25=any
arg.26=-Q
arg.27={input:trim-quality}
arg.28=-p
arg.29={output:trimmed2}
arg.30=--too-short-paired-output
arg.31={output:rejected2}
arg.32=-A
arg.33={input:adapter2}
arg.34={input:reads1}
arg.35={input:reads2}

