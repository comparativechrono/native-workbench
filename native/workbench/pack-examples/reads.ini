[pack]
format=2
id=reads
version=0.4.0
name=Read quality
platform=windows-x86_64
description=Inspect and transform FASTQ reads.
color=#2B8A83

[tool:bwfastq]
path=bin/bwfastq.exe
version=0.1.0-experiment
sha256=9ef643f49c96d9e221eae3925a7aad36f7081a16f218ee1e7346cce5f8c1fb6f

[tool:seqtk]
path=bin/seqtk.exe
version=1.4-r122
sha256=c5df3fadda2e622a2e358de78a0d34513b392b68bd50208ee3dccb4877c72c2e

[tool:paircheck]
path=bin/paircheck.exe
version=1.0.1
sha256=4f2dda7e26b5c115a7edee936a8a059eb55ece244931b2799a62cebfcd44ecd4

[workflow:statistics]
name=FASTQ statistics
description=Count reads, bases, GC and quality totals in an uncompressed FASTQ.
inputs=reads
outputs=statistics
steps=statistics

[input:statistics:reads]
label=Reads
type=file
required=true
filter=Uncompressed FASTQ|*.fastq;*.fq

[output:statistics:statistics]
label=FASTQ statistics
path=reads.stats.json
final=true
nonempty=true

[step:statistics:statistics]
label=Calculate FASTQ statistics
kind=exec
tool=bwfastq
stdout=statistics
arg.0=stats
arg.1=--input
arg.2={input:reads}
arg.3=--output
arg.4=-
arg.5=--threads
arg.6=1

[workflow:quality-profile]
name=Quality profile
description=Summarize base composition and quality by read position. Supports gzip FASTQ.
inputs=reads
outputs=quality
steps=quality

[input:quality-profile:reads]
label=Reads
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[output:quality-profile:quality]
label=Quality profile
path=quality-profile.txt
final=true
nonempty=true

[step:quality-profile:quality]
label=Profile read quality
kind=exec
tool=seqtk
stdout=quality
arg.0=fqchk
arg.1={input:reads}

[workflow:reverse-complement]
name=Reverse complement
description=Reverse-complement sequence and reverse the matching quality strings.
inputs=reads
outputs=reversed
steps=reverse

[input:reverse-complement:reads]
label=Reads
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[output:reverse-complement:reversed]
label=Reverse-complemented reads
path=reverse-complement.fastq
final=true
nonempty=true

[step:reverse-complement:reverse]
label=Reverse-complement reads
kind=exec
tool=seqtk
stdout=reversed
arg.0=seq
arg.1=-r
arg.2={input:reads}

[workflow:check-pairs]
name=Validate read pairs
description=Check FASTQ structure, qualities, read counts and mate names before alignment. Supports plain or gzip FASTQ.
inputs=reads1,reads2
outputs=pair-check
steps=check-pairs

[input:check-pairs:reads1]
label=Read 1 (forward)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[input:check-pairs:reads2]
label=Read 2 (reverse)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
different-from=reads1
help=Use the matching mate file, in the same read order. Plain or gzip FASTQ accepted.

[output:check-pairs:pair-check]
label=Read-pair validation
path=read-pairs.json
final=true
nonempty=true

[step:check-pairs:check-pairs]
label=Validate paired FASTQ records
kind=exec
tool=paircheck
stdout=pair-check
arg.0=--reads1
arg.1={input:reads1}
arg.2=--reads2
arg.3={input:reads2}
