tool=seqtk
stdout=trim-qc1
arg.0=fqchk
arg.1={output:trimmed1}

[step:fastp-minimap2-bcftools:trim-qc2]
label=Profile trimmed read 2
kind=exec
tool=seqtk
stdout=trim-qc2
arg.0=fqchk
arg.1={output:trimmed2}

