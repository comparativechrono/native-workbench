[input:cutadapt-minimap2-freebayes-quality-only:reads1]
label=Read 1 (forward)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[input:cutadapt-minimap2-freebayes-quality-only:reads2]
label=Read 2 (reverse)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
different-from=reads1
help=Use the matching mate file, in the same read order. Plain or gzip FASTQ accepted.

[input:cutadapt-minimap2-freebayes-quality-only:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[input:cutadapt-minimap2-freebayes-quality-only:sample]
label=Sample name (SM)
type=text
required=true
default=sample
constraint=identifier

[input:cutadapt-minimap2-freebayes-quality-only:read-group]
label=Read group ID
type=text
required=true
default=group1
constraint=identifier
help=Use a unique read-group ID for each lane when merging lanes.

[input:cutadapt-minimap2-freebayes-quality-only:library]
label=Library ID (LB)
type=text
required=true
default=library1
constraint=identifier
help=Lanes from the same physical library should share LB; independent libraries should not.

[input:cutadapt-minimap2-freebayes-quality-only:platform-unit]
label=Platform unit (PU)
type=text
required=true
default=unit1
constraint=identifier
help=For Illumina, a flowcell/lane identifier is customary.

[input:cutadapt-minimap2-freebayes-quality-only:platform]
label=Sequencing platform (PL)
type=choice
required=true
default=ILLUMINA
choices=ILLUMINA:Illumina|DNBSEQ:DNBSEQ (MGI/BGI)

[input:cutadapt-minimap2-freebayes-quality-only:threads]
label=Trimming / alignment workers
type=integer
required=true
default=2
min=1
max=64
help=Workers used by Cutadapt, fastp and the aligner. SAMtools and BCFtools remain single-threaded in this build.

[input:cutadapt-minimap2-freebayes-quality-only:sort-memory]
label=SAMtools sort memory (MiB)
type=integer
required=true
default=512
min=64
max=32768
help=Memory for each single-threaded sort. Alignment needs additional RAM depending on reference size.

[input:cutadapt-minimap2-freebayes-quality-only:trim-quality]
label=3' quality trimming cutoff
type=integer
required=true
default=20
min=0
max=93
help=Phred+33 input; zero disables quality trimming. Cutadapt uses its quality-trimming algorithm, not a sliding window.

[input:cutadapt-minimap2-freebayes-quality-only:min-length]
label=Minimum retained read length
type=integer
required=true
default=35
min=1
max=100000
help=For paired data, both mates must pass; a pair is rejected if either mate is too short.

[input:cutadapt-minimap2-freebayes-quality-only:ploidy]
label=Assumed ploidy
type=choice
required=true
default=2
choices=1:Haploid (1)|2:Diploid (2)
help=Uniform ploidy across all contigs. Use region-aware downstream workflows for mixed-ploidy chromosomes; this field does not infer sex or karyotype.

[input:cutadapt-minimap2-freebayes-quality-only:min-mapq]
label=Minimum mapping quality
type=integer
required=true
default=20
min=0
max=60

[input:cutadapt-minimap2-freebayes-quality-only:min-baseq]
label=Minimum base quality
type=integer
required=true
default=20
min=0
max=93

[input:cutadapt-minimap2-freebayes-quality-only:min-qual]
label=Variant quality threshold
type=integer
required=true
default=20
min=0
max=100000

[input:cutadapt-minimap2-freebayes-quality-only:min-depth]
label=Sample depth threshold
type=integer
required=true
default=5
min=0
max=1000000
help=Calls below the quality or sample-depth threshold are labelled LowQual, not deleted.

[input:cutadapt-minimap2-freebayes-quality-only:min-alt-count]
label=Minimum alternate observations
type=integer
required=true
default=2
min=1
max=1000000

[input:cutadapt-minimap2-freebayes-quality-only:min-alt-fraction]
label=Minimum alternate allele fraction
type=choice
required=true
default=0.2
choices=0.01:1%|0.05:5%|0.1:10%|0.2:20%|0.3:30%
help=FreeBayes candidate threshold; choose for the assay and ploidy. This is a germline workflow.

