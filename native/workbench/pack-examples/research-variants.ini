[workflow:cutadapt-minimap2-freebayes-quality-only]
name=Cutadapt + minimap2 + FreeBayes (quality only)
description=Paired short-read germline SNP/indel workflow. Quality trimming only; use for adapter-free or previously adapter-trimmed libraries. Duplicates are marked and excluded from calling. Uniform ploidy; separate all-call and PASS VCFs. Reference indexes are built privately.
