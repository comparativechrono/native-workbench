outputs=pair-check,reference,reference-index,raw-qc1,raw-qc2,trimmed1,trimmed2,rejected1,trim-json,trim-report,rejected2,trim-pair-check,trim-qc1,trim-qc2,names,fixed,coordinates,bam,bam-index,duplicate-stats,flagstat,alignment-stats,coverage,calls,normalized,variants,variants-index,pass-variants,pass-index,variant-stats,pass-stats
