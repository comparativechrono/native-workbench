sink-arg.2=-m
sink-arg.3={input:sort-memory}M
sink-arg.4=-T
sink-arg.5={run}/name-sort
sink-arg.6=-o
sink-arg.7={output:names}
sink-arg.8=-

[step:fastp-minimap2-bcftools:fixmate]
label=Fill mate coordinates and scores
kind=exec
tool=samtools
produces=fixed
arg.0=fixmate
arg.1=-m
arg.2={output:names}
arg.3={output:fixed}

[step:fastp-minimap2-bcftools:coordinate-sort]
label=Sort by genomic position
kind=exec
tool=samtools
produces=coordinates
arg.0=sort
arg.1=-m
arg.2={input:sort-memory}M
arg.3=-T
arg.4={run}/coordinate-sort
arg.5=-o
arg.6={output:coordinates}
arg.7={output:fixed}

