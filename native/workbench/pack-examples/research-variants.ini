label=Sequencing platform (PL)
type=choice
required=true
default=ILLUMINA
choices=ILLUMINA:Illumina|DNBSEQ:DNBSEQ (MGI/BGI)

[input:cutadapt-bwa-freebayes-quality-only:threads]
label=Trimming / alignment workers
type=integer
required=true
