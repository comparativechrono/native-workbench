kind=pipe
tool=minimap2
produces=names
arg.0=-a
arg.1=-x
arg.2=sr
arg.3=-t
arg.4={input:threads}
arg.5=-R
arg.6=@RG\tID:{input:read-group}\tSM:{input:sample}\tLB:{input:library}\tPL:{input:platform}\tPU:{input:platform-unit}
arg.7={output:reference}
arg.8={output:trimmed1}
arg.9={output:trimmed2}
