arg.0=index
arg.1=--csi
arg.2={output:pass-variants}

[step:cutadapt-bwa-bcftools-quality-only:pass-stats]
label=Summarize PASS calls
kind=exec
tool=bcftools
stdout=pass-stats
arg.0=stats
arg.1={output:pass-variants}

[workflow:cutadapt-bwa-freebayes-quality-only]
name=Cutadapt + BWA-MEM + FreeBayes (quality only)
description=Paired short-read germline SNP/indel workflow. Quality trimming only; use for adapter-free or previously adapter-trimmed libraries. Duplicates are marked and excluded from calling. Uniform ploidy; separate all-call and PASS VCFs. Reference indexes are built privately.
inputs=reads1,reads2,reference,sample,read-group,library,platform-unit,platform,threads,sort-memory,trim-quality,min-length,ploidy,min-mapq,min-baseq,min-qual,min-depth,min-alt-count,min-alt-fraction
outputs=pair-check,reference,reference-index,raw-qc1,raw-qc2,trimmed1,trimmed2,rejected1,trim-json,trim-report,rejected2,trim-pair-check,trim-qc1,trim-qc2,bwa-amb,bwa-ann,bwa-bwt,bwa-pac,bwa-sa,names,fixed,coordinates,bam,bam-index,duplicate-stats,flagstat,alignment-stats,coverage,calls,normalized,variants,variants-index,pass-variants,pass-index,variant-stats,pass-stats
steps=check-pairs,copy-reference,index-reference,raw-qc1,raw-qc2,trim,trim-pairs,trim-qc1,trim-qc2,bwa-index,align,fixmate,coordinate-sort,mark-duplicates,index-bam,flagstat,alignment-stats,coverage,call,normalize,filter,index-variants,variant-stats,pass-only,pass-index,pass-stats

[input:cutadapt-bwa-freebayes-quality-only:reads1]
label=Read 1 (forward)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[input:cutadapt-bwa-freebayes-quality-only:reads2]
label=Read 2 (reverse)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
different-from=reads1
help=Use the matching mate file, in the same read order. Plain or gzip FASTQ accepted.

[input:cutadapt-bwa-freebayes-quality-only:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[input:cutadapt-bwa-freebayes-quality-only:sample]
label=Sample name (SM)
type=text
required=true
default=sample
constraint=identifier

[input:cutadapt-bwa-freebayes-quality-only:read-group]
label=Read group ID
type=text
required=true
default=group1
constraint=identifier
help=Use a unique read-group ID for each lane when merging lanes.

[input:cutadapt-bwa-freebayes-quality-only:library]
label=Library ID (LB)
type=text
required=true
default=library1
constraint=identifier
help=Lanes from the same physical library should share LB; independent libraries should not.

