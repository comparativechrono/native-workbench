outputs=pair-check,reference,reference-index,raw-qc1,raw-qc2,trim-pair-check,trim-qc1,trim-qc2,names,fixed,coordinates,bam,bam-index,duplicate-stats,flagstat,alignment-stats,coverage,pileup,calls,normalized,variants,variants-index,pass-variants,pass-index,variant-stats,pass-stats,trimmed1,trimmed2,unpaired1,unpaired2,failed-reads,trim-json,trim-html,plotly-js
steps=check-pairs,copy-reference,index-reference,raw-qc1,raw-qc2,report-assets,trim,trim-pairs,trim-qc1,trim-qc2,align,fixmate,coordinate-sort,mark-duplicates,index-bam,flagstat,alignment-stats,coverage,pileup,call,normalize,filter,index-variants,variant-stats,pass-only,pass-index,pass-stats

