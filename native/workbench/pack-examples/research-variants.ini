[workflow:cutadapt-bwa-freebayes]
name=Cutadapt + BWA-MEM + FreeBayes
description=Paired short-read germline SNP/indel workflow. Adapter sequences must match your library. Duplicates are marked and excluded from calling. Uniform ploidy; separate all-call and PASS VCFs. Reference indexes are built privately.
inputs=reads1,reads2,reference,sample,read-group,library,platform-unit,platform,threads,sort-memory,adapter1,adapter2,trim-overlap,trim-error,trim-quality,min-length,ploidy,min-mapq,min-baseq,min-qual,min-depth,min-alt-count,min-alt-fraction
outputs=pair-check,reference,reference-index,raw-qc1,raw-qc2,trimmed1,trimmed2,rejected1,trim-json,trim-report,rejected2,trim-pair-check,trim-qc1,trim-qc2,bwa-amb,bwa-ann,bwa-bwt,bwa-pac,bwa-sa,names,fixed,coordinates,bam,bam-index,duplicate-stats,flagstat,alignment-stats,coverage,calls,normalized,variants,variants-index,pass-variants,pass-index,variant-stats,pass-stats
steps=check-pairs,copy-reference,index-reference,raw-qc1,raw-qc2,trim,trim-pairs,trim-qc1,trim-qc2,bwa-index,align,fixmate,coordinate-sort,mark-duplicates,index-bam,flagstat,alignment-stats,coverage,call,normalize,filter,index-variants,variant-stats,pass-only,pass-index,pass-stats

[input:cutadapt-bwa-freebayes:reads1]
label=Read 1 (forward)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[input:cutadapt-bwa-freebayes:reads2]
label=Read 2 (reverse)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
different-from=reads1
help=Use the matching mate file, in the same read order. Plain or gzip FASTQ accepted.

[input:cutadapt-bwa-freebayes:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[input:cutadapt-bwa-freebayes:sample]
label=Sample name (SM)
type=text
required=true
default=sample
constraint=identifier

[input:cutadapt-bwa-freebayes:read-group]
label=Read group ID
type=text
required=true
default=group1
constraint=identifier
help=Use a unique read-group ID for each lane when merging lanes.

[input:cutadapt-bwa-freebayes:library]
label=Library ID (LB)
type=text
required=true
default=library1
constraint=identifier
help=Lanes from the same physical library should share LB; independent libraries should not.

[input:cutadapt-bwa-freebayes:platform-unit]
label=Platform unit (PU)
type=text
required=true
default=unit1
constraint=identifier
help=For Illumina, a flowcell/lane identifier is customary.

[input:cutadapt-bwa-freebayes:platform]
label=Sequencing platform (PL)
type=choice
required=true
default=ILLUMINA
choices=ILLUMINA:Illumina|DNBSEQ:DNBSEQ (MGI/BGI)

[input:cutadapt-bwa-freebayes:threads]
label=Trimming / alignment workers
type=integer
required=true
default=2
min=1
max=64
help=Workers used by Cutadapt, fastp and the aligner. SAMtools and BCFtools remain single-threaded in this build.

[input:cutadapt-bwa-freebayes:sort-memory]
label=SAMtools sort memory (MiB)
type=integer
required=true
default=512
min=64
max=32768
help=Memory for each single-threaded sort. Alignment needs additional RAM depending on reference size.

[input:cutadapt-bwa-freebayes:adapter1]
label=Read 1 3' adapter sequence
type=text
required=true
constraint=dna
help=Enter the sequence appropriate to the library using IUPAC DNA letters. No adapter is assumed.

[input:cutadapt-bwa-freebayes:adapter2]
label=Read 2 3' adapter sequence
type=text
required=true
constraint=dna
help=Enter the mate-specific adapter, not the reverse complement of the read.

[input:cutadapt-bwa-freebayes:trim-overlap]
label=Minimum adapter overlap
type=integer
required=true
default=3
min=1
max=1000

[input:cutadapt-bwa-freebayes:trim-error]
label=Maximum adapter error rate
type=choice
required=true
default=0.1
choices=0.0:0%|0.05:5%|0.1:10%|0.15:15%|0.2:20%

[input:cutadapt-bwa-freebayes:trim-quality]
label=3' quality trimming cutoff
type=integer
required=true
default=20
min=0
max=93
help=Phred+33 input; zero disables quality trimming. Cutadapt uses its quality-trimming algorithm, not a sliding window.

[input:cutadapt-bwa-freebayes:min-length]
label=Minimum retained read length
type=integer
required=true
default=35
min=1
max=100000
help=For paired data, both mates must pass; a pair is rejected if either mate is too short.

[input:cutadapt-bwa-freebayes:ploidy]
label=Assumed ploidy
type=choice
required=true
default=2
choices=1:Haploid (1)|2:Diploid (2)
help=Uniform ploidy across all contigs. Use region-aware downstream workflows for mixed-ploidy chromosomes; this field does not infer sex or karyotype.

[input:cutadapt-bwa-freebayes:min-mapq]
label=Minimum mapping quality
type=integer
required=true
default=20
min=0
max=60

[input:cutadapt-bwa-freebayes:min-baseq]
label=Minimum base quality
type=integer
required=true
default=20
min=0
max=93

[input:cutadapt-bwa-freebayes:min-qual]
label=Variant quality threshold
type=integer
required=true
default=20
min=0
max=100000

[input:cutadapt-bwa-freebayes:min-depth]
label=Sample depth threshold
type=integer
required=true
default=5
min=0
max=1000000
help=Calls below the quality or sample-depth threshold are labelled LowQual, not deleted.

[input:cutadapt-bwa-freebayes:min-alt-count]
label=Minimum alternate observations
type=integer
required=true
default=2
min=1
max=1000000

[input:cutadapt-bwa-freebayes:min-alt-fraction]
label=Minimum alternate allele fraction
type=choice
required=true
default=0.2
choices=0.01:1%|0.05:5%|0.1:10%|0.2:20%|0.3:30%
help=FreeBayes candidate threshold; choose for the assay and ploidy. This is a germline workflow.

