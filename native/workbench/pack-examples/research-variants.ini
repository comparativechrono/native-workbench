[step:cutadapt-bwa-bcftools-quality-only:check-pairs]
label=Validate paired FASTQ records
kind=exec
tool=paircheck
stdout=pair-check
arg.0=--reads1
arg.1={input:reads1}
arg.2=--reads2
arg.3={input:reads2}

[step:cutadapt-bwa-bcftools-quality-only:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:cutadapt-bwa-bcftools-quality-only:index-reference]
label=Index reference
kind=exec
tool=samtools
produces=reference-index
arg.0=faidx
arg.1={output:reference}

[step:cutadapt-bwa-bcftools-quality-only:raw-qc1]
label=Profile raw read 1
kind=exec
tool=seqtk
stdout=raw-qc1
arg.0=fqchk
arg.1={input:reads1}

[step:cutadapt-bwa-bcftools-quality-only:raw-qc2]
label=Profile raw read 2
kind=exec
tool=seqtk
stdout=raw-qc2
arg.0=fqchk
arg.1={input:reads2}

[step:cutadapt-bwa-bcftools-quality-only:trim]
label=Trim low-quality tails
kind=exec
tool=python
stdout=trim-report
produces=trimmed1,rejected1,trim-json,trimmed2,rejected2
arg.0=-I
arg.1=-B
arg.2=-m
arg.3=cutadapt
arg.4=--cores
arg.5={input:threads}
arg.6=--quality-base
arg.7=33
arg.8=-q
arg.9={input:trim-quality}
arg.10=--minimum-length
arg.11={input:min-length}
arg.12=--json
arg.13={output:trim-json}
arg.14=-o
arg.15={output:trimmed1}
arg.16=--too-short-output
arg.17={output:rejected1}
arg.18=--pair-filter
arg.19=any
arg.20=-Q
arg.21={input:trim-quality}
arg.22=-p
arg.23={output:trimmed2}
arg.24=--too-short-paired-output
arg.25={output:rejected2}
arg.26={input:reads1}
arg.27={input:reads2}

[step:cutadapt-bwa-bcftools-quality-only:trim-pairs]
label=Validate paired FASTQ records
kind=exec
tool=paircheck
stdout=trim-pair-check
arg.0=--reads1
arg.1={output:trimmed1}
arg.2=--reads2
arg.3={output:trimmed2}

[step:cutadapt-bwa-bcftools-quality-only:trim-qc1]
label=Profile trimmed read 1
kind=exec
tool=seqtk
stdout=trim-qc1
arg.0=fqchk
arg.1={output:trimmed1}

[step:cutadapt-bwa-bcftools-quality-only:trim-qc2]
label=Profile trimmed read 2
kind=exec
tool=seqtk
stdout=trim-qc2
arg.0=fqchk
arg.1={output:trimmed2}

[step:cutadapt-bwa-bcftools-quality-only:bwa-index]
label=Build BWA reference index
kind=exec
tool=bwa
produces=bwa-amb,bwa-ann,bwa-bwt,bwa-pac,bwa-sa
arg.0=index
arg.1=-p
arg.2={run}/bwa-reference
arg.3={output:reference}

[step:cutadapt-bwa-bcftools-quality-only:align]
label=Align and name-sort read pairs
kind=pipe
tool=bwa
produces=names
arg.0=mem
arg.1=-t
arg.2={input:threads}
arg.3=-R
arg.4=@RG\tID:{input:read-group}\tSM:{input:sample}\tLB:{input:library}\tPL:{input:platform}\tPU:{input:platform-unit}
arg.5={run}/bwa-reference
arg.6={output:trimmed1}
arg.7={output:trimmed2}
sink-tool=samtools
sink-arg.0=sort
sink-arg.1=-n
sink-arg.2=-m
sink-arg.3={input:sort-memory}M
sink-arg.4=-T
sink-arg.5={run}/name-sort
sink-arg.6=-o
sink-arg.7={output:names}
sink-arg.8=-

[step:cutadapt-bwa-bcftools-quality-only:fixmate]
label=Fill mate coordinates and scores
kind=exec
tool=samtools
produces=fixed
arg.0=fixmate
arg.1=-m
arg.2={output:names}
arg.3={output:fixed}

[step:cutadapt-bwa-bcftools-quality-only:coordinate-sort]
label=Sort by genomic position
kind=exec
tool=samtools
produces=coordinates
arg.0=sort
arg.1=-m
arg.2={input:sort-memory}M
arg.3=-T
arg.4={run}/coordinate-sort
arg.5=-o
arg.6={output:coordinates}
arg.7={output:fixed}

[step:cutadapt-bwa-bcftools-quality-only:mark-duplicates]
label=Mark duplicate fragments
kind=exec
tool=samtools
produces=duplicate-stats,bam
arg.0=markdup
arg.1=-s
arg.2=-T
arg.3={run}/markdup
arg.4=-f
arg.5={output:duplicate-stats}
arg.6={output:coordinates}
arg.7={output:bam}

[step:cutadapt-bwa-bcftools-quality-only:index-bam]
label=Index the BAM
kind=exec
tool=samtools
produces=bam-index
arg.0=index
arg.1=-c
arg.2={output:bam}

[step:cutadapt-bwa-bcftools-quality-only:flagstat]
label=Summarize alignment flags
kind=exec
tool=samtools
stdout=flagstat
arg.0=flagstat
arg.1={output:bam}

[step:cutadapt-bwa-bcftools-quality-only:alignment-stats]
label=Summarize alignment statistics
kind=exec
tool=samtools
stdout=alignment-stats
arg.0=stats
arg.1={output:bam}

[step:cutadapt-bwa-bcftools-quality-only:coverage]
label=Summarize per-contig coverage
kind=exec
tool=samtools
stdout=coverage
arg.0=coverage
arg.1={output:bam}

[step:cutadapt-bwa-bcftools-quality-only:pileup]
label=Calculate genotype likelihoods
kind=exec
tool=bcftools
produces=pileup
arg.0=mpileup
arg.1=-f
arg.2={output:reference}
arg.3=-a
arg.4=FORMAT/DP,FORMAT/AD
arg.5=-q
arg.6={input:min-mapq}
arg.7=-Q
arg.8={input:min-baseq}
arg.9=-d
arg.10={input:max-depth}
arg.11=-Ob
arg.12=-o
arg.13={output:pileup}
arg.14={output:bam}

[step:cutadapt-bwa-bcftools-quality-only:call]
label=Call SNPs and short indels
kind=exec
tool=bcftools
produces=calls
arg.0=call
arg.1=-m
arg.2=-v
arg.3=--ploidy
arg.4={input:ploidy}
arg.5=-Ob
arg.6=-o
arg.7={output:calls}
arg.8={output:pileup}

[step:cutadapt-bwa-bcftools-quality-only:normalize]
label=Normalize alleles against the reference
kind=exec
tool=bcftools
produces=normalized
arg.0=norm
arg.1=-f
arg.2={output:reference}
arg.3=-m
arg.4=-any
arg.5=-Ob
arg.6=-o
arg.7={output:normalized}
arg.8={output:calls}

[step:cutadapt-bwa-bcftools-quality-only:filter]
label=Label calls below the selected thresholds
kind=exec
tool=bcftools
produces=variants
arg.0=filter
arg.1=-m
arg.2=+
arg.3=-s
arg.4=LowQual
arg.5=-e
arg.6=QUAL<{input:min-qual} || FORMAT/DP<{input:min-depth}
arg.7=-Oz
arg.8=-o
arg.9={output:variants}
arg.10={output:normalized}

[step:cutadapt-bwa-bcftools-quality-only:index-variants]
label=Index the VCF
kind=exec
tool=bcftools
produces=variants-index
arg.0=index
arg.1=--csi
arg.2={output:variants}

[step:cutadapt-bwa-bcftools-quality-only:variant-stats]
label=Summarize variants
kind=exec
tool=bcftools
stdout=variant-stats
arg.0=stats
arg.1={output:variants}

[step:cutadapt-bwa-bcftools-quality-only:pass-only]
label=Write a separate PASS-only VCF
kind=exec
tool=bcftools
produces=pass-variants
arg.0=view
arg.1=-f
arg.2=PASS
arg.3=-Oz
arg.4=-o
arg.5={output:pass-variants}
arg.6={output:variants}

[step:cutadapt-bwa-bcftools-quality-only:pass-index]
label=Index PASS calls
