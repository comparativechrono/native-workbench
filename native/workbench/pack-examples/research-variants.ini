kind=exec
tool=bcftools
stdout=pass-stats
arg.0=stats
arg.1={output:pass-variants}

[workflow:fastp-minimap2-freebayes]
name=fastp + minimap2 + FreeBayes
description=Paired short-read germline SNP/indel workflow. Adapter sequences must match your library. Duplicates are marked and excluded from calling. Uniform ploidy; separate all-call and PASS VCFs. Reference indexes are built privately. fastp poly-G trimming, read correction and duplicate estimation are disabled; orphan reads are saved but not aligned.
inputs=reads1,reads2,reference,sample,read-group,library,platform-unit,platform,threads,sort-memory,ploidy,min-mapq,min-baseq,min-qual,min-depth,min-alt-count,min-alt-fraction,adapter1,adapter2,trim-quality,trim-window,min-length,qualified-quality,unqualified-percent,max-n
outputs=pair-check,reference,reference-index,raw-qc1,raw-qc2,trim-pair-check,trim-qc1,trim-qc2,names,fixed,coordinates,bam,bam-index,duplicate-stats,flagstat,alignment-stats,coverage,calls,normalized,variants,variants-index,pass-variants,pass-index,variant-stats,pass-stats,trimmed1,trimmed2,unpaired1,unpaired2,failed-reads,trim-json,trim-html,plotly-js
steps=check-pairs,copy-reference,index-reference,raw-qc1,raw-qc2,report-assets,trim,trim-pairs,trim-qc1,trim-qc2,align,fixmate,coordinate-sort,mark-duplicates,index-bam,flagstat,alignment-stats,coverage,call,normalize,filter,index-variants,variant-stats,pass-only,pass-index,pass-stats

[input:fastp-minimap2-freebayes:reads1]
label=Read 1 (forward)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[input:fastp-minimap2-freebayes:reads2]
label=Read 2 (reverse)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
different-from=reads1
help=Use the matching mate file, in the same read order. Plain or gzip FASTQ accepted.

[input:fastp-minimap2-freebayes:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
