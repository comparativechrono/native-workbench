stdout=pair-check
arg.0=--reads1
arg.1={input:reads1}
arg.2=--reads2
arg.3={input:reads2}

[step:fastp-bwa-freebayes:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:fastp-bwa-freebayes:index-reference]
label=Index reference
kind=exec
tool=samtools
produces=reference-index
arg.0=faidx
arg.1={output:reference}

[step:fastp-bwa-freebayes:raw-qc1]
label=Profile raw read 1
kind=exec
tool=seqtk
stdout=raw-qc1
arg.0=fqchk
arg.1={input:reads1}

[step:fastp-bwa-freebayes:raw-qc2]
label=Profile raw read 2
kind=exec
tool=seqtk
stdout=raw-qc2
arg.0=fqchk
arg.1={input:reads2}

[step:fastp-bwa-freebayes:report-assets]
label=Stage offline report graphics
kind=copy
source={asset:plotly}
destination=plotly-js

[step:fastp-bwa-freebayes:trim]
label=Trim adapters and filter paired reads with fastp
kind=exec
tool=fastp
produces=trimmed1,trimmed2,unpaired1,unpaired2,failed-reads,trim-json,trim-html
arg.0=-i
arg.1={input:reads1}
arg.2=-I
arg.3={input:reads2}
arg.4=-o
arg.5={output:trimmed1}
arg.6=-O
arg.7={output:trimmed2}
arg.8=--adapter_sequence
arg.9={input:adapter1}
arg.10=--adapter_sequence_r2
arg.11={input:adapter2}
arg.12=--cut_tail
arg.13=--cut_tail_window_size
arg.14={input:trim-window}
arg.15=--cut_tail_mean_quality
arg.16={input:trim-quality}
arg.17=--length_required
arg.18={input:min-length}
arg.19=--qualified_quality_phred
arg.20={input:qualified-quality}
arg.21=--unqualified_percent_limit
arg.22={input:unqualified-percent}
arg.23=--n_base_limit
arg.24={input:max-n}
arg.25=--thread
arg.26={input:threads}
arg.27=--dont_eval_duplication
arg.28=--disable_trim_poly_g
arg.29=--dont_overwrite
arg.30=--unpaired1
arg.31={output:unpaired1}
arg.32=--unpaired2
arg.33={output:unpaired2}
arg.34=--failed_out
arg.35={output:failed-reads}
arg.36=--json
arg.37={output:trim-json}
arg.38=--html
arg.39={output:trim-html}

[step:fastp-bwa-freebayes:trim-pairs]
label=Validate paired FASTQ records
kind=exec
tool=paircheck
stdout=trim-pair-check
arg.0=--reads1
arg.1={output:trimmed1}
arg.2=--reads2
arg.3={output:trimmed2}

[step:fastp-bwa-freebayes:trim-qc1]
label=Profile trimmed read 1
kind=exec
tool=seqtk
stdout=trim-qc1
arg.0=fqchk
arg.1={output:trimmed1}

[step:fastp-bwa-freebayes:trim-qc2]
label=Profile trimmed read 2
kind=exec
tool=seqtk
stdout=trim-qc2
arg.0=fqchk
arg.1={output:trimmed2}

[step:fastp-bwa-freebayes:bwa-index]
label=Build BWA reference index
kind=exec
tool=bwa
produces=bwa-amb,bwa-ann,bwa-bwt,bwa-pac,bwa-sa
arg.0=index
arg.1=-p
arg.2={run}/bwa-reference
arg.3={output:reference}

[step:fastp-bwa-freebayes:align]
label=Align and name-sort read pairs
kind=pipe
tool=bwa
produces=names
arg.0=mem
arg.1=-t
arg.2={input:threads}
arg.3=-R
arg.4=@RG\tID:{input:read-group}\tSM:{input:sample}\tLB:{input:library}\tPL:{input:platform}\tPU:{input:platform-unit}
arg.5={run}/bwa-reference
arg.6={output:trimmed1}
arg.7={output:trimmed2}
sink-tool=samtools
sink-arg.0=sort
sink-arg.1=-n
sink-arg.2=-m
sink-arg.3={input:sort-memory}M
sink-arg.4=-T
sink-arg.5={run}/name-sort
sink-arg.6=-o
sink-arg.7={output:names}
sink-arg.8=-

[step:fastp-bwa-freebayes:fixmate]
label=Fill mate coordinates and scores
kind=exec
tool=samtools
produces=fixed
arg.0=fixmate
arg.1=-m
arg.2={output:names}
arg.3={output:fixed}

[step:fastp-bwa-freebayes:coordinate-sort]
label=Sort by genomic position
kind=exec
tool=samtools
produces=coordinates
arg.0=sort
arg.1=-m
arg.2={input:sort-memory}M
arg.3=-T
arg.4={run}/coordinate-sort
arg.5=-o
arg.6={output:coordinates}
arg.7={output:fixed}

[step:fastp-bwa-freebayes:mark-duplicates]
label=Mark duplicate fragments
kind=exec
tool=samtools
produces=duplicate-stats,bam
arg.0=markdup
arg.1=-s
arg.2=-T
arg.3={run}/markdup
arg.4=-f
arg.5={output:duplicate-stats}
arg.6={output:coordinates}
arg.7={output:bam}

[step:fastp-bwa-freebayes:index-bam]
label=Index the BAM
kind=exec
tool=samtools
produces=bam-index
arg.0=index
arg.1=-c
arg.2={output:bam}

[step:fastp-bwa-freebayes:flagstat]
label=Summarize alignment flags
kind=exec
tool=samtools
stdout=flagstat
arg.0=flagstat
arg.1={output:bam}

[step:fastp-bwa-freebayes:alignment-stats]
label=Summarize alignment statistics
kind=exec
tool=samtools
stdout=alignment-stats
arg.0=stats
arg.1={output:bam}

[step:fastp-bwa-freebayes:coverage]
label=Summarize per-contig coverage
kind=exec
tool=samtools
stdout=coverage
arg.0=coverage
arg.1={output:bam}

[step:fastp-bwa-freebayes:call]
label=Call germline variants with FreeBayes
kind=exec
tool=freebayes
stdout=calls
arg.0=-f
arg.1={output:reference}
arg.2=-p
arg.3={input:ploidy}
arg.4=-m
arg.5={input:min-mapq}
arg.6=-q
arg.7={input:min-baseq}
arg.8=-C
arg.9={input:min-alt-count}
arg.10=-F
arg.11={input:min-alt-fraction}
arg.12=--strict-vcf
arg.13={output:bam}

[step:fastp-bwa-freebayes:normalize]
label=Normalize alleles against the reference
kind=exec
tool=bcftools
produces=normalized
arg.0=norm
arg.1=-f
arg.2={output:reference}
arg.3=-m
arg.4=-any
arg.5=-Ob
arg.6=-o
arg.7={output:normalized}
arg.8={output:calls}

[step:fastp-bwa-freebayes:filter]
label=Label calls below the selected thresholds
kind=exec
tool=bcftools
produces=variants
arg.0=filter
arg.1=-m
arg.2=+
arg.3=-s
arg.4=LowQual
arg.5=-e
arg.6=QUAL<{input:min-qual} || FORMAT/DP<{input:min-depth}
arg.7=-Oz
arg.8=-o
arg.9={output:variants}
arg.10={output:normalized}

[step:fastp-bwa-freebayes:index-variants]
label=Index the VCF
kind=exec
tool=bcftools
produces=variants-index
arg.0=index
arg.1=--csi
arg.2={output:variants}

[step:fastp-bwa-freebayes:variant-stats]
label=Summarize variants
kind=exec
tool=bcftools
stdout=variant-stats
arg.0=stats
arg.1={output:variants}

[step:fastp-bwa-freebayes:pass-only]
label=Write a separate PASS-only VCF
kind=exec
tool=bcftools
produces=pass-variants
arg.0=view
arg.1=-f
arg.2=PASS
arg.3=-Oz
arg.4=-o
arg.5={output:pass-variants}
arg.6={output:variants}

[step:fastp-bwa-freebayes:pass-index]
label=Index PASS calls
kind=exec
tool=bcftools
produces=pass-index
arg.0=index
arg.1=--csi
arg.2={output:pass-variants}

[step:fastp-bwa-freebayes:pass-stats]
label=Summarize PASS calls
kind=exec
tool=bcftools
stdout=pass-stats
arg.0=stats
arg.1={output:pass-variants}

[workflow:fastp-minimap2-bcftools]
name=fastp + minimap2 + BCFtools
description=Paired short-read germline SNP/indel workflow. Adapter sequences must match your library. Duplicates are marked and excluded from calling. Uniform ploidy; separate all-call and PASS VCFs. Reference indexes are built privately. fastp poly-G trimming, read correction and duplicate estimation are disabled; orphan reads are saved but not aligned.
