produces=bam-index
arg.0=index
arg.1=-c
arg.2={output:bam}

[step:fastp-minimap2-bcftools:flagstat]
label=Summarize alignment flags
kind=exec
tool=samtools
stdout=flagstat
arg.0=flagstat
arg.1={output:bam}

[step:fastp-minimap2-bcftools:alignment-stats]
label=Summarize alignment statistics
kind=exec
tool=samtools
stdout=alignment-stats
arg.0=stats
arg.1={output:bam}

[step:fastp-minimap2-bcftools:coverage]
label=Summarize per-contig coverage
kind=exec
tool=samtools
stdout=coverage
arg.0=coverage
arg.1={output:bam}

[step:fastp-minimap2-bcftools:pileup]
label=Calculate genotype likelihoods
kind=exec
tool=bcftools
produces=pileup
arg.0=mpileup
arg.1=-f
arg.2={output:reference}
arg.3=-a
arg.4=FORMAT/DP,FORMAT/AD
arg.5=-q
arg.6={input:min-mapq}
arg.7=-Q
arg.8={input:min-baseq}
arg.9=-d
arg.10={input:max-depth}
arg.11=-Ob
arg.12=-o
arg.13={output:pileup}
arg.14={output:bam}

[step:fastp-minimap2-bcftools:call]
label=Call SNPs and short indels
kind=exec
tool=bcftools
produces=calls
arg.0=call
arg.1=-m
arg.2=-v
arg.3=--ploidy
arg.4={input:ploidy}
arg.5=-Ob
arg.6=-o
arg.7={output:calls}
arg.8={output:pileup}

[step:fastp-minimap2-bcftools:normalize]
label=Normalize alleles against the reference
kind=exec
tool=bcftools
produces=normalized
arg.0=norm
arg.1=-f
arg.2={output:reference}
arg.3=-m
arg.4=-any
arg.5=-Ob
arg.6=-o
arg.7={output:normalized}
arg.8={output:calls}

[step:fastp-minimap2-bcftools:filter]
label=Label calls below the selected thresholds
kind=exec
tool=bcftools
produces=variants
arg.0=filter
arg.1=-m
arg.2=+
arg.3=-s
arg.4=LowQual
arg.5=-e
arg.6=QUAL<{input:min-qual} || FORMAT/DP<{input:min-depth}
arg.7=-Oz
arg.8=-o
arg.9={output:variants}
arg.10={output:normalized}

[step:fastp-minimap2-bcftools:index-variants]
label=Index the VCF
kind=exec
tool=bcftools
produces=variants-index
arg.0=index
arg.1=--csi
arg.2={output:variants}

[step:fastp-minimap2-bcftools:variant-stats]
label=Summarize variants
kind=exec
tool=bcftools
stdout=variant-stats
arg.0=stats
arg.1={output:variants}

[step:fastp-minimap2-bcftools:pass-only]
label=Write a separate PASS-only VCF
kind=exec
