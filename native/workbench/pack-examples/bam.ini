[pack]
format=2
id=bam
version=0.4.0
name=Alignment files
platform=windows-x86_64
description=Prepare, sort, merge and inspect BAM files.
color=#C2853B

[tool:samtools]
path=bin/samtools.exe
version=1.24
sha256=49c2f16425d464e4ad1c1439d7a9e32a3b1c1bf8e5d54403778de610d2f440b3

[workflow:prepare]
name=Prepare paired alignments
description=Name-sort, fix mates, coordinate-sort, mark duplicates, index and summarize. Duplicates are retained.
inputs=alignment
outputs=names,fixed,coordinates,bam,bam-index,duplicate-stats,flagstat,alignment-stats
steps=name-sort,fixmate,coordinate-sort,mark-duplicates,index-bam,flagstat,alignment-stats

[input:prepare:alignment]
label=Paired alignments
type=file
required=true
filter=Alignments|*.bam;*.sam|All files|*.*

[output:prepare:names]
label=Name-sorted alignments
path=alignment.names.bam
final=false
nonempty=true

[output:prepare:fixed]
label=Mate-corrected alignments
path=alignment.fixmate.bam
final=false
nonempty=true

[output:prepare:coordinates]
label=Coordinate-sorted alignments
path=alignment.sorted.bam
final=false
nonempty=true

[output:prepare:bam]
label=Sorted, duplicate-marked BAM
path=alignment.marked.bam
final=true
nonempty=true

[output:prepare:bam-index]
label=BAM index (CSI)
path=alignment.marked.bam.csi
final=true
nonempty=true

[output:prepare:duplicate-stats]
label=Duplicate-marking summary
path=duplicates.txt
final=true
nonempty=true

[output:prepare:flagstat]
label=Alignment flag summary
path=flagstat.txt
final=true
nonempty=true

[output:prepare:alignment-stats]
label=Alignment statistics
path=alignment-stats.txt
final=true
nonempty=true

[step:prepare:name-sort]
label=Group read mates by name
kind=exec
tool=samtools
produces=names
arg.0=sort
arg.1=-n
arg.2=-m
arg.3=256M
arg.4=-T
arg.5={run}/name-sort
arg.6=-o
arg.7={output:names}
arg.8={input:alignment}

[step:prepare:fixmate]
label=Fill mate coordinates and scores
kind=exec
tool=samtools
produces=fixed
arg.0=fixmate
arg.1=-m
arg.2={output:names}
arg.3={output:fixed}

[step:prepare:coordinate-sort]
label=Sort by genomic position
kind=exec
tool=samtools
produces=coordinates
arg.0=sort
arg.1=-m
arg.2=256M
arg.3=-T
arg.4={run}/coordinate-sort
arg.5=-o
arg.6={output:coordinates}
arg.7={output:fixed}

[step:prepare:mark-duplicates]
label=Mark duplicate fragments
kind=exec
tool=samtools
produces=duplicate-stats,bam
arg.0=markdup
arg.1=-s
arg.2=-T
arg.3={run}/markdup
arg.4=-f
arg.5={output:duplicate-stats}
arg.6={output:coordinates}
arg.7={output:bam}

[step:prepare:index-bam]
label=Index the BAM
kind=exec
tool=samtools
produces=bam-index
arg.0=index
arg.1=-c
arg.2={output:bam}

[step:prepare:flagstat]
label=Summarize alignment flags
kind=exec
tool=samtools
stdout=flagstat
arg.0=flagstat
arg.1={output:bam}

[step:prepare:alignment-stats]
label=Summarize alignment statistics
kind=exec
tool=samtools
stdout=alignment-stats
arg.0=stats
arg.1={output:bam}

[workflow:sort]
name=Coordinate sort
description=Sort a SAM or BAM by reference position.
inputs=alignment
outputs=sorted
steps=sort

[input:sort:alignment]
label=Alignments
type=file
required=true
filter=Alignments|*.bam;*.sam|All files|*.*

[output:sort:sorted]
label=Sorted BAM
path=sorted.bam
final=true
nonempty=true

[step:sort:sort]
label=Sort alignments
kind=exec
tool=samtools
produces=sorted
arg.0=sort
arg.1=-m
arg.2=256M
arg.3=-T
arg.4={run}/sort
arg.5=-o
arg.6={output:sorted}
arg.7={input:alignment}

[workflow:index]
name=Index a BAM
description=Create an index beside a private BAM copy; the selected BAM is unchanged.
inputs=alignment
outputs=alignment,index
steps=copy,index

[input:index:alignment]
label=Coordinate-sorted BAM
type=file
required=true
filter=BAM|*.bam

[output:index:alignment]
label=BAM copy
path=alignment.bam
final=true
nonempty=true

[output:index:index]
label=BAM index (CSI)
path=alignment.bam.csi
final=true
nonempty=true

[step:index:copy]
label=Copy BAM into the run folder
kind=copy
source={input:alignment}
destination=alignment

[step:index:index]
label=Index BAM
kind=exec
tool=samtools
produces=index
arg.0=index
arg.1=-c
arg.2={output:alignment}

[workflow:flagstat]
name=Alignment flag summary
description=Count mapped, paired and duplicate read flags.
inputs=alignment
outputs=statistics
steps=flagstat

[input:flagstat:alignment]
label=Alignments
type=file
required=true
filter=Alignments|*.bam;*.sam|All files|*.*

[output:flagstat:statistics]
label=Alignment summary
path=flagstat.txt
final=true
nonempty=true

[step:flagstat:flagstat]
label=Summarize flags
kind=exec
tool=samtools
stdout=statistics
arg.0=flagstat
arg.1={input:alignment}

[workflow:merge]
name=Merge aligned lanes
description=Merge coordinate-sorted BAMs with the same reference dictionary. Review read groups and sample identities first.
inputs=alignments
outputs=merged
steps=merge

[input:merge:alignments]
label=BAM files
type=files
required=true
filter=BAM files|*.bam
help=Select multiple coordinate-sorted BAMs. Each path is passed as a separate argument.

[output:merge:merged]
label=Merged BAM
path=merged.bam
final=true
nonempty=true

[step:merge:merge]
label=Merge BAM files
kind=exec
tool=samtools
produces=merged
arg.0=merge
arg.1=-o
arg.2={output:merged}
arg.3={inputs:alignments}

[workflow:name-sort]
name=Name sort
description=Group mates by read name before fixmate.
inputs=alignment
outputs=sorted
steps=sort

[input:name-sort:alignment]
label=Alignments
type=file
required=true
filter=Alignments|*.bam;*.sam|All files|*.*

[output:name-sort:sorted]
label=Name-sorted BAM
path=namesorted.bam
final=true
nonempty=true

[step:name-sort:sort]
label=Sort by read name
kind=exec
tool=samtools
produces=sorted
arg.0=sort
arg.1=-n
arg.2=-m
arg.3=256M
arg.4=-T
arg.5={run}/name-sort
arg.6=-o
arg.7={output:sorted}
arg.8={input:alignment}

[workflow:fixmate]
name=Fix mate information
description=Requires name-sorted or name-collated alignments. Adds mate information and scores for duplicate marking.
inputs=alignment
outputs=fixed
steps=fixmate

[input:fixmate:alignment]
label=Name-grouped alignments
type=file
required=true
filter=Alignments|*.bam;*.sam|All files|*.*

[output:fixmate:fixed]
label=Mate-corrected BAM
path=fixmate.bam
final=true
nonempty=true

[step:fixmate:fixmate]
label=Fix mate information
kind=exec
tool=samtools
produces=fixed
arg.0=fixmate
arg.1=-m
arg.2={input:alignment}
arg.3={output:fixed}

[workflow:mark-duplicates]
name=Mark duplicates
description=Requires coordinate-sorted BAM already processed with fixmate -m. Duplicates are flagged and retained.
inputs=alignment
outputs=marked,duplicates
steps=mark

[input:mark-duplicates:alignment]
label=Prepared coordinate-sorted BAM
type=file
required=true
filter=BAM|*.bam

[output:mark-duplicates:marked]
label=Duplicate-marked BAM
path=marked.bam
final=true
nonempty=true

[output:mark-duplicates:duplicates]
label=Duplicate statistics
path=duplicates.txt
final=true
nonempty=true

[step:mark-duplicates:mark]
label=Mark duplicate fragments
kind=exec
tool=samtools
produces=marked,duplicates
arg.0=markdup
arg.1=-s
arg.2=-T
arg.3={run}/markdup
arg.4=-f
arg.5={output:duplicates}
arg.6={input:alignment}
arg.7={output:marked}

[workflow:statistics]
name=Alignment statistics
description=Detailed read-length, insert-size and alignment statistics.
inputs=alignment
outputs=statistics
steps=statistics

[input:statistics:alignment]
label=Alignments
type=file
required=true
filter=Alignments|*.bam;*.sam|All files|*.*

[output:statistics:statistics]
label=Alignment statistics
path=alignment-stats.txt
final=true
nonempty=true

[step:statistics:statistics]
label=Summarize alignments
kind=exec
tool=samtools
stdout=statistics
arg.0=stats
arg.1={input:alignment}

[workflow:reference-index]
name=Index a reference
description=Create an index beside a private reference copy; the selected reference is unchanged.
inputs=reference
outputs=reference,reference-index
steps=copy-reference,index-reference

[input:reference-index:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[output:reference-index:reference]
label=Reference copy
path=reference.fa
final=true
nonempty=true

[output:reference-index:reference-index]
label=FASTA index
path=reference.fa.fai
final=true
nonempty=true

[step:reference-index:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:reference-index:index-reference]
label=Index reference
kind=exec
tool=samtools
produces=reference-index
arg.0=faidx
arg.1={output:reference}
