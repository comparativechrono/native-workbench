[pack]
format=2
id=fastp
version=0.4.0
name=fastp quality control
platform=windows-x86_64
description=Paired-read preprocessing with an offline HTML report.
color=#36959F

[tool:fastp]
path=bin/fastp.exe
version=1.3.7
sha256=0d212e14a6310a35e867eecd5c87f36ba59c21356a798fe58ee30ee1a84a5dec

[tool:paircheck]
path=bin/paircheck.exe
version=1.0.1
sha256=4f2dda7e26b5c115a7edee936a8a059eb55ece244931b2799a62cebfcd44ecd4

[asset:plotly]
path=assets/plotly-1.2.0.min.js
sha256=60169d9df25530f1d5e29c663ceb18ea7492862acb308800fc5ab0f0bf31a41e

[workflow:paired]
name=fastp: paired adapter and quality filtering
description=Trim known adapters and paired-read overlaps; sliding-window tail trimming with explicit quality/length/N filters. Poly-G trimming and duplicate estimation are disabled. Orphans and failures are retained.
inputs=reads1,reads2,threads,adapter1,adapter2,trim-quality,trim-window,min-length,qualified-quality,unqualified-percent,max-n
outputs=pair-check,trimmed1,trimmed2,unpaired1,unpaired2,failed-reads,trim-json,trim-html,plotly-js
steps=check-pairs,report-assets,trim

[input:paired:reads1]
label=Read 1 (forward)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[input:paired:reads2]
label=Read 2 (reverse)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
different-from=reads1
help=Use the matching mate file, in the same read order. Plain or gzip FASTQ accepted.

[input:paired:threads]
label=Trimming / alignment workers
type=integer
required=true
default=2
min=1
max=64
help=Workers used by Cutadapt, fastp and the aligner. SAMtools and BCFtools remain single-threaded in this build.

[input:paired:adapter1]
label=Read 1 3' adapter
type=text
required=true
constraint=dna
help=Known adapter sequence for this library. fastp also trims adapters using paired-read overlap.

[input:paired:adapter2]
label=Read 2 3' adapter
type=text
required=true
constraint=dna
help=Mate-specific adapter sequence; use A, C, G and T.

[input:paired:trim-quality]
label=Tail-window mean quality
type=integer
required=true
default=20
min=1
max=30

[input:paired:trim-window]
label=Tail-window size
type=integer
required=true
default=4
min=1
max=1000

[input:paired:min-length]
label=Minimum retained read length
type=integer
required=true
default=35
min=1
max=100000

[input:paired:qualified-quality]
label=Qualified base Phred score
type=integer
required=true
default=15
min=0
max=93

[input:paired:unqualified-percent]
label=Maximum low-quality bases (%)
type=integer
required=true
default=40
min=0
max=100

[input:paired:max-n]
label=Maximum N bases per read
type=integer
required=true
default=5
min=0
max=100000

[output:paired:pair-check]
label=Input pair validation
path=read-pairs.json
final=true
nonempty=true

[output:paired:trimmed1]
label=Trimmed read 1
path=reads1.trimmed.fastq.gz
final=true
nonempty=true

[output:paired:trimmed2]
label=Trimmed read 2
path=reads2.trimmed.fastq.gz
final=true
nonempty=true

[output:paired:unpaired1]
label=Passing read 1 with rejected mate
path=reads1.unpaired.fastq
final=true
nonempty=false

[output:paired:unpaired2]
label=Passing read 2 with rejected mate
path=reads2.unpaired.fastq
final=true
nonempty=false

[output:paired:failed-reads]
label=Reads rejected by fastp
path=reads.failed.fastq
final=true
nonempty=false

[output:paired:trim-json]
label=fastp metrics (JSON)
path=trimming.json
final=true
nonempty=true

[output:paired:trim-html]
label=Offline interactive quality report
path=trimming.html
final=true
nonempty=true

[output:paired:plotly-js]
label=Offline report graphics
path=plotly-1.2.0.min.js
final=false
nonempty=true

[step:paired:check-pairs]
label=Validate paired FASTQ records
kind=exec
tool=paircheck
stdout=pair-check
arg.0=--reads1
arg.1={input:reads1}
arg.2=--reads2
arg.3={input:reads2}

[step:paired:report-assets]
label=Stage offline report graphics
kind=copy
source={asset:plotly}
destination=plotly-js

[step:paired:trim]
label=Trim adapters and filter paired reads with fastp
kind=exec
tool=fastp
produces=trimmed1,trimmed2,unpaired1,unpaired2,failed-reads,trim-json,trim-html
arg.0=-i
arg.1={input:reads1}
arg.2=-I
arg.3={input:reads2}
arg.4=-o
arg.5={output:trimmed1}
arg.6=-O
arg.7={output:trimmed2}
arg.8=--adapter_sequence
arg.9={input:adapter1}
arg.10=--adapter_sequence_r2
arg.11={input:adapter2}
arg.12=--cut_tail
arg.13=--cut_tail_window_size
arg.14={input:trim-window}
arg.15=--cut_tail_mean_quality
arg.16={input:trim-quality}
arg.17=--length_required
arg.18={input:min-length}
arg.19=--qualified_quality_phred
arg.20={input:qualified-quality}
arg.21=--unqualified_percent_limit
arg.22={input:unqualified-percent}
arg.23=--n_base_limit
arg.24={input:max-n}
arg.25=--thread
arg.26={input:threads}
arg.27=--dont_eval_duplication
arg.28=--disable_trim_poly_g
arg.29=--dont_overwrite
arg.30=--unpaired1
arg.31={output:unpaired1}
arg.32=--unpaired2
arg.33={output:unpaired2}
arg.34=--failed_out
arg.35={output:failed-reads}
arg.36=--json
arg.37={output:trim-json}
arg.38=--html
arg.39={output:trim-html}
