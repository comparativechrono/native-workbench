[pack]
format=2
id=align
version=0.4.0
name=Read alignment
platform=windows-x86_64
description=Map short reads to a reference genome.
color=#4D78C7

[tool:minimap2]
path=bin/minimap2.exe
version=2.28-r1209
sha256=06bf0815a79552ffcb1291046c7828f2bf8b11d9ad7fe0d9309283e966e973fa

[tool:paircheck]
path=bin/paircheck.exe
version=1.0.1
sha256=4f2dda7e26b5c115a7edee936a8a059eb55ece244931b2799a62cebfcd44ecd4

[workflow:single-end]
name=Single-end alignment
description=Align short reads with minimap2, including the sample read group. The paired workflow consumes both mates together.
inputs=reads1,reference,sample,threads
outputs=sam
steps=align

[input:single-end:reads1]
label=Reads
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[input:single-end:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[input:single-end:sample]
label=Sample name
type=text
required=true
default=sample
constraint=identifier

[input:single-end:threads]
label=Alignment threads
type=integer
required=true
default=2
min=1
max=16
help=Minimap2 mapping workers. BAM/VCF preparation uses one thread in this portable release; sort memory is 256 MiB.

[output:single-end:sam]
label=Alignment SAM
path=alignment.sam
final=true
nonempty=true

[step:single-end:align]
label=Align reads
kind=exec
tool=minimap2
stdout=sam
arg.0=-a
arg.1=-x
arg.2=sr
arg.3=-t
arg.4={input:threads}
arg.5=-R
arg.6=@RG\tID:{input:sample}\tSM:{input:sample}\tLB:library1\tPL:ILLUMINA
arg.7={input:reference}
arg.8={input:reads1}

[workflow:paired-end]
name=Paired-end alignment
description=Align short reads with minimap2, including the sample read group. The paired workflow consumes both mates together.
inputs=reads1,reads2,reference,sample,threads
outputs=pair-check,sam
steps=check-pairs,align

[input:paired-end:reads1]
label=Read 1 (forward)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[input:paired-end:reads2]
label=Read 2 (reverse)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
different-from=reads1
help=Use the matching mate file, in the same read order. Plain or gzip FASTQ accepted.

[input:paired-end:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[input:paired-end:sample]
label=Sample name
type=text
required=true
default=sample
constraint=identifier

[input:paired-end:threads]
label=Alignment threads
type=integer
required=true
default=2
min=1
max=16
help=Minimap2 mapping workers. BAM/VCF preparation uses one thread in this portable release; sort memory is 256 MiB.

[output:paired-end:pair-check]
label=Read-pair validation
path=read-pairs.json
final=true
nonempty=true

[output:paired-end:sam]
label=Alignment SAM
path=alignment.sam
final=true
nonempty=true

[step:paired-end:check-pairs]
label=Validate paired FASTQ records
kind=exec
tool=paircheck
stdout=pair-check
arg.0=--reads1
arg.1={input:reads1}
arg.2=--reads2
arg.3={input:reads2}

[step:paired-end:align]
label=Align reads
kind=exec
tool=minimap2
stdout=sam
arg.0=-a
arg.1=-x
arg.2=sr
arg.3=-t
arg.4={input:threads}
arg.5=-R
arg.6=@RG\tID:{input:sample}\tSM:{input:sample}\tLB:library1\tPL:ILLUMINA
arg.7={input:reference}
arg.8={input:reads1}
arg.9={input:reads2}
