[pack]
format=2
id=variants
version=0.4.0
name=Variant tools
platform=windows-x86_64
description=Call, normalize, filter and inspect small variants.
color=#966AB7

[tool:samtools]
path=bin/samtools.exe
version=1.24
sha256=49c2f16425d464e4ad1c1439d7a9e32a3b1c1bf8e5d54403778de610d2f440b3

[tool:bcftools]
path=bin/bcftools.exe
version=1.24
sha256=e2f53c05048fa1de94149e87203ba9c4c73be548196097fbe2f1426c3d1d556f

[workflow:call]
name=Call variants from a BAM
description=Sample identities come from BAM read groups. Selected ploidy applies to all contigs and samples; LowQual is a site-level filter.
inputs=alignment,reference,ploidy,min-mapq,min-baseq,max-depth,min-qual,min-depth
outputs=reference,reference-index,pileup,calls,normalized,variants,variants-index,variant-stats
steps=copy-reference,index-reference,pileup,call,normalize,filter,index-variants,variant-stats

[input:call:alignment]
label=Prepared BAM
type=file
required=true
filter=BAM|*.bam

[input:call:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[input:call:ploidy]
label=Assumed ploidy
type=choice
required=true
default=2
choices=1:Haploid (1)|2:Diploid (2)
help=Applies to every contig, including mitochondria. Confirm from sample metadata; this is not inferred from the reads.

[input:call:min-mapq]
label=Minimum mapping quality
type=integer
required=true
default=20
min=0
max=60

[input:call:min-baseq]
label=Minimum base quality
type=integer
required=true
default=20
min=0
max=93

[input:call:max-depth]
label=Maximum pileup depth per file
type=integer
required=true
default=1000
min=1
max=1000000
help=Depth above this cap may be subsampled by BCFtools.

[input:call:min-qual]
label=Variant quality threshold
type=integer
required=true
default=20
min=0
max=100000

[input:call:min-depth]
label=Sample depth threshold
type=integer
required=true
default=5
min=0
max=1000000
help=Calls below the quality or sample-depth threshold are labelled LowQual, not deleted.

[output:call:reference]
label=Working reference
path=reference.fa
final=false
nonempty=true

[output:call:reference-index]
label=Reference index
path=reference.fa.fai
final=false
nonempty=true

[output:call:pileup]
label=Genotype likelihoods
path=pileup.bcf
final=false
nonempty=true

[output:call:calls]
label=Raw variant calls
path=calls.bcf
final=false
nonempty=true

[output:call:normalized]
label=Normalized calls
path=normalized.bcf
final=false
nonempty=true

[output:call:variants]
label=Filtered variants (VCF.gz)
path=variants.vcf.gz
final=true
nonempty=true

[output:call:variants-index]
label=Variant index (CSI)
path=variants.vcf.gz.csi
final=true
nonempty=true

[output:call:variant-stats]
label=Variant summary
path=variant-stats.txt
final=true
nonempty=true

[step:call:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:call:index-reference]
label=Index reference
kind=exec
tool=samtools
produces=reference-index
arg.0=faidx
arg.1={output:reference}

[step:call:pileup]
label=Calculate genotype likelihoods
kind=exec
tool=bcftools
produces=pileup
arg.0=mpileup
arg.1=-f
arg.2={output:reference}
arg.3=-a
arg.4=FORMAT/DP,FORMAT/AD
arg.5=-q
arg.6={input:min-mapq}
arg.7=-Q
arg.8={input:min-baseq}
arg.9=-d
arg.10={input:max-depth}
arg.11=-Ob
arg.12=-o
arg.13={output:pileup}
arg.14={input:alignment}

[step:call:call]
label=Call SNPs and short indels
kind=exec
tool=bcftools
produces=calls
arg.0=call
arg.1=-m
arg.2=-v
arg.3=--ploidy
arg.4={input:ploidy}
arg.5=-Ob
arg.6=-o
arg.7={output:calls}
arg.8={output:pileup}

[step:call:normalize]
label=Normalize alleles against the reference
kind=exec
tool=bcftools
produces=normalized
arg.0=norm
arg.1=-f
arg.2={output:reference}
arg.3=-m
arg.4=-any
arg.5=-Ob
arg.6=-o
arg.7={output:normalized}
arg.8={output:calls}

[step:call:filter]
label=Label calls below the selected thresholds
kind=exec
tool=bcftools
produces=variants
arg.0=filter
arg.1=-s
arg.2=LowQual
arg.3=-e
arg.4=QUAL<{input:min-qual} || FORMAT/DP<{input:min-depth}
arg.5=-Oz
arg.6=-o
arg.7={output:variants}
arg.8={output:normalized}

[step:call:index-variants]
label=Index the VCF
kind=exec
tool=bcftools
produces=variants-index
arg.0=index
arg.1=--csi
arg.2={output:variants}

[step:call:variant-stats]
label=Summarize variants
kind=exec
tool=bcftools
stdout=variant-stats
arg.0=stats
arg.1={output:variants}

[workflow:call-bcf]
name=Call from genotype likelihoods
description=Call variants from BCFtools mpileup output.
inputs=likelihoods,ploidy
outputs=calls
steps=call

[input:call-bcf:likelihoods]
label=Genotype likelihoods
type=file
required=true
filter=Variants|*.vcf;*.vcf.gz;*.bcf|All files|*.*

[input:call-bcf:ploidy]
label=Assumed ploidy
type=choice
required=true
default=2
choices=1:Haploid (1)|2:Diploid (2)
help=Applies to every contig, including mitochondria. Confirm from sample metadata; this is not inferred from the reads.

[output:call-bcf:calls]
label=Variant calls
path=calls.bcf
final=true
nonempty=true

[step:call-bcf:call]
label=Call variants
kind=exec
tool=bcftools
produces=calls
arg.0=call
arg.1=-m
arg.2=-v
arg.3=--ploidy
arg.4={input:ploidy}
arg.5=-Ob
arg.6=-o
arg.7={output:calls}
arg.8={input:likelihoods}

[workflow:normalize]
name=Normalize variants
description=Left-align alleles and split multiallelic records against a private reference copy.
inputs=variants,reference
outputs=reference,reference-index,normalized
steps=copy-reference,index-reference,normalize

[input:normalize:variants]
label=Variants
type=file
required=true
filter=Variants|*.vcf;*.vcf.gz;*.bcf|All files|*.*

[input:normalize:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[output:normalize:reference]
label=Working reference
path=reference.fa
final=false
nonempty=true

[output:normalize:reference-index]
label=Reference index
path=reference.fa.fai
final=false
nonempty=true

[output:normalize:normalized]
label=Normalized variants
path=normalized.vcf.gz
final=true
nonempty=true

[step:normalize:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:normalize:index-reference]
label=Index reference
kind=exec
tool=samtools
produces=reference-index
arg.0=faidx
arg.1={output:reference}

[step:normalize:normalize]
label=Normalize alleles
kind=exec
tool=bcftools
produces=normalized
arg.0=norm
arg.1=-f
arg.2={output:reference}
arg.3=-m
arg.4=-any
arg.5=-Oz
arg.6=-o
arg.7={output:normalized}
arg.8={input:variants}

[workflow:filter]
name=Label low-quality calls
description=Retain all calls, marking those below quality or FORMAT/DP thresholds as LowQual.
inputs=variants,min-qual,min-depth
outputs=filtered
steps=filter

[input:filter:variants]
label=Variants
type=file
required=true
filter=Variants|*.vcf;*.vcf.gz;*.bcf|All files|*.*

[input:filter:min-qual]
label=Variant quality threshold
type=integer
required=true
default=20
min=0
max=100000

[input:filter:min-depth]
label=Sample depth threshold
type=integer
required=true
default=5
min=0
max=1000000
help=Calls below the quality or sample-depth threshold are labelled LowQual, not deleted.

[output:filter:filtered]
label=Filtered variants
path=filtered.vcf.gz
final=true
nonempty=true

[step:filter:filter]
label=Apply soft filters
kind=exec
tool=bcftools
produces=filtered
arg.0=filter
arg.1=-s
arg.2=LowQual
arg.3=-e
arg.4=QUAL<{input:min-qual} || FORMAT/DP<{input:min-depth}
arg.5=-Oz
arg.6=-o
arg.7={output:filtered}
arg.8={input:variants}

[workflow:statistics]
name=Variant statistics
description=Summarize an existing VCF or BCF.
inputs=variants
outputs=statistics
steps=statistics

[input:statistics:variants]
label=Variants
type=file
required=true
filter=Variants|*.vcf;*.vcf.gz;*.bcf|All files|*.*

[output:statistics:statistics]
label=Variant statistics
path=variant-stats.txt
final=true
nonempty=true

[step:statistics:statistics]
label=Summarize variants
kind=exec
tool=bcftools
stdout=statistics
arg.0=stats
arg.1={input:variants}

[workflow:pileup]
name=Calculate genotype likelihoods
description=Create BCF input for variant calling from a prepared single-sample BAM.
inputs=alignment,reference,min-mapq,min-baseq,max-depth
outputs=reference,reference-index,pileup
steps=copy-reference,index-reference,pileup

[input:pileup:alignment]
label=Prepared BAM
type=file
required=true
filter=BAM|*.bam

[input:pileup:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[input:pileup:min-mapq]
label=Minimum mapping quality
type=integer
required=true
default=20
min=0
max=60

[input:pileup:min-baseq]
label=Minimum base quality
type=integer
required=true
default=20
min=0
max=93

[input:pileup:max-depth]
label=Maximum pileup depth per file
type=integer
required=true
default=1000
min=1
max=1000000
help=Depth above this cap may be subsampled by BCFtools.

[output:pileup:reference]
label=Working reference
path=reference.fa
final=false
nonempty=true

[output:pileup:reference-index]
label=Reference index
path=reference.fa.fai
final=false
nonempty=true

[output:pileup:pileup]
label=Genotype likelihoods
path=pileup.bcf
final=true
nonempty=true

[step:pileup:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:pileup:index-reference]
label=Index reference
kind=exec
tool=samtools
produces=reference-index
arg.0=faidx
arg.1={output:reference}

[step:pileup:pileup]
label=Calculate genotype likelihoods
kind=exec
tool=bcftools
produces=pileup
arg.0=mpileup
arg.1=-f
arg.2={output:reference}
arg.3=-a
arg.4=FORMAT/DP,FORMAT/AD
arg.5=-q
arg.6={input:min-mapq}
arg.7=-Q
arg.8={input:min-baseq}
arg.9=-d
arg.10={input:max-depth}
arg.11=-Ob
arg.12=-o
arg.13={output:pileup}
arg.14={input:alignment}

[workflow:index]
name=Index a compressed VCF
description=Create an index beside a private copy of a sorted, BGZF-compressed VCF.
inputs=variants
outputs=variants,index
steps=copy,index

[input:index:variants]
label=BGZF-compressed VCF
type=file
required=true
filter=Compressed VCF|*.vcf.gz

[output:index:variants]
label=VCF copy
path=variants.vcf.gz
final=true
nonempty=true

[output:index:index]
label=VCF index
path=variants.vcf.gz.csi
final=true
nonempty=true

[step:index:copy]
label=Copy VCF into the run folder
kind=copy
source={input:variants}
destination=variants

[step:index:index]
label=Index variants
kind=exec
tool=bcftools
produces=index
arg.0=index
arg.1=--csi
arg.2={output:variants}
