[pack]
format=2
id=bwa
version=0.4.0
name=BWA alignment
platform=windows-x86_64
description=BWA-MEM short-read alignment with explicit sample and library read groups.
color=#486FB0

[tool:bwa]
path=bin/bwa.exe
version=0.7.19-r1273
sha256=55d08b399c42a671e60a8dc7d0421fb60aca8899aa54201903fcf1e2ac21fa0a

[tool:samtools]
path=bin/samtools.exe
version=1.24
sha256=49c2f16425d464e4ad1c1439d7a9e32a3b1c1bf8e5d54403778de610d2f440b3

[tool:paircheck]
path=bin/paircheck.exe
version=1.0.1
sha256=4f2dda7e26b5c115a7edee936a8a059eb55ece244931b2799a62cebfcd44ecd4

[workflow:index]
name=Build BWA index
description=Create an index from a private reference copy.
inputs=reference
outputs=reference,bwa-amb,bwa-ann,bwa-bwt,bwa-pac,bwa-sa
steps=copy-reference,bwa-index

[input:index:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[output:index:reference]
label=Reference copy
path=reference.fa
final=true
nonempty=true

[output:index:bwa-amb]
label=BWA index (amb)
path=bwa-reference.amb
final=false
nonempty=true

[output:index:bwa-ann]
label=BWA index (ann)
path=bwa-reference.ann
final=false
nonempty=true

[output:index:bwa-bwt]
label=BWA index (bwt)
path=bwa-reference.bwt
final=false
nonempty=true

[output:index:bwa-pac]
label=BWA index (pac)
path=bwa-reference.pac
final=false
nonempty=true

[output:index:bwa-sa]
label=BWA index (sa)
path=bwa-reference.sa
final=false
nonempty=true

[step:index:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:index:bwa-index]
label=Build BWA reference index
kind=exec
tool=bwa
produces=bwa-amb,bwa-ann,bwa-bwt,bwa-pac,bwa-sa
arg.0=index
arg.1=-p
arg.2={run}/bwa-reference
arg.3={output:reference}

[workflow:paired-end]
name=BWA-MEM paired alignment
description=Align paired short reads, with explicit read groups, streaming directly to BAM.
inputs=reads1,reads2,reference,sample,read-group,library,platform-unit,platform,threads
outputs=pair-check,reference,bwa-amb,bwa-ann,bwa-bwt,bwa-pac,bwa-sa,aligned
steps=check-pairs,copy-reference,bwa-index,align

[input:paired-end:reads1]
label=Read 1 (forward)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[input:paired-end:reads2]
label=Read 2 (reverse)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
different-from=reads1
help=Use the matching mate file, in the same read order. Plain or gzip FASTQ accepted.

[input:paired-end:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[input:paired-end:sample]
label=Sample name (SM)
type=text
required=true
default=sample
constraint=identifier

[input:paired-end:read-group]
label=Read group ID
type=text
required=true
default=group1
constraint=identifier
help=Use a unique read-group ID for each lane when merging lanes.

[input:paired-end:library]
label=Library ID (LB)
type=text
required=true
default=library1
constraint=identifier
help=Lanes from the same physical library should share LB; independent libraries should not.

[input:paired-end:platform-unit]
label=Platform unit (PU)
type=text
required=true
default=unit1
constraint=identifier
help=For Illumina, a flowcell/lane identifier is customary.

[input:paired-end:platform]
label=Sequencing platform (PL)
type=choice
required=true
default=ILLUMINA
choices=ILLUMINA:Illumina|DNBSEQ:DNBSEQ (MGI/BGI)

[input:paired-end:threads]
label=Trimming / alignment workers
type=integer
required=true
default=2
min=1
max=64
help=Workers used by Cutadapt, fastp and the aligner. SAMtools and BCFtools remain single-threaded in this build.

[output:paired-end:pair-check]
label=Read-pair validation
path=read-pairs.json
final=true
nonempty=true

[output:paired-end:reference]
label=Working reference
path=reference.fa
final=false
nonempty=true

[output:paired-end:bwa-amb]
label=BWA index (amb)
path=bwa-reference.amb
final=false
nonempty=true

[output:paired-end:bwa-ann]
label=BWA index (ann)
path=bwa-reference.ann
final=false
nonempty=true

[output:paired-end:bwa-bwt]
label=BWA index (bwt)
path=bwa-reference.bwt
final=false
nonempty=true

[output:paired-end:bwa-pac]
label=BWA index (pac)
path=bwa-reference.pac
final=false
nonempty=true

[output:paired-end:bwa-sa]
label=BWA index (sa)
path=bwa-reference.sa
final=false
nonempty=true

[output:paired-end:aligned]
label=Unsorted alignment BAM
path=alignment.unsorted.bam
final=true
nonempty=true

[step:paired-end:check-pairs]
label=Validate paired FASTQ records
kind=exec
tool=paircheck
stdout=pair-check
arg.0=--reads1
arg.1={input:reads1}
arg.2=--reads2
arg.3={input:reads2}

[step:paired-end:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:paired-end:bwa-index]
label=Build BWA reference index
kind=exec
tool=bwa
produces=bwa-amb,bwa-ann,bwa-bwt,bwa-pac,bwa-sa
arg.0=index
arg.1=-p
arg.2={run}/bwa-reference
arg.3={output:reference}

[step:paired-end:align]
label=Align read pairs and stream to BAM
kind=pipe
tool=bwa
produces=aligned
arg.0=mem
arg.1=-t
arg.2={input:threads}
arg.3=-R
arg.4=@RG\tID:{input:read-group}\tSM:{input:sample}\tLB:{input:library}\tPL:{input:platform}\tPU:{input:platform-unit}
arg.5={run}/bwa-reference
arg.6={input:reads1}
arg.7={input:reads2}
sink-tool=samtools
sink-arg.0=view
sink-arg.1=-b
sink-arg.2=-o
sink-arg.3={output:aligned}
sink-arg.4=-
