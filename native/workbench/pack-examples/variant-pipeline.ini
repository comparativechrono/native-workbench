[pack]
format=2
id=variant-pipeline
version=0.4.0
name=Variant pipeline
platform=windows-x86_64
description=From paired reads to an indexed VCF and a reproducible run report.
color=#CF6D79

[tool:seqtk]
path=bin/seqtk.exe
version=1.4-r122
sha256=c5df3fadda2e622a2e358de78a0d34513b392b68bd50208ee3dccb4877c72c2e

[tool:minimap2]
path=bin/minimap2.exe
version=2.28-r1209
sha256=06bf0815a79552ffcb1291046c7828f2bf8b11d9ad7fe0d9309283e966e973fa

[tool:samtools]
path=bin/samtools.exe
version=1.24
sha256=49c2f16425d464e4ad1c1439d7a9e32a3b1c1bf8e5d54403778de610d2f440b3

[tool:bcftools]
path=bin/bcftools.exe
version=1.24
sha256=e2f53c05048fa1de94149e87203ba9c4c73be548196097fbe2f1426c3d1d556f

[tool:paircheck]
path=bin/paircheck.exe
version=1.0.1
sha256=4f2dda7e26b5c115a7edee936a8a059eb55ece244931b2799a62cebfcd44ecd4

[workflow:paired-variants]
name=Paired reads to variants
description=A complete small-variant teaching workflow. Raw reads are not trimmed; duplicates are marked and retained. Ploidy applies uniformly, including mitochondrial contigs.
inputs=reads1,reads2,reference,sample,threads,ploidy,min-mapq,min-baseq,max-depth,min-qual,min-depth
outputs=pair-check,reference,reference-index,qc1,qc2,sam,names,fixed,coordinates,bam,bam-index,duplicate-stats,flagstat,alignment-stats,pileup,calls,normalized,variants,variants-index,variant-stats
steps=check-pairs,copy-reference,index-reference,qc1,qc2,align,name-sort,fixmate,coordinate-sort,mark-duplicates,index-bam,flagstat,alignment-stats,pileup,call,normalize,filter,index-variants,variant-stats

[input:paired-variants:reads1]
label=Read 1 (forward)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*

[input:paired-variants:reads2]
label=Read 2 (reverse)
type=file
required=true
filter=FASTQ reads|*.fastq;*.fq;*.fastq.gz;*.fq.gz|All files|*.*
different-from=reads1
help=Use the matching mate file, in the same read order. Plain or gzip FASTQ accepted.

[input:paired-variants:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[input:paired-variants:sample]
label=Sample name
type=text
required=true
default=sample
constraint=identifier
help=Letters, numbers, dots, underscores and hyphens; at most 64 characters.

[input:paired-variants:threads]
label=Alignment threads
type=integer
required=true
default=2
min=1
max=16
help=Minimap2 mapping workers. BAM/VCF preparation uses one thread in this portable release; sort memory is 256 MiB.

[input:paired-variants:ploidy]
label=Assumed ploidy
type=choice
required=true
default=2
choices=1:Haploid (1)|2:Diploid (2)
help=Applies to every contig, including mitochondria. Confirm from sample metadata; this is not inferred from the reads.

[input:paired-variants:min-mapq]
label=Minimum mapping quality
type=integer
required=true
default=20
min=0
max=60

[input:paired-variants:min-baseq]
label=Minimum base quality
type=integer
required=true
default=20
min=0
max=93

[input:paired-variants:max-depth]
label=Maximum pileup depth per file
type=integer
required=true
default=1000
min=1
max=1000000
help=Depth above this cap may be subsampled by BCFtools.

[input:paired-variants:min-qual]
label=Variant quality threshold
type=integer
required=true
default=20
min=0
max=100000

[input:paired-variants:min-depth]
label=Sample depth threshold
type=integer
required=true
default=5
min=0
max=1000000
help=Calls below the quality or sample-depth threshold are labelled LowQual, not deleted.

[output:paired-variants:pair-check]
label=Read-pair validation
path=read-pairs.json
final=true
nonempty=true

[output:paired-variants:reference]
label=Working reference
path=reference.fa
final=false
nonempty=true

[output:paired-variants:reference-index]
label=Reference index
path=reference.fa.fai
final=false
nonempty=true

[output:paired-variants:qc1]
label=Read 1 quality profile
path=read1-quality.txt
final=true
nonempty=true

[output:paired-variants:qc2]
label=Read 2 quality profile
path=read2-quality.txt
final=true
nonempty=true

[output:paired-variants:sam]
label=Raw alignment
path=alignment.sam
final=false
nonempty=true

[output:paired-variants:names]
label=Name-sorted alignments
path=alignment.names.bam
final=false
nonempty=true

[output:paired-variants:fixed]
label=Mate-corrected alignments
path=alignment.fixmate.bam
final=false
nonempty=true

[output:paired-variants:coordinates]
label=Coordinate-sorted alignments
path=alignment.sorted.bam
final=false
nonempty=true

[output:paired-variants:bam]
label=Sorted, duplicate-marked BAM
path=alignment.marked.bam
final=true
nonempty=true

[output:paired-variants:bam-index]
label=BAM index (CSI)
path=alignment.marked.bam.csi
final=true
nonempty=true

[output:paired-variants:duplicate-stats]
label=Duplicate-marking summary
path=duplicates.txt
final=true
nonempty=true

[output:paired-variants:flagstat]
label=Alignment flag summary
path=flagstat.txt
final=true
nonempty=true

[output:paired-variants:alignment-stats]
label=Alignment statistics
path=alignment-stats.txt
final=true
nonempty=true

[output:paired-variants:pileup]
label=Genotype likelihoods
path=pileup.bcf
final=false
nonempty=true

[output:paired-variants:calls]
label=Raw variant calls
path=calls.bcf
final=false
nonempty=true

[output:paired-variants:normalized]
label=Normalized calls
path=normalized.bcf
final=false
nonempty=true

[output:paired-variants:variants]
label=Filtered variants (VCF.gz)
path=variants.vcf.gz
final=true
nonempty=true

[output:paired-variants:variants-index]
label=Variant index (CSI)
path=variants.vcf.gz.csi
final=true
nonempty=true

[output:paired-variants:variant-stats]
label=Variant summary
path=variant-stats.txt
final=true
nonempty=true

[step:paired-variants:check-pairs]
label=Validate paired FASTQ records
kind=exec
tool=paircheck
stdout=pair-check
arg.0=--reads1
arg.1={input:reads1}
arg.2=--reads2
arg.3={input:reads2}

[step:paired-variants:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:paired-variants:index-reference]
label=Index reference
kind=exec
tool=samtools
produces=reference-index
arg.0=faidx
arg.1={output:reference}

[step:paired-variants:qc1]
label=Profile read 1 quality
kind=exec
tool=seqtk
stdout=qc1
arg.0=fqchk
arg.1={input:reads1}

[step:paired-variants:qc2]
label=Profile read 2 quality
kind=exec
tool=seqtk
stdout=qc2
arg.0=fqchk
arg.1={input:reads2}

[step:paired-variants:align]
label=Align read pairs
kind=exec
tool=minimap2
stdout=sam
arg.0=-a
arg.1=-x
arg.2=sr
arg.3=-t
arg.4={input:threads}
arg.5=-R
arg.6=@RG\tID:{input:sample}\tSM:{input:sample}\tLB:library1\tPL:ILLUMINA
arg.7={output:reference}
arg.8={input:reads1}
arg.9={input:reads2}

[step:paired-variants:name-sort]
label=Group read mates by name
kind=exec
tool=samtools
produces=names
arg.0=sort
arg.1=-n
arg.2=-m
arg.3=256M
arg.4=-T
arg.5={run}/name-sort
arg.6=-o
arg.7={output:names}
arg.8={output:sam}

[step:paired-variants:fixmate]
label=Fill mate coordinates and scores
kind=exec
tool=samtools
produces=fixed
arg.0=fixmate
arg.1=-m
arg.2={output:names}
arg.3={output:fixed}

[step:paired-variants:coordinate-sort]
label=Sort by genomic position
kind=exec
tool=samtools
produces=coordinates
arg.0=sort
arg.1=-m
arg.2=256M
arg.3=-T
arg.4={run}/coordinate-sort
arg.5=-o
arg.6={output:coordinates}
arg.7={output:fixed}

[step:paired-variants:mark-duplicates]
label=Mark duplicate fragments
kind=exec
tool=samtools
produces=duplicate-stats,bam
arg.0=markdup
arg.1=-s
arg.2=-T
arg.3={run}/markdup
arg.4=-f
arg.5={output:duplicate-stats}
arg.6={output:coordinates}
arg.7={output:bam}

[step:paired-variants:index-bam]
label=Index the BAM
kind=exec
tool=samtools
produces=bam-index
arg.0=index
arg.1=-c
arg.2={output:bam}

[step:paired-variants:flagstat]
label=Summarize alignment flags
kind=exec
tool=samtools
stdout=flagstat
arg.0=flagstat
arg.1={output:bam}

[step:paired-variants:alignment-stats]
label=Summarize alignment statistics
kind=exec
tool=samtools
stdout=alignment-stats
arg.0=stats
arg.1={output:bam}

[step:paired-variants:pileup]
label=Calculate genotype likelihoods
kind=exec
tool=bcftools
produces=pileup
arg.0=mpileup
arg.1=-f
arg.2={output:reference}
arg.3=-a
arg.4=FORMAT/DP,FORMAT/AD
arg.5=-q
arg.6={input:min-mapq}
arg.7=-Q
arg.8={input:min-baseq}
arg.9=-d
arg.10={input:max-depth}
arg.11=-Ob
arg.12=-o
arg.13={output:pileup}
arg.14={output:bam}

[step:paired-variants:call]
label=Call SNPs and short indels
kind=exec
tool=bcftools
produces=calls
arg.0=call
arg.1=-m
arg.2=-v
arg.3=--ploidy
arg.4={input:ploidy}
arg.5=-Ob
arg.6=-o
arg.7={output:calls}
arg.8={output:pileup}

[step:paired-variants:normalize]
label=Normalize alleles against the reference
kind=exec
tool=bcftools
produces=normalized
arg.0=norm
arg.1=-f
arg.2={output:reference}
arg.3=-m
arg.4=-any
arg.5=-Ob
arg.6=-o
arg.7={output:normalized}
arg.8={output:calls}

[step:paired-variants:filter]
label=Label calls below the selected thresholds
kind=exec
tool=bcftools
produces=variants
arg.0=filter
arg.1=-s
arg.2=LowQual
arg.3=-e
arg.4=QUAL<{input:min-qual} || FORMAT/DP<{input:min-depth}
arg.5=-Oz
arg.6=-o
arg.7={output:variants}
arg.8={output:normalized}

[step:paired-variants:index-variants]
label=Index the VCF
kind=exec
tool=bcftools
produces=variants-index
arg.0=index
arg.1=--csi
arg.2={output:variants}

[step:paired-variants:variant-stats]
label=Summarize variants
kind=exec
tool=bcftools
stdout=variant-stats
arg.0=stats
arg.1={output:variants}
