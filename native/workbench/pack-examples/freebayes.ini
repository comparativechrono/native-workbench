[pack]
format=2
id=freebayes
version=0.4.0
name=FreeBayes variants
platform=windows-x86_64
description=An alternative haplotype-based germline caller.
color=#A05CB0

[tool:freebayes]
path=bin/freebayes.exe
version=1.3.10
sha256=76e3072c61d51893615f8fea9f7e4c572b3caf25aa4ca6fa6e2c6138ade575a6

[tool:samtools]
path=bin/samtools.exe
version=1.24
sha256=49c2f16425d464e4ad1c1439d7a9e32a3b1c1bf8e5d54403778de610d2f440b3

[tool:bcftools]
path=bin/bcftools.exe
version=1.24
sha256=e2f53c05048fa1de94149e87203ba9c4c73be548196097fbe2f1426c3d1d556f

[workflow:call]
name=FreeBayes germline variants
description=Call SNPs and indels from a prepared BAM, normalize, soft-filter and index. Sample names come from BAM read groups.
inputs=alignment,reference,ploidy,min-mapq,min-baseq,min-qual,min-depth,min-alt-count,min-alt-fraction
outputs=reference,reference-index,calls,normalized,variants,variants-index,pass-variants,pass-index,variant-stats,pass-stats
steps=copy-reference,index-reference,call,normalize,filter,index-variants,variant-stats,pass-only,pass-index,pass-stats

[input:call:alignment]
label=Prepared coordinate-sorted BAM
type=file
required=true
filter=BAM|*.bam

[input:call:reference]
label=Reference genome
type=file
required=true
filter=Uncompressed FASTA reference|*.fa;*.fasta;*.fna|All files|*.*
help=Uncompressed FASTA. Workflows that build an index copy this file into the run folder first.

[input:call:ploidy]
label=Assumed ploidy
type=choice
required=true
default=2
choices=1:Haploid (1)|2:Diploid (2)
help=Uniform ploidy across all contigs. Use region-aware downstream workflows for mixed-ploidy chromosomes; this field does not infer sex or karyotype.

[input:call:min-mapq]
label=Minimum mapping quality
type=integer
required=true
default=20
min=0
max=60

[input:call:min-baseq]
label=Minimum base quality
type=integer
required=true
default=20
min=0
max=93

[input:call:min-qual]
label=Variant quality threshold
type=integer
required=true
default=20
min=0
max=100000

[input:call:min-depth]
label=Sample depth threshold
type=integer
required=true
default=5
min=0
max=1000000
help=Calls below the quality or sample-depth threshold are labelled LowQual, not deleted.

[input:call:min-alt-count]
label=Minimum alternate observations
type=integer
required=true
default=2
min=1
max=1000000

[input:call:min-alt-fraction]
label=Minimum alternate allele fraction
type=choice
required=true
default=0.2
choices=0.01:1%|0.05:5%|0.1:10%|0.2:20%|0.3:30%
help=FreeBayes candidate threshold; choose for the assay and ploidy. This is a germline workflow.

[output:call:reference]
label=Working reference
path=reference.fa
final=false
nonempty=true

[output:call:reference-index]
label=Reference index
path=reference.fa.fai
final=false
nonempty=true

[output:call:calls]
label=Raw calls
path=calls.vcf
final=false
nonempty=true

[output:call:normalized]
label=Normalized unfiltered calls
path=normalized.bcf
final=false
nonempty=true

[output:call:variants]
label=All normalized calls with filter labels
path=variants.vcf.gz
final=true
nonempty=true

[output:call:variants-index]
label=All-call VCF index
path=variants.vcf.gz.csi
final=true
nonempty=true

[output:call:pass-variants]
label=PASS calls only
path=variants.pass.vcf.gz
final=true
nonempty=true

[output:call:pass-index]
label=PASS VCF index
path=variants.pass.vcf.gz.csi
final=true
nonempty=true

[output:call:variant-stats]
label=All-call statistics
path=variant-stats.txt
final=true
nonempty=true

[output:call:pass-stats]
label=PASS-call statistics
path=variants.pass.stats.txt
final=true
nonempty=true

[step:call:copy-reference]
label=Stage a private reference copy
kind=copy
source={input:reference}
destination=reference

[step:call:index-reference]
label=Index reference
kind=exec
tool=samtools
produces=reference-index
arg.0=faidx
arg.1={output:reference}

[step:call:call]
label=Call germline variants with FreeBayes
kind=exec
tool=freebayes
stdout=calls
arg.0=-f
arg.1={output:reference}
arg.2=-p
arg.3={input:ploidy}
arg.4=-m
arg.5={input:min-mapq}
arg.6=-q
arg.7={input:min-baseq}
arg.8=-C
arg.9={input:min-alt-count}
arg.10=-F
arg.11={input:min-alt-fraction}
arg.12=--strict-vcf
arg.13={input:alignment}

[step:call:normalize]
label=Normalize alleles against the reference
kind=exec
tool=bcftools
produces=normalized
arg.0=norm
arg.1=-f
arg.2={output:reference}
arg.3=-m
arg.4=-any
arg.5=-Ob
arg.6=-o
arg.7={output:normalized}
arg.8={output:calls}

[step:call:filter]
label=Label calls below the selected thresholds
kind=exec
tool=bcftools
produces=variants
arg.0=filter
arg.1=-m
arg.2=+
arg.3=-s
arg.4=LowQual
arg.5=-e
arg.6=QUAL<{input:min-qual} || FORMAT/DP<{input:min-depth}
arg.7=-Oz
arg.8=-o
arg.9={output:variants}
arg.10={output:normalized}

[step:call:index-variants]
label=Index the VCF
kind=exec
tool=bcftools
produces=variants-index
arg.0=index
arg.1=--csi
arg.2={output:variants}

[step:call:variant-stats]
label=Summarize variants
kind=exec
tool=bcftools
stdout=variant-stats
arg.0=stats
arg.1={output:variants}

[step:call:pass-only]
label=Write a separate PASS-only VCF
kind=exec
tool=bcftools
produces=pass-variants
arg.0=view
arg.1=-f
arg.2=PASS
arg.3=-Oz
arg.4=-o
arg.5={output:pass-variants}
arg.6={output:variants}

[step:call:pass-index]
label=Index PASS calls
kind=exec
tool=bcftools
produces=pass-index
arg.0=index
arg.1=--csi
arg.2={output:pass-variants}

[step:call:pass-stats]
label=Summarize PASS calls
kind=exec
tool=bcftools
stdout=pass-stats
arg.0=stats
arg.1={output:pass-variants}
